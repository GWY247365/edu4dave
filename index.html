<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math Quiz">
<meta name="theme-color" content="#0698da">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Math Quiz · 10 Questions</title>

<style>
:root{
  --brand:#0698da;
  --brand-deep:#0578ae;
  --brand-soft:#e6f5fc;
  --brand-soft-2:#cdebf8;
  --ink:#0f172a;
  --ink-2:#344054;
  --ink-3:#6b7280;
  --ink-4:#98a2b3;
  --bg:#f4f8fb;
  --card:#ffffff;
  --border:#e1e6ec;
  --border-soft:#eef1f4;
  --ok:#16a34a;
  --ok-soft:#ecfdf3;
  --ok-deep:#15803d;
  --warn:#d97706;
  --warn-soft:#fffaeb;
  --warn-deep:#b45309;
  --bad:#dc2626;
  --bad-soft:#fef2f2;
  --bad-deep:#b91c1c;
  --shadow-card:0 1px 3px rgb(15 23 42 / .06), 0 1px 2px rgb(15 23 42 / .04);
  --shadow-pop:0 10px 15px -3px rgb(15 23 42 / .08), 0 4px 6px -4px rgb(15 23 42 / .05);
  --shadow-brand:0 4px 14px -2px rgb(6 152 218 / .35);
  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
.tabular{font-variant-numeric:tabular-nums}

.shell{max-width:960px;margin:0 auto;padding:12px 16px 96px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 4px;margin:0 -4px 10px;background:linear-gradient(180deg,rgba(244,248,251,.96) 70%,rgba(244,248,251,0));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0698da 0%,#0578ae 100%);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:var(--shadow-brand);flex-shrink:0}
.brand-text h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand-text p{margin:1px 0 0;font-size:12px;color:var(--ink-3);font-weight:500}

.timer{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:16px;box-shadow:var(--shadow-card);transition:all .2s ease}
.timer .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s ease-in-out infinite}
.timer.warn{background:var(--warn-soft);border-color:#fde68a;color:var(--warn-deep)}
.timer.warn .dot{background:var(--warn)}
.timer.danger{background:var(--bad-soft);border-color:#fecaca;color:var(--bad-deep)}
.timer.danger .dot{background:var(--bad)}
.timer.over{background:var(--bad-soft);border-color:#fecaca;color:var(--bad-deep)}
.timer.over .dot{background:var(--bad);animation:pulse 1s ease-in-out infinite}
.timer.done{opacity:.6}

.btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-size:16px;transition:transform .15s ease, box-shadow .2s ease, background .2s ease;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}
.btn-primary:hover{background:var(--brand-deep)}
.btn-ghost{background:#fff;color:var(--ink-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg)}

.progress{display:flex;gap:5px;margin-bottom:10px}
.progress .seg{flex:1;height:6px;border-radius:3px;background:#e5edf3;transition:background .25s ease}
.progress .seg.filled{background:var(--brand)}
.progress .seg.ok{background:var(--ok)}
/* Hatch texture so correct vs incorrect is distinguishable without relying on
   red/green hue (color-blind friendly). */
.progress .seg.bad{background-color:var(--bad);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.65) 0,rgba(255,255,255,.65) 2px,transparent 2px,transparent 4px)}

.qgrid{display:grid;gap:8px;margin-bottom:8px}
@media (min-width:720px){.qgrid:not(.review){grid-template-columns:1fr 1fr}}

.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-card);transition:border-color .2s, box-shadow .2s}
.qcard.focused{border-color:var(--brand);box-shadow:0 0 0 4px rgba(6,152,218,.12),var(--shadow-card)}
.qcard.ok{border-color:#bbf7d0;background:linear-gradient(180deg,#f0fdf4 0%,#fff 60%)}
.qcard.bad{border-color:#fecaca;background:linear-gradient(180deg,#fef2f2 0%,#fff 60%)}

.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qnum{width:24px;height:24px;border-radius:7px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.qcard.ok .qnum{background:var(--ok-soft);color:var(--ok-deep)}
.qcard.bad .qnum{background:var(--bad-soft);color:var(--bad-deep)}
.qtag{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.qstatus{margin-left:auto;font-size:13px;font-weight:600}
.qstatus.ok{color:var(--ok-deep)}
.qstatus.bad{color:var(--bad-deep)}

.qrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.expr{font-family:'Inter',var(--font);font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:8px;flex:1;min-width:0}
.expr.expr-scaffold{font-size:20px}
.expr .scaffold-line{font-variant-numeric:tabular-nums;line-height:1.3}
.expr .op{color:var(--brand);font-weight:700}
.expr .eq{color:var(--ink-3)}

.ansbox{width:120px;height:50px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;outline:none;transition:border-color .15s, box-shadow .15s, background .15s;-moz-appearance:textfield;padding:0 6px;flex-shrink:0}
.ansbox::-webkit-outer-spin-button,.ansbox::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ansbox:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(6,152,218,.18)}
.ansbox.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-deep)}
.ansbox.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-deep);text-decoration:line-through;text-decoration-color:rgba(220,38,38,.5);text-decoration-thickness:2px}

.correct-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok-deep);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;border:1px solid #bbf7d0}
.correct-pill .ar{color:var(--ink-3);font-weight:500;margin-right:2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}

.diag{margin-top:10px;padding:10px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px}
.diag-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--warn-deep);margin-bottom:8px;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.diag-head .ico{width:22px;height:22px;border-radius:6px;background:var(--warn);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.diag p{margin:4px 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.diag .why{font-weight:600;color:var(--warn-deep)}
.diag .work{margin-top:8px;font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:14px;line-height:1.55;background:#fff;border:1px dashed #fed7aa;border-radius:8px;padding:10px 12px;white-space:pre-wrap;color:var(--ink);overflow-x:auto}
.diag .work-toggle{margin-top:8px;font-size:13px;padding:6px 12px;background:transparent;border:1px dashed #fed7aa;color:var(--warn-deep)}
.diag .work b{color:var(--brand-deep);font-weight:700}
.wgrid{--cell:32px;display:inline-block;margin:6px 0 12px;background:#fbfdff;border:1px solid #c7d4e2;border-radius:4px;background-image:linear-gradient(#dde6f0 1px,transparent 1px),linear-gradient(90deg,#dde6f0 1px,transparent 1px);background-size:var(--cell) var(--cell);background-position:0 0;vertical-align:top}
.wrow{display:flex;align-items:center;height:var(--cell);margin:0;padding:0}
.wcell{flex:0 0 var(--cell);width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;line-height:1;font-size:18px;box-sizing:border-box}
.wcell.op{font-weight:600;color:var(--ink)}
.wcell.bw{color:var(--brand-deep);font-weight:700;font-size:12px;align-items:flex-start;padding-top:3px;letter-spacing:-.5px}
.wcell.sign{color:var(--brand);font-weight:700;font-size:18px}
.wcell.sum{color:var(--brand-deep);font-weight:800;font-size:20px}
.wline{height:2px;background:var(--ink-2);margin:0;width:100%;align-self:end}
.wsteps{margin-top:6px;font-size:13px;color:var(--ink-2);line-height:1.5}
.wsteps b{color:var(--brand-deep)}
.diag .tip{margin-top:8px;font-size:13px;color:var(--warn-deep);display:flex;gap:6px;align-items:flex-start}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,248,251,0),rgba(244,248,251,.97) 40%);display:flex;justify-content:center}
.actionbar-inner{display:flex;gap:10px;width:100%;max-width:960px}
.btn-big{flex:1;height:52px;font-size:17px;font-weight:700;border-radius:14px;letter-spacing:.01em}
.btn-big.btn-primary{box-shadow:0 6px 20px -4px rgba(6,152,218,.45)}

.foot{text-align:center;color:var(--ink-4);font-size:12px;font-weight:500;letter-spacing:.04em;padding:8px 0 4px;margin-top:4px}
.foot-version{margin-top:4px;font-size:11px;font-weight:400;color:var(--ink-4);opacity:.8}
.foot .heart{color:#dc2626}

.summary{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow-card);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.summary .score{font-size:42px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.summary .score .total{color:var(--ink-4);font-size:28px;font-weight:600}
.summary .label{font-size:14px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.summary .msg{flex:1;min-width:200px}
.summary .msg h2{margin:0 0 4px;font-size:22px;font-weight:700}
.summary .msg p{margin:0;color:var(--ink-3);font-size:14px}
.summary .msg p.praise{margin-top:6px;color:var(--ok-deep);font-weight:600}
.summary .breakdown{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;font-size:13px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok-deep)}
.chip.bad{background:var(--bad-soft);color:var(--bad-deep)}
.chip.time{background:var(--brand-soft);color:var(--brand-deep)}
.chip.time.over{background:var(--bad-soft);color:var(--bad-deep)}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:50;padding:24px;animation:fade .2s ease;overflow-y:auto}
.modal{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:24px;text-align:center;box-shadow:0 25px 50px -12px rgba(15,23,42,.25);max-height:88vh;overflow-y:auto}
.modal .ico-big{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;font-size:32px}
.modal h2{margin:0 0 8px;font-size:22px;font-weight:700}
.modal p{margin:0 0 20px;color:var(--ink-3);font-size:15px;line-height:1.5}

/* ---------- Stats UI ---------- */
.iconbtn{appearance:none;border:1px solid var(--border);background:#fff;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:18px;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .15s ease, background .2s}
.iconbtn:hover{background:var(--bg)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.close{width:32px;height:32px;font-size:14px;border-radius:8px;color:var(--ink-3)}

.review-badge{font-size:11px;font-weight:700;color:var(--warn-deep);background:var(--warn-soft);border:1px solid #fde68a;padding:2px 8px;border-radius:9999px;letter-spacing:.04em}
.pretip{margin-top:8px;font-size:13px;color:var(--brand-deep);background:var(--brand-soft);border:1px solid var(--brand-soft-2);border-radius:10px;padding:8px 12px;line-height:1.45}
.teach-wrap{margin-top:8px}
.teach-btn{font-size:13px;padding:7px 12px}
.teach-out{margin-top:8px;font-size:14px;line-height:1.55;color:var(--ink-2);background:#fff;border:1px dashed var(--brand-soft-2);border-radius:8px;padding:0;max-height:0;overflow:hidden;transition:max-height .2s,padding .2s}
.teach-out:not(:empty){padding:10px 12px;max-height:600px}
.teach-out.err{color:var(--bad-deep);border-color:#fecaca}
.focus-btn{width:100%;margin-top:10px}
.lesson-modal{max-width:460px;text-align:left}
.lesson-modal .ico-big{background:var(--brand-soft);color:var(--brand-deep)}
.lesson-modal h2{text-align:center}
.lesson-h{margin:14px 0 4px;font-size:14px;font-weight:700;color:var(--brand-deep);text-transform:uppercase;letter-spacing:.04em}
.lesson-p{margin:4px 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.lesson-note{margin:8px 0 0;font-size:13px;color:var(--ink-3);line-height:1.5}
.lesson-groups{display:flex;gap:10px;justify-content:center;margin:10px 0}
.lesson-plate{background:#fff;border:2px solid var(--brand-soft-2);border-radius:50%;width:74px;height:74px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:6px}
.lesson-dot{font-size:18px;line-height:1}
.lesson-eqn{font-size:24px;font-weight:700;text-align:center;color:var(--ink);margin:8px 0;font-variant-numeric:tabular-nums}
.lesson-eqn b{color:var(--ok-deep)}
.lesson-actions{display:flex;gap:10px;margin-top:18px}
.lesson-actions .btn-ghost{flex:0 0 auto}
.lesson-actions .btn-big{flex:1}
.div-actions{display:flex;gap:10px;margin-top:8px}
.div-actions .btn{flex:1}
.area-model{display:flex;gap:6px;margin:10px 0}
.area-cell{flex:2;background:var(--brand-soft);border:2px solid var(--brand-soft-2);border-radius:8px;padding:14px 8px;text-align:center;font-size:14px;color:var(--ink-2);line-height:1.5}
.area-cell.ones{flex:1;background:var(--ok-soft);border-color:#bbf7d0}
.area-cell b{font-size:20px;color:var(--brand-deep)}
.area-cell.ones b{color:var(--ok-deep)}
/* Fractions */
.frac-row{align-items:center;gap:16px}
.frac-q{flex:1;min-width:0}
.frac-prompt{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.frac-vis{display:flex;width:100%;max-width:280px;height:40px;border:2px solid var(--brand-deep);border-radius:6px;overflow:hidden}
.frac-cell{flex:1;border-right:1px solid var(--brand-soft-2)}
.frac-cell:last-child{border-right:none}
.frac-cell.on{background:var(--brand)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.frac-num,.frac-den{font-size:26px;line-height:1.1;padding:0 6px}
.frac-line{height:3px;background:var(--ink);width:100%;min-width:28px;margin:2px 0}
.frac-line.wide{min-width:80px}
.frac-expr{font-size:30px;display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap}
.frac-answer{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.frac-in{width:74px;height:48px;font-size:24px;text-align:center}
.frac-num-in{width:64px;height:44px;font-size:22px;text-align:center}
.fcmp{display:flex;gap:8px}
.fcmp-btn{width:48px;height:52px;font-size:24px;font-weight:800;border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;font-family:inherit}
.fcmp-btn.chosen{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.fcmp-btn.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-deep)}
.fcmp-btn.wrongpick{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-deep);text-decoration:line-through}
.fcmp-btn:disabled{cursor:default}

.streak-chip{appearance:none;border:1px solid #fde68a;background:linear-gradient(135deg,#fff7ed,#ffedd5);color:#9a3412;font-family:inherit;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:9999px;cursor:pointer;font-size:14px;box-shadow:var(--shadow-card);transition:transform .15s ease}
.streak-chip:active{transform:scale(.94)}
.streak-chip .fire{font-size:14px;animation:flicker 2.4s ease-in-out infinite}
.streak-chip .streak-num{font-variant-numeric:tabular-nums}
.streak-chip.hot{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#fca5a5;color:#991b1b}
.streak-chip.hot .fire{font-size:16px;animation:flicker 1.6s ease-in-out infinite}
.streak-chip.atrisk{background:linear-gradient(135deg,#fff7ed,#fed7aa);border-color:#fb923c;color:#9a3412}
.mine-streak.atrisk{color:var(--warn-deep)}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg);opacity:1}50%{transform:scale(1.15) rotate(3deg);opacity:.85}}

.bucket-grid{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.bucket-op{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 2px}
.bucket-row{display:flex;align-items:center;gap:10px;font-size:13px}
.bucket-lbl{flex:0 0 110px;color:var(--ink-2)}
.bucket-bar{flex:1;height:7px;background:var(--border-soft);border-radius:4px;overflow:hidden}
.bucket-bar-fill{height:100%;background:var(--brand);transition:width .3s ease}
.bucket-bar-fill.good{background:var(--ok)}
.bucket-bar-fill.low{background:var(--bad)}
.bucket-num{flex:0 0 44px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}

.stats-modal{max-width:600px;text-align:left;padding:20px}
.stats-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stats-head h2{margin:0}
.stats-empty{text-align:center;color:var(--ink-3);padding:18px 0}
.stats-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:480px){.stats-tiles{grid-template-columns:repeat(2,1fr)}}
.stat-tile{background:var(--brand-soft);border:1px solid var(--brand-soft-2);border-radius:10px;padding:10px 8px;text-align:center}
.stat-val{font-size:22px;font-weight:800;color:var(--brand-deep);font-variant-numeric:tabular-nums;line-height:1.1}
.stat-label{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.stats-line{margin:6px 0 4px;font-size:13px;color:var(--ink-3)}
.mastery-meter{height:8px;background:var(--border-soft);border-radius:5px;overflow:hidden;margin:0 0 10px}
.mastery-fill{height:100%;background:var(--brand);border-radius:5px;transition:width .4s ease}
.mastery-fill.high{background:var(--ok)}
.mastery-fill.low{background:var(--warn)}
.mine-modal{max-width:460px;text-align:left}
.mine-modal h2{text-align:left}
.mine-streak{margin:0 0 14px;font-size:15px;color:var(--brand-deep);font-weight:600;line-height:1.4}
.mine-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mine-card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mine-emoji{font-size:22px}
.mine-name{font-size:17px;font-weight:700;color:var(--ink);flex:1}
.mine-stage{font-size:14px;font-weight:700;color:var(--ink-2)}
.mine-card .mastery-meter{height:12px;margin:0 0 10px}
.mine-go{width:100%;height:48px;font-size:16px}
.mine-start{margin:0 0 14px}
.mine-next{margin:6px 0 0;font-size:14px;color:var(--ink-3);text-align:center}

<script>
const TIME_LIMIT_SEC = 10 * 60;
const WARN_AT = 60;
const DANGER_AT = 30;

const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* ---------- Stats: localStorage-backed per-fact tracking ---------- */
const STATS_KEY = 'mathquiz.stats.v1';
function todayKey(d) {
  d = d || new Date();
  // UTC so all devices agree on "what day is it" — picks one rollover moment
  // worldwide instead of letting timezone swings break the streak.
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function dayDiff(a, b) {
  const da = new Date(a + 'T00:00:00Z');
  const db = new Date(b + 'T00:00:00Z');
  return Math.round((db - da) / 86400000);
}
const Stats = (() => {
  // FSRS-lite scheduling constants
  const FAST_MS = 6000;      // fluency threshold for single mul facts
  // Multi-step questions take longer even when fluent — one global 6s bar
  // made 'fluent' unreachable for them and suppressed stability growth.
  const FAST_BY_SKILL = { div: 8000, bigmul: 25000, fractions: 15000, longdiv: 25000, multi: 45000, geo: 20000, mul2: 45000 };
  const STAB_FLUENT = 12;    // days of stability needed to count a fact as mastered
  const STAB_MAX = 400;      // cap on stability (days)
  // Bayesian Knowledge Tracing params → a calibrated P(known) per fact.
  const BKT = { L0: 0.2, T: 0.15, S: 0.1, G: 0.2 }; // prior, learn, slip, guess
  function bktUpdate(pL, correct) {
    const prior = (pL == null) ? BKT.L0 : pL;
    const cond = correct
      ? (prior * (1 - BKT.S)) / (prior * (1 - BKT.S) + (1 - prior) * BKT.G)
      : (prior * BKT.S) / (prior * BKT.S + (1 - prior) * (1 - BKT.G));
    return cond + (1 - cond) * BKT.T; // account for learning this opportunity
  }

  // Migrate an old {right,wrong,lastSeen} fact to the FSRS-lite shape.
  function migrateFact(f) {
    if (!f) return f;
    if (f.stab != null) return f;
    const right = f.right || 0, wrong = f.wrong || 0, last = f.lastSeen || 0;
    let stab;
    if (right >= 3 && wrong === 0) stab = 14;
    else if (right > wrong) stab = 2;
    else if (right > 0) stab = 1;
    else stab = 0.5;
    // Seed P(known) from Laplace-smoothed accuracy; live BKT refines it.
    const pL = (right + 1) / (right + wrong + 2);
    return { right, wrong, lastSeen: last, stab, last, recent: '', avgT: null, fast: 0, pL };
  }
  function migrateFacts(facts) {
    facts = facts || {};
    for (const k in facts) facts[k] = migrateFact(facts[k]);
    // Backfill P(known) for pre-BKT records: without it they count as the
    // 0.2 prior in overallMulMastery, dragging the difficulty band far below
    // the child's real level (observed in the field: 45 legacy facts held a
    // practicing-level learner at novice for months). Estimate by replaying
    // the recent-history string through the BKT update; fall back to capped
    // right/wrong counts.
    for (const k in facts) {
      // New answers are capped at 30s before they enter the average, so an
      // average above 30s can only be legacy contamination (a tablet left
      // idle mid-question). Cap it now rather than waiting ~8 answers for the
      // average to decay — until then the item can never reach 'fluent'.
      const g = facts[k];
      if (g && typeof g.avgT === 'number' && g.avgT > 30000) g.avgT = 30000;
    }
    for (const k in facts) {
      const f = facts[k];
      if (f.pL != null || (f.right || 0) + (f.wrong || 0) === 0) continue;
      let p = BKT.L0;
      const rec = f.recent || '';

        for (let i = 0; i < Math.min(f.wrong || 0, 5); i++) p = bktUpdate(p, false);

  function load() {
    try {

      const d = JSON.parse(raw);

        facts: migrateFacts(d.facts || {}),
        divFacts: migrateFacts(d.divFacts || {}),
        skills: migrateFacts(d.skills || {}),
        hist: d.hist || [],
        snaps: d.snaps || [],
        buckets: d.buckets || {},
        streak: d.streak || { current: 0, best: 0, lastDay: null },
        unlocked: Object.assign({ division: false, bigmul: false, fractions: false, word: false, longdiv: false, multi: false, geo: false, mul2: false }, d.unlocked || {}),
        seen: d.seen || {},
        plans: d.plans || [],
        errlog: d.errlog || [],
        daily: d.daily || { day: null, warmup: false, quiz: false },
        pin: d.pin || null,

  try { repairSnaps(); } catch {}
  function mulKey(a, b) { return a <= b ? `${a}x${b}` : `${b}x${a}`; }

  function retr(f, now) {
    if (!f || !f.stab) return 0; // unseen / no stability → fully "due"
    const days = (now - (f.last || f.lastSeen || 0)) / 86400000;
    return Math.exp(-days / f.stab);

  function skillFast(name) {

    if (name === 'longdiv' || name.indexOf('ldiv.') === 0) return FAST_BY_SKILL.longdiv;

// A quiz built mostly from the child's weakest items.

function focusQuiz(compact) {

      if (!facts.some(x => fkey(x) === fkey(f)) && facts.length < totalCap) facts.push(f);
    }

    const flip = Math.random() < 0.5;
    const a = flip ? f.b : f.a, b = flip ? f.a : f.b;
    qs.push({ type: 'mul', a, b, ans: a * b, label: 'Multiplication · ×', isReview: true });
  });

    .sort((x, y) => Stats.bucketWeight(`${p}:${y.k}`) - Stats.bucketWeight(`${p}:${x.k}`))[0];
  const wa = worstBucket('add'), ws = worstBucket('sub');
  if (compact) {
    // one non-mul slot only: whichever op currently needs it more
    const wAdd = wa ? Stats.bucketWeight(`add:${wa.k}`) : 1;
    const wSub = ws ? Stats.bucketWeight(`sub:${ws.k}`) : 1;
    if (wAdd >= wSub) qs.push(genAdd(wa ? wa.k : null));
    else qs.push(genSub(ws ? ws.k : null));
  } else {
    for (let i = 0; i < 2; i++) qs.push(genAdd(wa ? wa.k : null));
    for (let i = 0; i < 2; i++) qs.push(genSub(ws ? ws.k : null));
  }
  for (let i = qs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qs[i], qs[j]] = [qs[j], qs[i]];

}

/* ---------- Diagnostic engine ---------- */
function diagFraction(q) {
  if (q.type === 'fnam') {
    const gn = Number(q.givenNum), gd = Number(q.givenDen);
    const work = `${q.shaded} of ${q.den} equal parts are shaded → <b>${q.shaded}/${q.den}</b>.`;
    if (q.givenNum === '' && q.givenDen === '' || q.givenNum == null) return { why: 'You left this blank.', work, tip: 'Top = shaded parts, bottom = total parts.' };
    if (gn === q.den && gd === q.shaded) return { why: `You flipped it. The top is the shaded parts (${q.shaded}), the bottom is the total parts (${q.den}).`, work, tip: 'Top = part you have. Bottom = whole.' };
    return { why: `Count carefully: ${q.shaded} shaded out of ${q.den} equal parts.`, work, tip: 'Top counts the shaded parts; bottom counts all the parts.' };
  }
  if (q.type === 'feq') {
    const g = Number(q.given), m = q.d2 / q.d1, work = `${q.n1}/${q.d1}: multiply top and bottom by ${m} → ${q.n1 * m}/${q.d2}.`;
    if (q.given === '' || !Number.isFinite(g)) return { why: 'You left this blank.', work, tip: `Multiply top and bottom by ${m}.` };
    if (g === q.d2) return { why: `${q.d2} is the bottom number. You need the new top.`, work, tip: `Multiply the top (${q.n1}) by ${m}.` };
    if (g === q.n1) return { why: `You kept the top the same. The bottom grew ${m}×, so the top must too.`, work, tip: `${q.n1} × ${m} = ${q.ans}.` };
    return { why: `To keep the same value, multiply top and bottom by the same number (${m}).`, work, tip: `${q.n1} × ${m} = ${q.ans}.` };
  }
  // fcmp
  const work = `Make the bottoms match: ${q.n1}/${q.d1} = ${q.n1 * q.d2}/${q.d1 * q.d2}, ${q.n2}/${q.d2} = ${q.n2 * q.d1}/${q.d1 * q.d2}. So ${q.n1}/${q.d1} <b>${q.ans}</b> ${q.n2}/${q.d2}.`;
  let tip;
  if (q.d1 === q.d2) tip = 'Same bottom — the bigger top is bigger.';
  else if (q.n1 === q.n2) tip = 'Same top — more pieces means each piece is smaller.';
  else tip = 'Give both fractions the same bottom number, then compare the tops.';
  return { why: q.given ? `Not quite — ${q.n1}/${q.d1} ${q.ans} ${q.n2}/${q.d2}.` : 'You didn\'t pick one.', work, tip };
}

// Remainder and long-division mistakes each need different teaching: a

  if (q.type === 'geo') return diagGeo(q, String(given == null ? '' : given).trim() === '' ? NaN : Number(given));

// Word problems: separate a SCHEMA error (the wrong operation, usually from
// keyword-matching) from an arithmetic slip on the right plan. The two need
// completely different teaching, so the diagnosis never blurs them.
// What the story is asking for, in one sentence per schema variant.
function wordReason(q) {
  return ({
    result: 'This one starts with an amount and adds more — the question wants the TOTAL.',
    change: 'You know the start and the end — the question wants the CHANGE in between, so you take away.',
    start: 'You know what is LEFT and what went away — to get back to the start you put them together.',
    'more-add': 'The unknown person has MORE, so their amount is the other amount plus the difference.',
    'more-sub': 'The unknown person has FEWER — the difference must come off, even though the story says "more".',
    groups: 'Equal groups: the same amount in each group, so you multiply.',
    times: '"Times as many" means groups of the same amount — multiply.',
    each: 'One whole shared into equal parts, asking for the size of a part — divide.',
    howmany: 'One whole split into parts of a known size, asking how many parts — divide.',

  }
  if (g === q.trap) {
    return {
      why: `That is the answer to the wrong operation. Words like "more", "gave away" or "altogether" do not always mean the operation they sound like — the STORY decides.`,
      work: plan,
      tip: asks,
    };

    return { why: `${g} doesn't match this story. Start from what the question is asking for.`, work: plan, tip: asks };

    why: `Your plan was right — ${q.op} is the correct step — but the arithmetic came out as ${g} instead of ${q.ans}.`,

    tip: 'Good reading! Slow down on the calculation and check it once.',

}

// Two-step problems: the listed wrong answers each carry their own reason
// (stopped after step 1, one operation for everything, a leftover mishandled).

function multiMiss(q, g) {

function diagMulti(q, g) {

  if (m.cls === 'blank') return { why: 'You left this one blank.', work, tip: q.plan };

function diagBigMul(q, g) {
  const a = q.a, b = q.b, ans = a * b;

  const onesProd = ones * b, tensProd = tens * b;

function buildBigMulWork(a, b) {
  const ones = a % 10, tens = Math.floor(a / 10) * 10;
  return [
    `${a} × ${b} = ?`,
    `Break ${a} into ${tens} + ${ones}`,
    `${tens} × ${b} = ${tens * b}`,
    `${ones} × ${b} = ${ones * b}`,
    `Add: ${tens * b} + ${ones * b} = <b>${a * b}</b>`,

  return { why: `You were off by ${Math.abs(diff)}. The times-table fact didn't come out right.`, work: buildMulWork(a, b), tip: `Practice the ${a} times table: ${a}×1 all the way up to ${a}×12.` };

  if (diff === 110) return { why: 'You missed both borrows (off by 110).', work: buildSubWork(a, b), tip: 'Check each column: top smaller than bottom? Borrow.' };

  if (g === b - a) return { why: 'You swapped the numbers — that was smaller minus bigger.', work: buildSubWork(a, b), tip: `${a} − ${b} means: start with ${a}, take away ${b}.` };

  if (Math.abs(diff) <= 3) return { why: `So close — off by ${Math.abs(diff)}. A small slip in one column.`, work: buildSubWork(a, b), tip: 'Double-check the column right after a borrow.' };

  return { why: `Off by ${Math.abs(diff)} — probably lined up the columns wrong.`, work: buildSubWork(a, b), tip: 'Line up ones under ones, tens under tens, hundreds under hundreds.' };

/* ---------- Solution rendering ---------- */
function buildWork(q) {
  if (q.type === 'mul') return q.big ? buildBigMulWork(q.a, q.b) : buildMulWork(q.a, q.b);
  if (q.type === 'add') return buildAddWork(q.a, q.b);
  if (q.type === 'sub') return buildSubWork(q.a, q.b);
  if (q.type === 'div') return buildDivWork(q.a, q.b);

function buildMulWork(a, b) {
  const ans = a * b;
  let lines = [`${a} × ${b} = ?`];
  if (b === 12) {
    lines.push(`Think: 12 = 10 + 2`);
    lines.push(`${a} × 10 = ${a*10}`);
    lines.push(`${a} ×  2 = ${a*2}`);
    lines.push(`Total   = ${a*10} + ${a*2} = <b>${ans}</b>`);
  } else if (b === 11) {
    lines.push(`Think: 11 = 10 + 1`);
    lines.push(`${a} × 10 = ${a*10}`);
    lines.push(`${a} ×  1 = ${a}`);
    lines.push(`Total   = ${a*10} + ${a} = <b>${ans}</b>`);
  } else if (a === 9 || b === 9) {
    const x = a === 9 ? b : a;
    lines.push(`Trick: 9 × ${x} = 10 × ${x} − ${x}`);
    lines.push(`     = ${10*x} − ${x} = <b>${9*x}</b>`);
  } else {
    if (b > 5) {
      lines.push(`Split: ${b} = 5 + ${b-5}`);
      lines.push(`${a} × 5      = ${a*5}`);
      lines.push(`${a} × ${b-5}      = ${a*(b-5)}`);
      lines.push(`Total       = ${a*5} + ${a*(b-5)} = <b>${ans}</b>`);
    } else {
      let s = '';
      for (let i = 0; i < b; i++) s += (i ? ' + ' : '') + a;
      lines.push(`= ${s}`);
      lines.push(`= <b>${ans}</b>`);
    }
  }
  return lines.join('\n');
}

function gridRow(cells) {
  return '<div class="wrow">' + cells.map(c => {
    const cls = c.cls || '';
    return `<div class="wcell ${cls}">${c.v ?? ''}</div>`;
  }).join('') + '</div>';
}

function buildAddWork(a, b) {
  const sum = a + b;
  const sa = String(a), sb = String(b), ss = String(sum);
  const opW = Math.max(sa.length, sb.length);
  const carries = [];
  let c = 0;
  for (let i = 0; i < opW; i++) {
    const da = i < sa.length ? Number(sa[sa.length - 1 - i]) : 0;
    const db = i < sb.length ? Number(sb[sb.length - 1 - i]) : 0;
    const s = da + db + c;

  }

  const carryCells = [{v:''}];
  for (let i = 0; i < opW; i++) {

    carryCells.push({v: carryIn ? '1' : '', cls: 'bw'});
  }
  const aCells = [{v:''}].concat(sa.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'op'})));
  const bCells = [{v:'+', cls:'sign'}].concat(sb.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'op'})));
  const sCells = (finalCarry ? '1' : ' ').concat((finalCarry ? ss.slice(1) : ss).padStart(opW,' ')).split('').map(d => ({v: d.trim(), cls:'sum'}));
  const colStyle = gridCols(totW);
  const c1 = carries[0], c2 = carries[1];

    gridRow(carryCells) +
    gridRow(aCells) +
    gridRow(bCells) +
    `<div class="wline"></div>` +
    gridRow(sCells) +
    `</div><div class="wsteps">` +
    `Ones: ${a%10} + ${b%10} = ${(a%10)+(b%10)}${c1?' → write '+((a%10)+(b%10))%10+', <b>carry 1</b>':''}<br>` +
    `Tens: ${Math.floor(a/10)%10} + ${Math.floor(b/10)%10}${c1?' + 1':''} = ${(Math.floor(a/10)%10)+(Math.floor(b/10)%10)+c1}${c2?' → write '+((Math.floor(a/10)%10)+(Math.floor(b/10)%10)+c1)%10+', <b>carry 1</b>':''}<br>` +
    `Hundreds: ${Math.floor(a/100)} + ${Math.floor(b/100)}${c2?' + 1':''} = ${Math.floor(a/100)+Math.floor(b/100)+c2}` +
    `</div>`;
}

function buildSubWork(a, b) {

    else borrowed[i] = false;

  const anyBorrow = borrowed.some(Boolean);

  // borrow row: cell shows new value (could be 2-digit) only where it changed
  const bwCells = [{v:''}];
  for (let i = 0; i < opW; i++) {
    const col = opW - 1 - i;
    const v = newA[col] !== aD[col] ? String(newA[col]) : '';

  }
  const aCells = [{v:''}].concat(sa.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'op'})));
  const bCells = [{v:'−', cls:'sign'}].concat(sb.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'op'})));
  const sCells = [{v:''}].concat(ss.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'sum'})));
  const colStyle = gridCols(totW);

  const bo = (b%10), bt = Math.floor(b/10)%10, bh = Math.floor(b/100);
  const newO = b1 ? o + 10 : o;
  const newT = (b1 ? t - 1 : t) + (b2 ? 10 : 0);
  const newH = b2 ? h - 1 : h;
  return `<div class="wgrid" ${colStyle}>` +
    (anyBorrow ? gridRow(bwCells) : '') +
    gridRow(aCells) +
    gridRow(bCells) +
    `<div class="wline"></div>` +
    gridRow(sCells) +
    `</div><div class="wsteps">` +
    `Ones: ${b1 ? `${o} can't take ${bo}. <b>Borrow 1 from tens</b> → ${newO} − ${bo}` : `${o} − ${bo}`} = ${newO - bo}<br>` +
    `Tens: ${b1 ? `after lending, the tens digit is ${t - 1}. ` : ''}${b2 ? `${t - (b1?1:0)} can't take ${bt}. <b>Borrow 1 from hundreds</b> → ${newT} − ${bt}` : `${t - (b1?1:0)} − ${bt}`} = ${newT - bt}<br>` +
    `Hundreds: ${b2 ? `after lending, hundreds digit is ${h - 1}. ${h - 1} − ${bh}` : `${h} − ${bh}`} = ${newH - bh}` +
    (anyBorrow ? `<br><span style="color:var(--ink-3)">(Numbers above each column show its value after borrowing.)</span>` : '') +
    `</div>`;
}

function pad3(n) { return String(n).padStart(3, ' '); }

/* ---------- App state + render ---------- */
// Keep in step with CACHE in sw.js — shown in the page footer so a stale
// service-worker install is diagnosable from the device itself. Bump both
// on every release, and stamp APP_UPDATED with the release date.
const APP_VERSION = 'v68';
const APP_UPDATED = '2026-09-25';
// In-progress quiz survives refreshes/crashes/SW updates: every answer
// keystroke snapshots the session to localStorage; a fresh page load resumes
// it (questions, typed answers, wall-clock timer) unless it's gone stale.
// The engine decides what today's session serves next: warm-up first
// (weak/due items + confusion pairs, immediate corrective feedback), then
// the adaptive mixed quiz (batch, test-like, counts the streak). Extra
// rounds after that are plain mixed quizzes.
function composeDailyStep() {
  const d = Stats.getDaily();
  if (!d.warmup) return { quiz: focusQuiz(true), immediate: true, step: 'warmup' };
  return { quiz: newQuiz(), immediate: false, step: d.quiz ? 'extra' : 'quiz' };
}
const SESSION_KEY = 'mathquiz.session.v1';
function loadSession() {

    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.quiz) || !s.quiz.length) return null;
    if (Date.now() - (s.savedAt || 0) > 12 * 3600 * 1000) return null; // stale — start fresh
    return s;
  } catch { return null; }
}

      quiz: state.quiz, startedAt: state.startedAt, submitted: state.submitted,
      elapsed: Math.max(0, Math.floor((Date.now() - state.startedAt) / 1000)),
      timeUp: state.timeUp, isPractice: state.isPractice, immediate: state.immediate, dailyStep: state.dailyStep,

// Thresholds already crossed by accumulated history must be applied before

const _newlyUnlocked = (() => { try { return Stats.checkUnlocks(); } catch { return null; } })();
const _resumed = loadSession();
// Progress = typed answers, immediate-mode checks, or a submitted review —
// those resume straight into the quiz. An untouched quiz goes back to the
// ready screen (and its unanswered questions still carry over on start).
const _hasProgress = !!_resumed && (_resumed.submitted ||
  (_resumed.quiz || []).some(q => (q.given || '') !== '' || (q.givenNum || '') !== '' || (q.givenDen || '') !== '' ||
    (q.givenQ || '') !== '' || (q.givenR || '') !== '' || q._imm));
const _boot = _resumed ? null : composeDailyStep();
const state = {

  // Resume from recorded QUIZ time, not wall clock — hours away must not
  // show up as overtime.
  startedAt: _hasProgress && _resumed.elapsed != null ? Date.now() - _resumed.elapsed * 1000 : Date.now(),
  remaining: TIME_LIMIT_SEC, // ticker recomputes from startedAt (wall clock)
  submitted: _resumed ? !!_resumed.submitted : false,
  timeUp: _resumed ? !!_resumed.timeUp : false,
  showTimeoutModal: false,
  showStats: false,
  showMine: false,
  showLesson: null,
  isPractice: _resumed ? !!_resumed.isPractice : false,
  immediate: _resumed ? !!_resumed.immediate : _boot.immediate,
  dailyStep: _resumed ? (_resumed.dailyStep || null) : _boot.step,
  finalElapsed: _resumed && _resumed.finalElapsed != null ? _resumed.finalElapsed : null,

let tickHandle = null;
let _tickCount = 0;
function runTicker() {
  clearInterval(tickHandle);
  tickHandle = setInterval(() => {
    if (state.submitted || state.phase !== 'quiz') { clearInterval(tickHandle); tickHandle = null; return; }
    if (++_tickCount % 60 === 0) saveSession(); // checkpoint quiz time ~15s
    const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
    state.remaining = TIME_LIMIT_SEC - elapsed; // may go negative — overtime
    if (state.remaining <= 0 && !state.timeUp) {
      state.timeUp = true;
      state.showTimeoutModal = true;

}
function startTimer() {

// startedAt is wall-clock, so elapsed is correct when we resume.
document.addEventListener('visibilitychange', () => {

function fmt(sec) {
  const sign = sec < 0 ? '+' : '';
  const t = Math.abs(sec);
  const m = Math.floor(t / 60), s = t % 60;

  if (el) el.style.display = '';

  const txt = document.createElement('span'); txt.className='tabular';

  el.classList.toggle('danger', !state.submitted && state.remaining <= DANGER_AT && state.remaining > 0);

// Signature for "same question" — used to keep rerolls honest.
function qSig(q) {
  if (q.type === 'geo') return `geo:${q.gk}:${q.ask}:${JSON.stringify(q.shape)}`;
  if (q.type === 'mul' || q.type === 'div') return `${q.type}:${Math.min(q.a, q.b)}x${Math.max(q.a, q.b)}${q.big ? ':big' : ''}`;
  if (q.type === 'word') return `word:${q.wkind}:${q.wvar}:${q.ans}`;
  if (q.type === 'ldiv') return `ldiv:${q.a}/${q.b}`;
  if (q.type === 'fnam') return `fnam:${q.den}:${q.shaded}`;
  if (q.type === 'feq') return `feq:${q.n1}/${q.d1}=${q.d2}`;
  if (q.type === 'fcmp') return `fcmp:${q.n1}/${q.d1}v${q.n2}/${q.d2}`;
  return `${q.type}:${q.a},${q.b}`;

function startNew() {
  // Anti-fishing: rerolling/refresh must not be an escape hatch. EVERY
  // unanswered question from an abandoned quiz carries over verbatim —
  // including add/sub, or a lucky reroll could fish for easier operands and
  // the quiz would merely LOOK new each time. Answered questions regenerate.
  // Slot-aligned so the composition/size of the fresh step is preserved.
  const isAS = q => q.type === 'add' || q.type === 'sub';
  const unanswered = (!state.submitted && Array.isArray(state.quiz))
    ? state.quiz.filter(q => !answered(q))
        .map(q => ({ ...q, given: '', givenNum: '', givenDen: '', givenQ: '', givenR: '', _t0: undefined, _t1: undefined, _imm: undefined, _retype: undefined, _priorState: undefined }))
    : [];
  const stepInfo = composeDailyStep();
  let fresh = stepInfo.quiz;
  if (unanswered.length) {
    const freshAd = fresh.filter(q => !isAS(q)), freshAS = fresh.filter(isAS);
    // Carry never exceeds the fresh step's slot counts (a step change, e.g.
    // abandoned mixed quiz → warm-up, must not grow the warm-up).
    const carryAd = unanswered.filter(q => !isAS(q)).slice(0, freshAd.length);
    const carryAS = unanswered.filter(isAS).slice(0, freshAS.length);
    const carrySigs = new Set(carryAd.map(qSig));
    // Order-independent swap: fresh duplicates of carried items always drop
    // and count toward the room the carry needs; then exactly the remaining
    // room is vacated from other adaptive slots.
    const freshAdNoDup = freshAd.filter(q => !carrySigs.has(qSig(q)));

  state.submitted = false;
  state.timeUp = false;
  state.showTimeoutModal = false;
  state.finalElapsed = null;
  startTimer();
  saveSession();
  render();
  setTimeout(() => {
    const first = document.querySelector('.ansbox');
    if (first) first.focus();
  }, 50);
}

}

function submit(fromTimeout) {
  if (state.submitted) return;
  if (!state.quiz.some(q => answered(q))) {
    alert("You haven't answered anything yet — give one a try first! ✏️");
    return;
  }
  // Final DOM sweep for plain number boxes. Fraction inputs also carry the
  // .ansbox class but have NO dataset.id (their values live in givenNum/
  // givenDen, persisted on every keystroke) — indexing quiz[NaN] here threw
  // and made Check answers a dead button on any quiz with a fraction row.
  document.querySelectorAll('.ansbox').forEach(inp => {
    const id = Number(inp.dataset.id);
    // Skip immediate-mode questions: after overcorrection the box shows the
    // retyped CORRECT answer, but grading must use the original in .given.
    if (Number.isInteger(id) && state.quiz[id] && !state.quiz[id]._imm) state.quiz[id].given = inp.value.trim();
  });
  state.submitted = true;
  state.finalElapsed = TIME_LIMIT_SEC - state.remaining;
  clearInterval(tickHandle);
  // Persist per-fact / per-bucket stats
  let correctCount = 0;
  state.quiz.forEach(q => {
    const isRight = answerCorrect(q);
    if (isRight) correctCount++;
    // Capture mastery BEFORE recording (recording mutates it) so the
    // diagnosis can fade for a known fact slipped vs a fact still being learned.
    q._priorState = Stats.itemState(q);
    const ms = (q._t0 != null && q._t1 != null) ? (q._t1 - q._t0) : undefined;
    const sc = !!q.scaffold; // assisted answers earn reduced mastery credit
    if (q.type === 'mul' && q.big) Stats.recordSkill('bigmul', isRight, ms, sc);
    else if (q.type === 'mul' && q.a <= 12 && q.b <= 12) Stats.recordMul(q.a, q.b, isRight, ms, sc);
    else if (q.type === 'div' && q.fam) Stats.recordDiv(q.fam[0], q.fam[1], isRight, ms, sc);
    else if (q.type === 'fnam' || q.type === 'feq' || q.type === 'fcmp') {
      Stats.recordSkill('fractions', isRight, ms, sc);          // aggregate (drives unlock/summary)
      Stats.recordSkill('frac.' + q.type, isRight, ms, sc);     // sub-skill (drives adaptive selection)
    }
    else if (q.type === 'word' && q.multi) {
      Stats.recordSkill('multi', isRight, ms, sc);
      Stats.recordSkill('multi.' + q.wkind, isRight, ms, sc);
    }
    else if (q.type === 'word') {
      Stats.recordSkill('word', isRight, ms, sc);
      Stats.recordSkill('word.' + q.wkind, isRight, ms, sc);
    }
    else if (q.type === 'mul2') {
      Stats.recordSkill('mul2', isRight, ms, sc);
      Stats.recordSkill('mul2.' + q.mk, isRight, ms, sc);
    }
    else if (q.type === 'geo') {
      Stats.recordSkill('geo', isRight, ms, sc);
      Stats.recordSkill('geo.' + q.gk, isRight, ms, sc);
    }
    else if (q.type === 'ldiv') {
      Stats.recordSkill('longdiv', isRight, ms, sc);
      Stats.recordSkill('ldiv.' + q.ldk, isRight, ms, sc);
    }
    else if (q.bucket) Stats.recordBucket(q.bucket, isRight);
    if (!isRight) { try { Stats.recordError(errEntry(q)); } catch {} }
  });
  const sessionKind = state.dailyStep === 'warmup' ? 'warmup' : state.immediate ? 'practice' : 'quiz';
  if (!state.isPractice) Stats.recordQuiz(state.quiz.length, correctCount, state.finalElapsed, sessionKind, sessionQuestions(state.quiz));
  if (!state.isPractice && (state.dailyStep === 'warmup' || state.dailyStep === 'quiz')) Stats.markDaily(state.dailyStep);
  // Sound feedback (opt-in via topbar): perfect → triumphant; mostly right →
  // happy chime; otherwise gentle low tone — never punishing. Guarded: an
  // audio-API quirk must never be able to freeze grading.
  try {
    if (correctCount === state.quiz.length) Sound.perfect();
    else if (correctCount / state.quiz.length >= 0.7) Sound.right();
    else Sound.wrong();
  } catch {}
  // Newly cleared a prerequisite? Unlock the next domain and show its lesson.
  const unlocked = state.isPractice ? null : Stats.checkUnlocks();
  pushIfSynced();
  if (unlocked) { state.showLesson = unlocked; }
  saveSession();
  render();
  // scroll to first wrong (or top if all correct), keeping context visible
  setTimeout(() => {
    const firstBad = document.querySelector('.qcard.bad');
    if (firstBad) {
      const y = firstBad.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }, 50);
}

function el(tag, cls, txt) {

// Findings a parent should act on, whether or not they open the panel:
// a stalled habit, a device that is no longer syncing, or the engine having
// run out of difficulty. Deliberately NOT every warning — a dot that is
// always lit teaches people to ignore it.
function parentAlerts() {
  const out = [];
  try {
    for (const c of Stats.engineCheck()) {
      if (c.level === 'bad') out.push(c.label);
      else if (/ceiling/i.test(c.label)) out.push(c.label);
    }
    if (getFamilyCode()) {
      const h = getSyncHealth();
      const stale = !h.lastOk || (Date.now() - h.lastOk) > 48 * 3600 * 1000;
      const failed = h.lastErr && (!h.lastOk || h.lastErr.ts > h.lastOk);
      if (failed) out.push('sync failing');
      else if (stale) out.push('not synced recently');
    }
  } catch {}
  return out;
}

// Unified answer checking (fractions/compare aren't single numbers).
function ldivGiven(q) {
  const gq = String(q.givenQ == null ? '' : q.givenQ).trim();
  const gr = String(q.givenR == null ? '' : q.givenR).trim();
  return { gq, gr, q: gq === '' ? NaN : Number(gq), r: gr === '' ? 0 : Number(gr) }; // blank remainder = 0
}
function answerCorrect(q) {
  if (q.type === 'ldiv') { const g = ldivGiven(q); return g.q === q.ans && g.r === q.rem; }
  if (q.type === 'fnam') return Number(q.givenNum) === q.ansNum && Number(q.givenDen) === q.ansDen;
  if (q.type === 'fcmp') return q.given === q.ans;
  return Number(q.given) === q.ans;
}
function answerText(q) {
  if (q.type === 'ldiv') return `${q.ans} R ${q.rem}`;
  if (q.type === 'fnam') return q.ansNum + '/' + q.ansDen;
  return String(q.ans);
}
function wordKindLabel(k) {
  return { wjoin: 'Join / separate', wcompare: 'Comparing', wgroups: 'Equal groups', wshare: 'Sharing' }[k] || k;
}
function exprText(q) {
  if (q.type === 'mul') return `${q.a} × ${q.b}`;
  if (q.type === 'add') return `${q.a} + ${q.b}`;
  if (q.type === 'sub') return `${q.a} − ${q.b}`;
  if (q.type === 'div') return `${q.a} ÷ ${q.b}`;
  if (q.type === 'feq') return `${q.n1}/${q.d1} = ?/${q.d2}`;
  if (q.type === 'fcmp') return `${q.n1}/${q.d1} ? ${q.n2}/${q.d2}`;
  if (q.type === 'fnam') return 'this fraction';
  if (q.type === 'ldiv') return `${q.a} ÷ ${q.b}`;
  if (q.type === 'mul2') return `${q.a} × ${q.b}`;
  if (q.type === 'word') return q.op || '';
  return '';
}
function answered(q) {
  if (q.type === 'ldiv') return String(q.givenQ || '') !== '' || String(q.givenR || '') !== '';
  if (q.type === 'fnam') return (q.givenNum || '') !== '' || (q.givenDen || '') !== '';
  return (q.given || '') !== '';
}

function renderProgress() {
  const wrap = el('div', 'progress');
  state.quiz.forEach(q => {
    const seg = el('div', 'seg');
    if (state.submitted) {
      seg.classList.add(answerCorrect(q) ? 'ok' : 'bad');
    } else if (answered(q)) {
      seg.classList.add('filled');
    }
    wrap.appendChild(seg);
  });
  return wrap;
}

function renderQuestion(q, idx) {
  const card = el('div', 'qcard');
  const right = state.submitted && answerCorrect(q);
  const wrong = state.submitted && !answerCorrect(q);
  if (right) card.classList.add('ok');
  if (wrong) card.classList.add('bad');

  const head = el('div', 'qhead');
  head.appendChild(el('div', 'qnum', String(idx + 1)));
  head.appendChild(el('div', 'qtag', q.label));
  if (q.isReview && !state.submitted) {
    const rb = el('div', 'review-badge', '↻ Practice');
    rb.title = "You missed this one before — let's nail it this time.";
    head.appendChild(rb);
  }
  if (state.submitted) {
    const st = el('div', 'qstatus ' + (right ? 'ok' : 'bad'),
      right ? '✓ Correct' : '✗ Incorrect');
    head.appendChild(st);
  }
  card.appendChild(head);

  if (q.type === 'word') {
    const story = el('div', 'wstory-wrap');
    story.appendChild(el('p', 'wstory', q.text));
    // Read-aloud: a word problem should measure the maths, not how well an
    // eight-year-old decodes the sentence. Built into iPad Safari, no cost.
    if (canSpeak()) {
      const say = el('button', 'wsay', '🔊 Read to me');
      say.type = 'button';
      say.setAttribute('aria-label', 'Read this problem aloud');
      say.onclick = () => speakText(q.text, say);
      story.appendChild(say);
    }
    card.appendChild(story);
    // Pre-answer scaffold on a schema the child has missed: name the question
    // being asked rather than hint the operation, so the reading stays theirs.
    if (!state.submitted && q.multi && (q.scaffold || q.isReview)) {
      // Learning: name the two steps. Missed before: prompt the check instead.
      const tip = el('div', 'pretip');
      tip.appendChild(spanTxt('🪜 ', null));
      tip.appendChild(spanTxt(q.scaffold ? 'Two steps: ' + q.plan
        : 'Read it twice. What do you need to find first, and what does the question ask for at the end?', null));
      card.appendChild(tip);
    } else if (!state.submitted && q.isReview) {
      const tip = el('div', 'pretip');
      tip.appendChild(spanTxt('💡 ', null));
      tip.appendChild(spanTxt('Read it twice. What is the question actually asking for — a total, a difference, or a share?', null));
      card.appendChild(tip);
    }
  }

  if (q.type === 'geo') {
    card.appendChild(geoFigure(q, !!q.scaffold && !state.submitted));
    card.appendChild(el('p', 'geo-q', q.text));
    if (!state.submitted && (q.scaffold || q.isReview)) {
      const tip = el('div', 'pretip');
      tip.appendChild(spanTxt('💡 ', null));
      tip.appendChild(spanTxt(q.scaffold
        ? (q.ask === 'area' ? 'Count the squares, or multiply: rows × squares in each row.' : 'Count the unit edges all the way around, or add all four sides.')
        : q.plan, null));
      card.appendChild(tip);
    }
  }

  if (q.type === 'ldiv') {
    const row = el('div', 'qrow ldiv-row');
    const expr = el('div', 'expr');
    expr.appendChild(spanTxt(q.a, 'tabular'));
    expr.appendChild(spanTxt('÷', 'op'));
    expr.appendChild(spanTxt(q.b, 'tabular'));
    expr.appendChild(spanTxt('=', 'eq'));
    row.appendChild(expr);
    const box = el('div', 'ldiv-answer');
    const qi = fracInput(q, idx, 'givenQ', '?'); qi.classList.add('ldiv-q');
    qi.setAttribute('aria-label', `Question ${idx + 1}: ${q.a} divided by ${q.b}, the answer`);
    const ri = fracInput(q, idx, 'givenR', '0'); ri.classList.add('ldiv-r');
    ri.setAttribute('aria-label', `Question ${idx + 1}: the remainder`);
    if (state.submitted) { qi.classList.add(right ? 'ok' : 'bad'); ri.classList.add(right ? 'ok' : 'bad'); }
    box.appendChild(qi); box.appendChild(el('span', 'ldiv-R', 'R')); box.appendChild(ri);
    row.appendChild(box);
    if (wrong) { const pill = el('div', 'correct-pill'); pill.appendChild(spanTxt('Answer', 'ar')); pill.appendChild(spanTxt(answerText(q), 'tabular')); row.appendChild(pill); }
    card.appendChild(row);
    if (!state.submitted && q.isReview) {
      const tip = el('div', 'pretip');
      tip.appendChild(spanTxt('💡 ', null));
      tip.appendChild(spanTxt(`Divide, multiply, subtract, bring down. The remainder must be smaller than ${q.b}.`, null));
      card.appendChild(tip);
    }
    if (wrong) card.appendChild(renderDiag(q));
    return card;
  }

  if (q.type === 'fnam' || q.type === 'feq' || q.type === 'fcmp') {
    card.appendChild(renderFractionRow(q, idx, right, wrong));
    if (!state.submitted && q.isReview) {
      const tip = el('div', 'pretip');
      tip.appendChild(spanTxt('💡 ', null));
      tip.appendChild(spanTxt(fracTip(q), null));
      card.appendChild(tip);
    }
    if (wrong) card.appendChild(renderDiag(q));
    return card;
  }

  const row = el('div', 'qrow');
  const expr = el('div', 'expr');
  if (q.scaffold && q.type === 'mul' && q.big) {
    // Completion problem: show the partial products, child fills the final sum.
    const tens = Math.floor(q.a / 10) * 10, ones = q.a % 10;
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(`${q.a} × ${q.b} = ${tens}×${q.b} + ${ones}×${q.b} = ${tens * q.b} + ${ones * q.b} =`, 'scaffold-line'));
  } else if (q.scaffold && q.type === 'mul') {
    // Novice scaffolds for table facts: repeated addition or split-known.
    expr.classList.add('expr-scaffold');
    const s = q.scaffold;
    if (s.kind === 'addition') {
      const parts = Array(s.hi).fill(s.lo).join(' + ');
      expr.appendChild(spanTxt(`${q.a} × ${q.b} = ${parts} =`, 'scaffold-line'));
    } else { // split-known
      const half = Math.floor(s.hi / 2);
      const rest = s.hi - half;
      const partA = s.lo * half, partB = s.lo * rest;
      expr.appendChild(spanTxt(`${q.a} × ${q.b} = (${s.lo}×${half}) + (${s.lo}×${rest}) = ${partA} + ${partB} =`, 'scaffold-line'));
    }
  } else if (q.scaffold && q.type === 'mul2') {
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(mul2Scaffold(q), 'scaffold-line'));
  } else if (q.scaffold && q.type === 'div' && q.scaffold.kind === 'inverse') {
    // Reframe division as inverse multiplication ("7 × ? = 56"), the form
    // the child has already mastered.
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(`${q.a} ÷ ${q.b} → ${q.b} × ▢ = ${q.a}, so the answer is`, 'scaffold-line'));
  } else if (q.scaffold && q.type === 'add' && q.scaffold.kind === 'expand-add') {
    // Expanded form: show each place separately, child adds three small sums.
    const ah = Math.floor(q.a/100), at = Math.floor(q.a/10)%10, ao = q.a%10;
    const bh = Math.floor(q.b/100), bt = Math.floor(q.b/10)%10, bo = q.b%10;
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(`(${ah*100}+${at*10}+${ao}) + (${bh*100}+${bt*10}+${bo}) =`, 'scaffold-line'));
  } else if (q.scaffold && q.type === 'sub' && q.scaffold.kind === 'expand-sub') {
    const ah = Math.floor(q.a/100), at = Math.floor(q.a/10)%10, ao = q.a%10;
    const bh = Math.floor(q.b/100), bt = Math.floor(q.b/10)%10, bo = q.b%10;
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(`(${ah*100}+${at*10}+${ao}) − (${bh*100}+${bt*10}+${bo}) =`, 'scaffold-line'));
  } else {
    expr.appendChild(spanTxt(q.a, 'tabular'));
    expr.appendChild(spanTxt(q.type === 'mul' || q.type === 'mul2' ? '×' : q.type === 'add' ? '+' : q.type === 'sub' ? '−' : '÷', 'op'));
    expr.appendChild(spanTxt(q.b, 'tabular'));
    expr.appendChild(spanTxt('=', 'eq'));
  }
  if (q.type === 'word' || q.type === 'geo') expr.innerHTML = '';
  row.appendChild(expr);

  const inp = document.createElement('input');
  inp.className = 'ansbox';
  inp.type = 'number';
  inp.inputMode = 'numeric';
  inp.pattern = '[0-9]*';
  inp.autocomplete = 'off';
  inp.dataset.id = String(idx);
  inp.value = q.given;
  inp.placeholder = '?';
  if (q.type === 'geo' || q.type === 'word') inp.setAttribute('aria-label', `Question ${idx + 1}: your answer`);
  else inp.setAttribute('aria-label', `Question ${idx + 1}: ${q.a} ${q.type === 'mul' || q.type === 'mul2' ? 'times' : q.type === 'add' ? 'plus' : q.type === 'sub' ? 'minus' : 'divided by'} ${q.b}`);
  if (state.submitted) {
    inp.readOnly = true;
    if (right) inp.classList.add('ok');
    else inp.classList.add('bad');
  } else if (state.immediate && q._imm) {
    if (q._imm === 'right') { card.classList.add('imm-good'); inp.readOnly = true; }
    else if (q._imm === 'fixed') { card.classList.add('imm-fixed'); inp.readOnly = true; inp.value = answerText(q); }
    else if (q._imm === 'fixing') { card.classList.add('imm-fixing'); inp.value = q._retype || ''; }
  }
  inp.addEventListener('focus', () => {
    card.classList.add('focused');
    if (state.quiz[idx]._t0 == null) state.quiz[idx]._t0 = Date.now();
  });
  inp.addEventListener('blur', () => card.classList.remove('focused'));
  inp.addEventListener('input', e => {
    const qq = state.quiz[idx];
    if (state.immediate && qq._imm === 'fixing') {
      // Overcorrection retype: the original wrong answer stays in .given for
      // honest grading/error-log; the retype goes to a scratch field.
      qq._retype = e.target.value;
      if (String(qq._retype).trim() === String(answerText(qq))) immFixed(qq, inp, card);
      return;
    }
    qq.given = e.target.value;
    qq._t1 = Date.now();
    if (qq._t0 == null) qq._t0 = qq._t1;
    saveSession();
    const segs = document.querySelectorAll('.progress .seg');
    if (segs[idx]) segs[idx].classList.toggle('filled', e.target.value !== '');
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (state.immediate && !state.submitted && !state.quiz[idx]._imm &&
          String(state.quiz[idx].given || '').trim() !== '') {
        immCheck(state.quiz[idx], idx, inp, card);
        return;
      }
      const all = [...document.querySelectorAll('.ansbox')];
      const i = all.indexOf(inp);
      if (i + 1 < all.length) all[i+1].focus();
      else inp.blur();
    }
  });
  row.appendChild(inp);
  if (q.type === 'geo') row.appendChild(el('span', 'geo-unit', q.unit));

  if (wrong) {
    const pill = el('div', 'correct-pill');
    pill.appendChild(spanTxt('Answer', 'ar'));
    pill.appendChild(spanTxt(answerText(q), 'tabular'));
    row.appendChild(pill);
  }
  card.appendChild(row);
  if (!state.submitted && state.immediate && q._imm === 'fixing') card.appendChild(buildFixPill(q));

  // Pre-practice strategy card: review questions (learn, then try) and
  // correct-but-slow facts (the child is counting — teach the shortcut).
  if (!state.submitted && (q.isReview || q.isSlow)) {
    let tipText = '';
    if (q.type === 'mul' && q.big) tipText = `Break ${Math.floor(q.a / 10) * 10} + ${q.a % 10}: multiply each by ${q.b}, then add.`;
    else if (q.type === 'mul' && q.a <= 12 && q.b <= 12) tipText = factTip(q.a, q.b);
    else if (q.type === 'div') tipText = `Think: ${q.b} × ? = ${q.a}. Use the ${q.b} times table.`;
    else if (q.type === 'mul2' && !q.scaffold) tipText = q.plan;
    if (tipText) {
      const tip = el('div', 'pretip');
      tip.appendChild(spanTxt(q.isSlow ? '⚡ ' : '💡 ', null));
      if (q.isSlow) tip.appendChild(spanTxt('You know this one — here is a faster way: ', null));
      tip.appendChild(spanTxt(tipText, null));
      card.appendChild(tip);
    }
  }

  if (wrong) card.appendChild(renderDiag(q));
  return card;
}

// Short, kid-friendly multiplication strategy (without giving the answer away).
function factTip(a, b) {
  if (a === 9 || b === 9) { const x = a === 9 ? b : a; return `×9 trick: think ${x}×10, then take away ${x}.`; }
  if (a === 11 && b <= 9) return `×11 trick: ${b}×10, then add ${b}.`;
  if (b === 11 && a <= 9) return `×11 trick: ${a}×10, then add ${a}.`;
  if (a === 12 || b === 12) { const x = a === 12 ? b : a; return `×12: add ${x}×10 and ${x}×2.`; }
  if (a === 5 || b === 5) { const x = a === 5 ? b : a; return `×5 trick: take half of ${x}×10.`; }
  if (a % 2 === 0) return `Double it: work out ${a / 2}×${b}, then double the answer.`;
  if (b % 2 === 0) return `Double it: work out ${a}×${b / 2}, then double the answer.`;
  const lo = Math.min(a, b), hi = Math.max(a, b);
  return `Skip-count by ${lo}, ${hi} times.`;
}

function renderFractionRow(q, idx, right, wrong) {

  } else if (q.type === 'feq') {

  } else { // fcmp
    const expr = el('div', 'expr frac-expr');
    expr.appendChild(fracMini(q.n1, q.d1));
    const choices = el('div', 'fcmp');
    ['<', '=', '>'].forEach(sym => {
      const b = el('button', 'fcmp-btn', sym);

        b.disabled = true;
        if (sym === q.ans) b.classList.add('correct');
        if (q.given === sym && sym !== q.ans) b.classList.add('wrongpick');
      } else {
        if (q.given === sym) b.classList.add('chosen');
        b.onclick = () => {
          state.quiz[idx].given = sym;
          const t = Date.now(); if (state.quiz[idx]._t0 == null) state.quiz[idx]._t0 = t; state.quiz[idx]._t1 = t;
          if (state.immediate) {
            // Buttons can't be retyped — immediate feedback is shown by
            // locking the group with the correct choice highlighted.
            state.quiz[idx]._imm = sym === q.ans ? 'right' : 'fixed';
            try { (sym === q.ans ? Sound.tick : Sound.soft)(); } catch {}
            saveSession();
            render();
            return;
          }
          saveSession();
          choices.querySelectorAll('.fcmp-btn').forEach(x => x.classList.remove('chosen'));

          if (segs[idx]) segs[idx].classList.add('filled');
        };
      }
      choices.appendChild(b);
    });
    expr.appendChild(choices);
    expr.appendChild(fracMini(q.n2, q.d2));
    row.appendChild(expr);
  }
  return row;
}

function teachPayload(q) {
  if (q.type === 'geo') return { type: 'geo', text: q.desc, ans: q.ans, steps: q.steps };
  if (q.type === 'word' && q.multi) return { type: 'word', text: q.text, op: q.op, ans: q.ans, steps: q.steps };
  if (q.type === 'word') return { type: 'word', text: q.text, op: q.op, ans: q.ans };
  if (q.type === 'ldiv') return { type: 'ldiv', a: q.a, b: q.b, q: q.ans, r: q.rem };
  if (q.type === 'fnam') return { type: 'fnam', shaded: q.shaded, den: q.den };
  if (q.type === 'feq') return { type: 'feq', n1: q.n1, d1: q.d1, d2: q.d2, ans: q.ans };
  if (q.type === 'fcmp') return { type: 'fcmp', n1: q.n1, d1: q.d1, n2: q.n2, d2: q.d2, ans: q.ans };
  return { type: q.type, a: q.a, b: q.b };
}

function renderDiag(q) {
  const d = diagnose(q, q.given);
  const wrap = el('div', 'diag');
  const head = el('div', 'diag-head');
  const ico = el('div', 'ico', '!');
  head.appendChild(ico);
  head.appendChild(el('span', null, 'What went wrong · How to do it'));
  wrap.appendChild(head);

  const why = el('p', 'why', d.why);
  wrap.appendChild(why);

  const tip = el('div', 'tip');
  tip.appendChild(spanTxt('💡 ', null));
  tip.appendChild(spanTxt(d.tip, null));
  wrap.appendChild(tip);

  // Progressive disclosure (cognitive load theory): the short why+tip is
  // always shown; the longer worked solution is one tap away. A child who
  // already knows this (slipped) gets a one-line reminder instead of steps.
  const known = q._priorState === 'accurate' || q._priorState === 'fluent';
  if (known) {
    const reminder = el('div', 'work');
    reminder.innerHTML = q.steps
      ? `Quick check — you know how: <b>${q.steps.join('; ')}</b>.`
      : `Quick check — you know this one: <b>${exprText(q)} = ${answerText(q)}</b>.`;
    wrap.appendChild(reminder);
  } else {
    const toggle = el('button', 'btn btn-ghost work-toggle', '📐 Show the steps');
    const work = el('div', 'work');
    work.style.display = 'none';
    work.innerHTML = d.work;
    let open = false;
    toggle.onclick = () => {
      open = !open;
      work.style.display = open ? '' : 'none';
      toggle.textContent = open ? '📐 Hide the steps' : '📐 Show the steps';
    };
    wrap.appendChild(toggle);
    wrap.appendChild(work);
  }

  // AI mini-lesson (kid-facing) — on demand, for all question types
  const teachWrap = el('div', 'teach-wrap');
  const teachBtn = el('button', 'btn btn-ghost teach-btn', '🧠 Teach me this');
  const teachOut = el('div', 'teach-out');
  teachBtn.onclick = async () => {
    teachBtn.disabled = true;
    teachOut.className = 'teach-out';
    teachOut.textContent = 'Thinking…';
    try {
      const res = await fetch('/api/teach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ problem: teachPayload(q) }),
      });
      if (!res.ok) {
        const e = await res.json().catch(() => ({}));
        const err = new Error(e.error || ('error ' + res.status));
        err.status = res.status;
        throw err;
      }
      const data = await res.json();
      teachOut.textContent = data.lesson || '';
      teachBtn.style.display = 'none';
    } catch (e) {
      teachOut.className = 'teach-out err';
      teachOut.textContent = e && e.status === 429
        ? "That's all the AI lessons for today — the worked steps above show how to solve it."
        : "Couldn't load a lesson (needs the deployed backend + API key).";
    } finally {
      teachBtn.disabled = false;
    }
  };
  teachWrap.appendChild(teachBtn);
  teachWrap.appendChild(teachOut);
  wrap.appendChild(teachWrap);
  return wrap;
}

function renderSummary() {
  const total = state.quiz.length;
  const correct = state.quiz.filter(q => answerCorrect(q)).length;
  const wrong = total - correct;
  const ratio = total ? correct / total : 0;
  const wrap = el('div', 'summary');

  const score = el('div');
  score.appendChild(el('div', 'label', state.isPractice ? 'Practice' : 'Your score'));
  const big = el('div', 'score');
  const num = el('span', null, String(correct));
  num.style.color = ratio >= 0.8 ? 'var(--ok-deep)' : ratio >= 0.5 ? 'var(--brand-deep)' : 'var(--bad-deep)';
  big.appendChild(num);
  big.appendChild(spanTxt(' / ' + total, 'total'));
  score.appendChild(big);
  wrap.appendChild(score);

  const msg = el('div', 'msg');
  const elapsed = state.finalElapsed || 0;
  const overtime = elapsed > TIME_LIMIT_SEC;
  const timeStr = fmtElapsed(elapsed);
  const timeNote = overtime ? ` (${fmt(elapsed - TIME_LIMIT_SEC)} over)` : '';
  // Process-praise framing (Dweck): credit effort & strategy, never ability
  // ("smart") and never call work "easy". Tie success to practice.
  let title, sub;
  if (correct === total) { title = 'Perfect score! 🎉'; sub = `All that practice is paying off — every answer correct.`; }
  else if (ratio >= 0.8) { title = 'Your practice is showing!'; sub = `You worked through ${correct} of these. Let's look at the few left.`; }
  else if (ratio >= 0.5) { title = 'Good effort — keep at it!'; sub = `Every one you check below makes the next quiz easier.`; }
  else { title = "Mistakes help your brain grow."; sub = `Let's walk through each one — that's how these facts stick.`; }
  msg.appendChild(el('h2', null, title));
  msg.appendChild(el('p', null, sub));
  wrap.appendChild(msg);

  // Effort attribution: call out "comeback" facts — review items (previously
  // missed/weak) the child got right this time. Concrete process praise.
  const comebacks = state.quiz
    .filter(q => q.isReview && answerCorrect(q))
    .map(q => q.type === 'div' ? `${q.a}÷${q.b}` : (q.type === 'mul' ? `${q.a}×${q.b}` : null))
    .filter(Boolean);
  if (comebacks.length) {
    const names = comebacks.slice(0, 3).join(', ');
    const more = comebacks.length > 3 ? ' and more' : '';
    msg.appendChild(el('p', 'praise', `💪 You nailed ${names}${more} — facts you used to miss. That's your practice working, not luck!`));
  }

  const breakdown = el('div', 'breakdown');
  breakdown.appendChild(chip('ok', `✓ ${correct} correct`));
  breakdown.appendChild(chip('bad', `✗ ${wrong} missed`));
  breakdown.appendChild(chip(overtime ? 'time over' : 'time', `⏱ ${timeStr}`));
  wrap.appendChild(breakdown);
  return wrap;
}

function fmtElapsed(sec) {
  // Always positive elapsed time, no leading +
  const t = Math.max(0, sec);
  const m = Math.floor(t / 60), s = t % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function chip(kind, text) {
  const c = el('span', 'chip ' + kind);
  c.appendChild(spanTxt(text, null));

}

function closeMine() { state.showMine = false; render(); }
function masteryStage(pct) {
  if (pct >= 90) return { emoji: '⭐', label: 'Star' };
  if (pct >= 70) return { emoji: '🌳', label: 'Strong' };
  if (pct >= 40) return { emoji: '🌿', label: 'Growing' };
  return { emoji: '🌱', label: 'Seedling' };
}
// Kid-facing open learner model: shows growth and lets the child choose what
// to practice (autonomy + competence). Encouraging, growth-mindset framing.
function renderMineModal() {
  const s = Stats.summary();
  const bg = el('div', 'modal-bg');
  bg.addEventListener('click', e => { if (e.target === bg) closeMine(); });
  const m = el('div', 'modal mine-modal');

  const head = el('div', 'stats-head');
  head.appendChild(el('h2', null, '🌱 My Progress'));
  const closeBtn = el('button', 'iconbtn close', '✕');
  closeBtn.onclick = closeMine;
  head.appendChild(closeBtn);
  m.appendChild(head);

  const sk = s.streak;
  if (sk.current > 0 && sk.atRisk) m.appendChild(el('p', 'mine-streak atrisk', `⚠️ Your ${sk.current}-day streak is on the line — play any quiz today to keep it alive!`));
  else if (sk.current > 0) m.appendChild(el('p', 'mine-streak', `🔥 ${sk.current}-day streak — you keep showing up. That's how brains grow!`));
  else m.appendChild(el('p', 'mine-streak', `Every quiz makes your math brain stronger. Pick something to grow! 🌱`));

  const dToday = Stats.getDaily();

  // Growth since last week — change motivates more than state.
  const snaps = Stats.getSnaps();
  if (snaps.length >= 2) {
    const cur = snaps[snaps.length - 1], prev = snaps[snaps.length - 2];
    const dm = (cur.mulMastered || 0) - (prev.mulMastered || 0);
    const dq = (cur.quizzes || 0) - (prev.quizzes || 0);
    if (dm > 0) m.appendChild(el('p', 'mine-week', `🌟 Since last week: ${dm} new fact${dm > 1 ? 's' : ''} mastered${dq > 0 ? ` · ${dq} quiz${dq > 1 ? 'zes' : ''}` : ''} — your practice is working!`));
    else if (dq > 0) m.appendChild(el('p', 'mine-week', `🌟 This week: ${dq} quiz${dq > 1 ? 'zes' : ''} done — every one grows your brain!`));
  }

  // One button, no menu: the engine decides what gets practiced. This page
  // is the child's open learner model — a place to SEE growth, not to pick.
  const busyQuiz = state.phase === 'quiz' && !state.submitted && state.quiz.some(q => answered(q));
  const goBtn = el('button', 'btn btn-primary mine-go mine-start',
    busyQuiz ? '↩ Back to my quiz' : nextStepLabel());
  goBtn.onclick = () => { state.showMine = false; if (busyQuiz) render(); else startNew(); };
  m.appendChild(goBtn);
  if (dToday.warmup && dToday.quiz) m.appendChild(el('p', 'mine-note', "Today's practice is done — a bonus round is always welcome! 🎉"));

  // View-only skill cards: stage + meter (+ fraction sub-skill chips).
  const rows = [];
  rows.push({ name: 'Times tables', emoji: '✖️', mastery: s.mastery });
  if (s.division.unlocked) rows.push({ name: 'Division', emoji: '➗', mastery: s.division.mastery });
  if (s.bigmul.unlocked) rows.push({ name: 'Bigger ×', emoji: '🔢', mastery: s.bigmul.mastery });
  if (s.mul2.unlocked) rows.push({ name: '2-digit × 2-digit', emoji: '🧮', mastery: s.mul2.mastery });
  if (s.geo.unlocked) rows.push({ name: 'Area & perimeter', emoji: '📏', mastery: s.geo.mastery });
  if (s.fractions.unlocked) rows.push({ name: 'Fractions', emoji: '🍕', mastery: s.fractions.mastery });
  if (s.word.unlocked) rows.push({ name: 'Word problems', emoji: '📖', mastery: s.word.mastery });
  if (s.longdiv.unlocked) rows.push({ name: 'Long division', emoji: '🧩', mastery: s.longdiv.mastery });
  if (s.multi.unlocked) rows.push({ name: 'Two-step problems', emoji: '🪜', mastery: s.multi.mastery });
  rows.forEach(r => {
    const stg = masteryStage(r.mastery);
    const card = el('div', 'mine-card');
    const top = el('div', 'mine-card-top');
    top.appendChild(el('span', 'mine-emoji', r.emoji));
    top.appendChild(el('span', 'mine-name', r.name));
    top.appendChild(el('span', 'mine-stage', `${stg.emoji} ${stg.label}`));
    card.appendChild(top);
    card.appendChild(masteryMeter(r.mastery));
    const stEmoji = { new: '⚪', learning: '🌱', accurate: '⭐', fluent: '🚀' };
    if (r.name === 'Fractions') {
      const chips = el('div', 'mine-chips');
      [['frac.fnam', 'Naming'], ['frac.feq', 'Equal'], ['frac.fcmp', 'Compare']].forEach(([k, label]) => {
        chips.appendChild(el('span', 'mine-chip', `${stEmoji[Stats.skillState(k)] || '⚪'} ${label}`));
      });
      card.appendChild(chips);

    if (r.name === 'Long division') {
      const chips = el('div', 'mine-chips');

        chips.appendChild(el('span', 'mine-chip', `${stEmoji[Stats.skillState('ldiv.' + k)] || '⚪'} ${ldKindLabel(k)}`));
      });
      card.appendChild(chips);
    }
    if (r.name === '2-digit × 2-digit') {
      const chips = el('div', 'mine-chips');

      });
      card.appendChild(chips);
    }
    if (r.name === 'Two-step problems') {
      const chips = el('div', 'mine-chips');
      mKinds().forEach(k => {
        chips.appendChild(el('span', 'mine-chip', `${stEmoji[Stats.skillState('multi.' + k)] || '⚪'} ${multiKindShort(k)}`));
      });
      card.appendChild(chips);
    }
    if (r.name === 'Word problems') {
      const chips = el('div', 'mine-chips');
      W_KINDS.forEach(k => {
        chips.appendChild(el('span', 'mine-chip', `${stEmoji[Stats.skillState('word.' + k)] || '⚪'} ${wordKindLabel(k).split(' ')[0]}`));
      });

    }
    m.appendChild(card);
  });

  // Times-table map: territory the child can literally watch turn green.
  const mapWrap = document.createElement('details');
  mapWrap.className = 'fact-map-wrap';
  const mapSum = document.createElement('summary');
  mapSum.textContent = '🗺️ My times-table map';
  mapWrap.appendChild(mapSum);
  const grid = el('div', 'fact-map');
  grid.appendChild(el('div', 'fm-h', '×'));
  for (let b = 2; b <= 12; b++) grid.appendChild(el('div', 'fm-h', String(b)));
  for (let a = 2; a <= 12; a++) {
    grid.appendChild(el('div', 'fm-h', String(a)));

      cell.title = `${a}×${b}`;
      grid.appendChild(cell);
    }
  }
  mapWrap.appendChild(grid);
  const leg = el('div', 'fm-legend');
  [['fm-new', 'New'], ['fm-learning', 'Learning'], ['fm-accurate', 'Got it'], ['fm-fluent', 'Fast!']].forEach(([cls, label]) => {
    const item = el('span', null);

    item.appendChild(el('span', null, label));
    leg.appendChild(item);
  });
  mapWrap.appendChild(leg);
  m.appendChild(mapWrap);

  // Concrete unlock goal — "24/40 facts" beats "keep practicing!".
  const nu = Stats.nextUnlock();
  if (nu) {
    const uc = el('div', 'unlock-card');
    uc.appendChild(el('div', 'unlock-title', `🔒 Next up: ${nu.emoji} ${nu.name}`));

    m.appendChild(uc);
  }

  const done = el('button', 'btn btn-ghost mine-done', 'Done');
  done.onclick = closeMine;
  m.appendChild(done);

  bg.appendChild(m);
  return bg;
}

// Collapsible section for the parent panel — keeps 13 sections scannable.
function statsGroup(title, hint, open) {
  const d = document.createElement('details');

  if (open) d.open = true;
  const sum = document.createElement('summary');
  sum.className = 'stats-group-sum';
  sum.appendChild(spanTxt(title, 'sg-title'));
  if (hint) sum.appendChild(spanTxt(hint, 'sg-hint'));
  d.appendChild(sum);
  return d;
}
// ---- Daily log ----
function qLabel(q) {
  if (q.type === 'mul') return `${q.a} × ${q.b}`;
  if (q.type === 'div') return `${q.a} ÷ ${q.b}`;
  if (q.type === 'add') return `${q.a} + ${q.b}`;
  if (q.type === 'sub') return `${q.a} − ${q.b}`;
  if (q.type === 'fnam') return `name ${q.shaded} of ${q.den} shaded`;
  if (q.type === 'feq') return `${q.n1}/${q.d1} = ?/${q.d2}`;
