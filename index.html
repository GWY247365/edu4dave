    trendGroup = statsGroup('📈 Trends', latestSnap ? `mastery ${latestSnap.mulMastery}%` : '', false);
    if (s.hist.length >= 2) {
      trendGroup.appendChild(el('h3', 'stats-h3', 'Recent quizzes'));
      const chart = el('div', 'mini-chart');
      s.hist.forEach(h => {
        const denom = h.n || 10;
        const col = el('div', 'chart-col');
        const bar = el('div', 'chart-bar');
        bar.style.height = (100 * h.c / denom) + '%';
        bar.title = `${h.c}/${h.n} · ${fmt(h.t)}`;
        const r = h.c / denom;
        if (r === 1) bar.classList.add('perfect');
        else if (r >= 0.8) bar.classList.add('good');
        else if (r < 0.5) bar.classList.add('low');
        col.appendChild(bar);
        col.appendChild(el('div', 'chart-num', String(h.c)));
        chart.appendChild(col);
      });
      trendGroup.appendChild(chart);
    }
  }

  if (s.quizzesDone > 0) {
    // Weekly snapshot trend — passive, no API call.
    const snaps = Stats.getSnaps();
    if (snaps.length >= 2) {
      const sect = el('div', 'snap-section');
      sect.appendChild(el('h3', 'stats-h3', '📈 Weekly snapshots'));
      const last = snaps[snaps.length - 1];
      const prior = snaps.length >= 2 ? snaps[snaps.length - 2] : null;
      const delta = (a, b) => { if (b == null) return ''; const d = a - b; if (!d) return ' (—)'; return d > 0 ? ` (+${d})` : ` (${d})`; };
      const row = el('p', 'stats-line');
      row.innerHTML = `Mul mastery: <b>${last.mulMastery}%</b>${delta(last.mulMastery, prior && prior.mulMastery)} · ` +
                      `Mul accuracy: <b>${last.mulAccuracy}%</b>${delta(last.mulAccuracy, prior && prior.mulAccuracy)} · ` +
                      `Quizzes: <b>${last.quizzes}</b>${delta(last.quizzes, prior && prior.quizzes)}`;
      sect.appendChild(row);
      // tiny sparkline of mulMastery over recent snaps
      const spark = el('div', 'mini-chart');
      const vals = snaps.slice(-10).map(x => x.mulMastery || 0);
      vals.forEach(v => {
        const col = el('div', 'chart-col');
        const bar = el('div', 'chart-bar');
        bar.style.height = (v) + '%';
        bar.title = v + '%';
        if (v >= 80) bar.classList.add('good');
        else if (v < 40) bar.classList.add('low');
        col.appendChild(bar);
        col.appendChild(el('div', 'chart-num', String(v)));
        spark.appendChild(col);
      });
      sect.appendChild(spark);
      if (trendGroup) trendGroup.appendChild(sect); else m.appendChild(sect);
    }

    if (trendGroup && trendGroup.children.length > 1) m.appendChild(trendGroup);
    m.appendChild(renderDailyLog());

    const planSection = el('div', 'plan-section');
    planSection.appendChild(el('h3', 'stats-h3', '✨ AI Learning Plan'));
    const planContainer = el('div', 'plan-container');
    // Past plans (persisted) — collapsed expander.
    const plans = Stats.getPlans();
    if (plans.length) {
      const past = el('details', 'plan-history');
      const sum = document.createElement('summary');
      sum.textContent = `📚 Past plans (${plans.length})`;
      past.appendChild(sum);
      plans.slice().reverse().forEach(p => {
        const item = el('div', 'plan-history-item');
        const head = el('div', 'plan-history-head');
        head.textContent = `${p.week} · ${new Date(p.ts).toLocaleDateString()}`;
        const body = el('div', 'plan-body');
        body.innerHTML = renderMarkdown(p.text || '');
        item.appendChild(head); item.appendChild(body);
        past.appendChild(item);
      });
      planSection.appendChild(past);
    }
    const genBtn = el('button', 'btn btn-primary plan-btn', 'Generate weekly report & plan');
    genBtn.onclick = () => generatePlan(planContainer, genBtn);
    planSection.appendChild(genBtn);
    planSection.appendChild(planContainer);
    m.appendChild(planSection);
  }

  const checks = Stats.engineCheck();
  const bad = checks.filter(c => c.level !== 'ok').length;
  const engGroup = statsGroup('🔬 Engine check', bad ? `${bad} to look at` : 'all clear', bad > 0);
  checks.forEach(c => {
    const row = el('div', 'eng-row eng-' + c.level);
    row.appendChild(el('span', 'eng-dot', c.level === 'ok' ? '✓' : c.level === 'warn' ? '!' : '×'));
    const body = el('span', 'eng-body');
    body.appendChild(el('div', 'eng-label', c.label));
    if (c.detail) body.appendChild(el('div', 'eng-detail', c.detail));
    row.appendChild(body);
    engGroup.appendChild(row);
  });
  m.appendChild(engGroup);

  const setGroup = statsGroup('⚙️ Sync & settings', getFamilyCode() ? '☁️ on' : '', false);
  setGroup.appendChild(renderSyncSection());
  setGroup.appendChild(renderPinRow());
  m.appendChild(setGroup);

  const actions = el('div', 'stats-actions');
  const printBtn = el('button', 'btn btn-ghost', '🖨️ Print progress');
  printBtn.onclick = openPrintView;
  const reset = el('button', 'btn btn-ghost', '🗑️ Reset (parent only)');
  reset.onclick = () => {
    if (!parentGate()) return;
    const fc = getFamilyCode();
    const msg = fc
      ? 'Clear all progress on this device AND in the cloud? A cloud backup is kept, so it can be restored from Sync & settings.'
      : 'Clear all progress on this device? This cannot be undone.';
    if (!confirm(msg)) return;
    Stats.reset();
    try { localStorage.removeItem(SESSION_KEY); } catch {}
    if (fc) {
      cloudSave(fc, Stats.exportRaw(), { allowShrink: true })
        .then(() => { syncedThisSession = true; noteSyncOk(); })
        .catch(noteSyncErr);
    }
    render();
  };
  const ok = el('button', 'btn btn-primary', 'Close');
  ok.onclick = closeStats;
  actions.appendChild(printBtn);
  actions.appendChild(reset);
  actions.appendChild(ok);
  m.appendChild(el('div', 'app-version', `Math Quiz ${APP_VERSION} · updated ${APP_UPDATED}`));
  m.appendChild(actions);

  bg.appendChild(m);
  return bg;
}

async function generatePlan(container, btn) {
  btn.disabled = true;
  container.innerHTML = '';
  const loading = el('div', 'plan-loading', 'Generating the learning plan…');
  container.appendChild(loading);
  try {
    const s = Stats.summary();
    const payload = {
      quizzesDone: s.quizzesDone,
      multiplicationAccuracyPct: s.totalAccuracy,
      factsMastered: s.mastered,
      streak: { current: s.streak.current, best: s.streak.best },
      weakestMultiplicationFacts: s.weak.map(w => ({
        fact: `${w.a}×${w.b}`, correct: w.right, wrong: w.wrong,
      })),
      additionByCarries: s.buckets.add.map(b => ({
        carries: b.k, accuracyPct: b.accuracy, attempts: b.total,
      })),
      subtractionByBorrows: s.buckets.sub.map(b => ({
        borrows: b.k, accuracyPct: b.accuracy, attempts: b.total,
      })),
      recentQuizzes: s.hist.map(h => ({ correct: h.c, outOf: h.n, seconds: h.t,
        kind: h.k || ((h.n || 0) >= 10 ? 'quiz' : 'warmup') })),
      division: s.division.unlocked
        ? { attempts: s.division.attempts, accuracyPct: s.division.accuracy, masteryPct: s.division.mastery }
        : 'locked',
      twoDigitMultiplication: s.bigmul.unlocked
        ? { attempts: s.bigmul.attempts, accuracyPct: s.bigmul.accuracy, masteryPct: s.bigmul.mastery }
        : 'locked',
      twoByTwoDigitMultiplication: s.mul2.unlocked
        ? { attempts: s.mul2.attempts, accuracyPct: s.mul2.accuracy, masteryPct: s.mul2.mastery,
            byKind: M2_KINDS.reduce((o, k) => {
              const f = Stats.getSkill('mul2.' + k), n = f ? (f.right || 0) + (f.wrong || 0) : 0;
              o[mul2KindLabel(k)] = n ? Math.round(100 * (f.right || 0) / n) + '%' : 'not seen';
              return o;
            }, {}) }
        : 'locked',
      areaAndPerimeter: s.geo.unlocked
        ? { attempts: s.geo.attempts, accuracyPct: s.geo.accuracy, masteryPct: s.geo.mastery,
            byKind: G_KINDS_ALL.reduce((o, k) => {
              const f = Stats.getSkill('geo.' + k), n = f ? (f.right || 0) + (f.wrong || 0) : 0;
              o[geoKindLabel(k)] = n ? Math.round(100 * (f.right || 0) / n) + '%' : 'not seen';
              return o;
            }, {}) }
        : 'locked',
      twoStepProblems: s.multi.unlocked
        ? { attempts: s.multi.attempts, accuracyPct: s.multi.accuracy, masteryPct: s.multi.mastery,
            byKind: mKinds().reduce((o, k) => {
              const f = Stats.getSkill('multi.' + k), n = f ? (f.right || 0) + (f.wrong || 0) : 0;
              o[multiKindLabel(k)] = n ? Math.round(100 * (f.right || 0) / n) + '%' : 'not seen';
              return o;
            }, {}) }
        : 'locked',
      longDivision: s.longdiv.unlocked
        ? { attempts: s.longdiv.attempts, accuracyPct: s.longdiv.accuracy, masteryPct: s.longdiv.mastery,
            byKind: LD_KINDS.reduce((o, k) => {
              const f = Stats.getSkill('ldiv.' + k), n = f ? (f.right || 0) + (f.wrong || 0) : 0;
              o[ldKindLabel(k)] = n ? Math.round(100 * (f.right || 0) / n) + '%' : 'not seen';
              return o;
            }, {}) }
        : 'locked',
      wordProblems: s.word.unlocked
        ? { attempts: s.word.attempts, accuracyPct: s.word.accuracy, masteryPct: s.word.mastery,
            bySchema: W_KINDS.reduce((o, k) => {
              const f = Stats.getSkill('word.' + k), n = f ? (f.right || 0) + (f.wrong || 0) : 0;
              o[wordKindLabel(k)] = n ? Math.round(100 * (f.right || 0) / n) + '%' : 'not seen';
              return o;
            }, {}) }
        : 'locked',
      fractions: s.fractions.unlocked
        ? { attempts: s.fractions.attempts, accuracyPct: s.fractions.accuracy, masteryPct: s.fractions.mastery,
            subSkills: { naming: Stats.skillState('frac.fnam'), equivalence: Stats.skillState('frac.feq'), comparison: Stats.skillState('frac.fcmp') } }
        : 'locked',
      // Systematic error patterns from the raw wrong-answer log — the most
      // actionable input for a targeted plan.
      errorPatterns: Stats.errorPatterns().map(p => p.label),
    };
    const res = await fetch('/api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stats: payload }),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.error || `server returned ${res.status}`);
    }
    const data = await res.json();
    if (data.plan) { Stats.savePlan(data.plan); pushIfSynced(); }
    container.innerHTML = '';
    const body = el('div', 'plan-body');
    body.innerHTML = renderMarkdown(data.plan || '');
    container.appendChild(body);
    btn.textContent = 'Regenerate';
  } catch (e) {
    container.innerHTML = '';
    const err = el('div', 'plan-error');
    err.textContent = 'Failed: ' + e.message + '. The AI plan needs the deployed backend with a model API key (HUNYUAN_API_KEY).';
    container.appendChild(err);
  } finally {
    btn.disabled = false;
  }
}

function renderMarkdown(md) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = String(md).split('\n');
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (/^#{1,6}\s/.test(line)) {
      closeList();
      html += `<h4 class="plan-h">${inline(line.replace(/^#{1,6}\s/, ''))}</h4>`;
    } else if (/^[-*]\s/.test(line) || /^\d+\.\s/.test(line)) {
      if (!inList) { html += '<ul class="plan-ul">'; inList = true; }
      html += `<li>${inline(line.replace(/^([-*]|\d+\.)\s/, ''))}</li>`;
    } else if (line === '') {
      closeList();
    } else {
      closeList();
      html += `<p class="plan-p">${inline(line)}</p>`;
    }
  }
  closeList();
  return html;
}

function renderPinRow() {
  const wrap = el('div', 'pin-row');
  const has = !!Stats.getPinHash();
  wrap.appendChild(el('div', 'pin-label', has ? '🔒 Parent PIN is on' : '🔓 No parent PIN set'));
  const btn = el('button', 'btn btn-ghost pin-btn', has ? 'Change / remove' : 'Set PIN');
  btn.onclick = () => {
    if (has) {
      const cur = prompt('Enter the current parent PIN:');
      if (cur === null) return;
      if (pinHash(cur.trim()) !== Stats.getPinHash()) { alert('Wrong PIN.'); return; }
      const next = prompt('Enter a new 4-digit PIN (leave blank to remove):');
      if (next === null) return;
      const t = next.trim();
      if (t === '') { Stats.setPin(null); pushIfSynced(); alert('Parent PIN removed.'); render(); return; }
      if (!/^\d{4}$/.test(t)) { alert('PIN must be 4 digits.'); return; }
      Stats.setPin(pinHash(t)); pushIfSynced(); alert('PIN updated.'); render();
    } else {
      const p1 = prompt('Set a 4-digit parent PIN:');
      if (p1 === null) return;
      if (!/^\d{4}$/.test(p1.trim())) { alert('PIN must be 4 digits.'); return; }
      const p2 = prompt('Enter it again to confirm:');
      if (p2 === null) return;
      if (p1.trim() !== p2.trim()) { alert('The two entries do not match.'); return; }
      Stats.setPin(pinHash(p1.trim())); pushIfSynced(); alert('Parent PIN set.'); render();
    }
  };
  wrap.appendChild(btn);
  return wrap;
}

function renderSyncSection() {
  const wrap = el('div', 'sync-section');
  wrap.appendChild(el('h3', 'stats-h3', '☁️ Sync across devices'));
  if (getFamilyCode()) {
    const h = getSyncHealth();
    const ageH = h.lastOk ? (Date.now() - h.lastOk) / 3600000 : null;
    let cls = 'sync-health', txt;
    if (h.lastErr && (!h.lastOk || h.lastErr.ts > h.lastOk)) {
      cls += ' bad';
      txt = `⚠️ Last sync FAILED (${new Date(h.lastErr.ts).toLocaleString()}): ${h.lastErr.msg}`;
    } else if (ageH == null) {
      cls += ' bad';
      txt = '⚠️ This device has never synced successfully — progress is staying local.';
    } else if (ageH > 48) {
      cls += ' bad';
      txt = `⚠️ Last successful sync ${Math.round(ageH / 24)} days ago — this device may be practicing offline only.`;
    } else {
      cls += ' ok';
      txt = `✓ Last synced ${ageH < 1 ? 'less than an hour ago' : Math.round(ageH) + 'h ago'}.`;
    }
    wrap.appendChild(el('div', cls, txt));
  }
  const row = el('div', 'sync-row');
  const input = document.createElement('input');
  input.className = 'sync-input';
  input.type = 'text';
  input.placeholder = 'Family code (same on every device)';
  input.autocomplete = 'off';
  input.value = getFamilyCode();
  const btn = el('button', 'btn btn-primary sync-btn', 'Save & sync');
  const status = el('div', 'sync-status', '');
  btn.onclick = async () => {
    const code = sanitizeCode(input.value);
    if (code.length < 3) {
      status.textContent = 'Family code needs at least 3 characters (letters/numbers/-/_).';
      status.className = 'sync-status err';
      return;
    }
    // If a parent PIN is set, changing the family code requires it.
    const current = getFamilyCode();
    if (Stats.getPinHash() && code !== current) {
      if (!parentGate()) { input.value = current; return; }
    }
    setFamilyCode(code);
    input.value = code;
    btn.disabled = true;
    status.textContent = 'Syncing…';
    status.className = 'sync-status';
    try {
      await cloudSync(code);
      // Report the merged streak right here — the #1 sync question is
      // "where is the flame", and the answer is in the merged data.
      const sk = Stats.streakStatus();
      status.textContent = sk.current > 0
        ? `✓ Synced — 🔥 ${sk.current}-day streak, refreshing…`
        : sk.lastDay
          ? `✓ Synced — last quiz was ${sk.lastDay} (UTC), so the streak has expired. Play today to start a new one!`
          : '✓ Synced — no quiz history in the cloud copy yet.';
      status.className = 'sync-status ok';
      // Re-render unconditionally: the topbar streak flame must reflect the
      // merged data even if the user closed the modal while sync ran.
      setTimeout(() => render(), 900);
    } catch (e) {
      status.textContent = 'Sync failed: ' + e.message + ' (Upstash must be configured).';
      status.className = 'sync-status err';
    } finally {
      btn.disabled = false;
    }
  };
  row.appendChild(input);
  row.appendChild(btn);
  wrap.appendChild(row);
  wrap.appendChild(status);
  wrap.appendChild(el('div', 'sync-hint', 'Enter the same family code on each device to share progress. Anyone who knows the code can read it, so pick one that is hard to guess.'));
  if (getFamilyCode()) {
    // Sign out ≠ Reset: reset wipes the profile everywhere (and pushes the
    // wipe to the cloud); sign-out detaches THIS device only.
    const out = el('button', 'btn btn-ghost sync-signout', '🚪 Sign out on this device');
    out.onclick = () => {
      if (Stats.getPinHash() && !parentGate()) return;
      if (!confirm("Sign out on this device? Syncing stops and the child's progress is removed from THIS device only — the cloud copy and every other device keep everything. You can sign back in anytime with the family code.")) return;
      setFamilyCode('');           // detach first so nothing pushes the wipe
      Stats.reset();               // clear the local profile
      try { localStorage.removeItem(SESSION_KEY); } catch {}
      location.reload();           // fresh boot: blank profile, ready screen
    };
    wrap.appendChild(out);

    // Cloud backups: the server keeps the last 14 daily versions plus one
    // before every reset or restore. Loaded only when opened.
    const bk = document.createElement('details');
    bk.className = 'backup-box';
    const bs = document.createElement('summary');
    bs.textContent = '🗂️ Cloud backups';
    bk.appendChild(bs);
    const list = el('div', 'backup-list', 'Loading…');
    bk.appendChild(list);
    let loaded = false;
    bk.addEventListener('toggle', () => {
      if (!bk.open || loaded) return;
      loaded = true;
      cloudBackups(getFamilyCode()).then(items => {
        list.innerHTML = '';
        if (!items.length) { list.appendChild(el('div', 'backup-empty', 'No backups yet — one is kept each day the progress changes.')); return; }
        items.forEach(b => {
          const row = el('div', 'backup-row');
          const when = b.ts ? new Date(b.ts).toLocaleString() : 'unknown time';
          const last = b.lastPractice ? new Date(b.lastPractice).toLocaleDateString() : '—';
          const info = el('div', 'backup-info');
          info.appendChild(el('div', 'backup-when', when));
          info.appendChild(el('div', 'backup-meta', b.broken ? 'unreadable backup'
            : `${b.quizzes} quizzes · ${b.factsSeen} facts seen · last practice ${last}`));
          row.appendChild(info);
          if (!b.broken) {
            const btn = el('button', 'btn btn-ghost backup-restore', 'Restore');
            btn.onclick = async () => {
              if (Stats.getPinHash() && !parentGate()) return;
              if (!confirm(`Restore the progress saved ${when}? The current version is backed up first, so this can be undone.`)) return;
              btn.disabled = true; btn.textContent = 'Restoring…';
              try {
                const data = await cloudRestore(getFamilyCode(), b.i);
                localStorage.setItem(STATS_KEY, JSON.stringify(data));
                try { localStorage.removeItem(SESSION_KEY); } catch {}
                location.reload();
              } catch (e) {
                btn.disabled = false; btn.textContent = 'Restore';
                alert('Restore failed: ' + e.message);
              }
            };
            row.appendChild(btn);
          }
          list.appendChild(row);
        });
      }).catch(e => { list.textContent = 'Could not load backups: ' + e.message; loaded = false; });
    });
    wrap.appendChild(bk);
  }
  return wrap;
}

function spanTxt(text, cls) {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = String(text);
  return s;
}

if (state.phase === 'quiz' && !state.submitted) runTicker();
saveSession();
render();
setTimeout(() => {
  const first = document.querySelector('.ansbox');
  if (first) first.focus();
}, 100);

// Catch up on any thresholds already crossed by accumulated history (e.g.
// after a stats-engine upgrade), so unlocks happen on App open — not only
// at the end of the next quiz. Show the new-skill lesson if anything fires.
(function initCheckUnlocks() {
  const unlocked = _newlyUnlocked || Stats.checkUnlocks();
  if (unlocked) { state.showLesson = unlocked; render(); }
})();

// On load, if a family code is set, pull + merge cloud progress
(function initCloudSync() {
  const code = getFamilyCode();
  if (!code) return;
  cloudSync(code).then(() => {
    const unlocked = Stats.checkUnlocks();
    if (unlocked) state.showLesson = unlocked;
    // Don't rebuild the DOM (and steal the cursor) if the child is mid-answer;
    // the merged stats will surface on the next natural render.
    const typing = document.activeElement && document.activeElement.classList &&
      document.activeElement.classList.contains('ansbox');
    if (unlocked || !typing) render();
  }).catch(() => {});
})();

// PWA: register service worker for offline use. The fetch strategy is
// cache-first, so without an explicit update flow a long-lived install can
// run stale code for days — check for updates on every launch and again
// periodically, and swap in the new version as soon as it's safe.
// The "🔄 Update ready" chip is driven by a real version comparison, never by
// lifecycle events: ask the controlling worker which release it holds and
// show the chip only when that differs from the page we are running. A first
// install, or a worker that matches this page, must never raise it.
function checkVersionSkew() {
  const sw = navigator.serviceWorker && navigator.serviceWorker.controller;
  if (!sw) return;
  let done = false;
  const handle = (v) => {
    if (done) return; done = true;
    const stale = !!v && !String(v).endsWith('-' + APP_VERSION);
    if (stale !== !!state.updateReady) { state.updateReady = stale; render(); }
  };
  try {
    const ch = new MessageChannel();
    ch.port1.onmessage = (e) => handle(e.data && e.data.version);
    sw.postMessage({ type: 'version' }, [ch.port2]);
    setTimeout(() => handle(null), 3000); // old worker without the handler
  } catch { /* messaging unavailable — leave the chip alone */ }
}
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          // Never auto-reload: a navigation racing the child's tap makes
          // buttons feel dead. Re-check the version instead.
          if (nw.state === 'activated') checkVersionSkew();
        });
      });
      let lastCheck = 0;
      const checkForUpdate = () => {
        lastCheck = Date.now();
        reg.update().catch(() => {});
        checkVersionSkew();
      };
      checkForUpdate();
      // An iPad home-screen app is RESUMED when the child comes back to it,
      // not reloaded, so neither 'load' nor a long timer fires (iOS freezes
      // timers in the background). Check whenever the app comes back to the
      // foreground; focus/visibility/pageshow tend to fire together, so
      // collapse them into one check.
      const onResume = () => {
        if (document.visibilityState !== 'visible') return;
        if (Date.now() - lastCheck < 10 * 1000) return;
        checkForUpdate();
      };
      document.addEventListener('visibilitychange', onResume);
      window.addEventListener('focus', onResume);
      window.addEventListener('pageshow', onResume);
      // And for a session left open in the foreground, poll every 10 min.
      setInterval(() => { if (!document.hidden) checkForUpdate(); }, 10 * 60 * 1000);
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', checkVersionSkew);
  });
}
</script>
</body>
</html>
