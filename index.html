<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Math Quiz">
<meta name="theme-color" content="#0698da">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<title>Math Quiz · 10 Questions</title>

<style>
:root{
  --brand:#0698da;
  --brand-deep:#0578ae;
  --brand-soft:#e6f5fc;
  --brand-soft-2:#cdebf8;
  --ink:#0f172a;
  --ink-2:#344054;
  --ink-3:#6b7280;
  --ink-4:#98a2b3;
  --bg:#f4f8fb;
  --card:#ffffff;
  --border:#e1e6ec;
  --border-soft:#eef1f4;
  --ok:#16a34a;
  --ok-soft:#ecfdf3;
  --ok-deep:#15803d;
  --warn:#d97706;
  --warn-soft:#fffaeb;
  --warn-deep:#b45309;
  --bad:#dc2626;
  --bad-soft:#fef2f2;
  --bad-deep:#b91c1c;
  --shadow-card:0 1px 3px rgb(15 23 42 / .06), 0 1px 2px rgb(15 23 42 / .04);
  --shadow-pop:0 10px 15px -3px rgb(15 23 42 / .08), 0 4px 6px -4px rgb(15 23 42 / .05);
  --shadow-brand:0 4px 14px -2px rgb(6 152 218 / .35);
  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
.tabular{font-variant-numeric:tabular-nums}

.shell{max-width:960px;margin:0 auto;padding:12px 16px 96px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 4px;margin:0 -4px 10px;background:linear-gradient(180deg,rgba(244,248,251,.96) 70%,rgba(244,248,251,0));backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0698da 0%,#0578ae 100%);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:800;box-shadow:var(--shadow-brand);flex-shrink:0}
.brand-text h1{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand-text p{margin:1px 0 0;font-size:12px;color:var(--ink-3);font-weight:500}

.timer{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:#fff;border:1px solid var(--border);font-weight:700;font-size:16px;box-shadow:var(--shadow-card);transition:all .2s ease}
.timer .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s ease-in-out infinite}
.timer.warn{background:var(--warn-soft);border-color:#fde68a;color:var(--warn-deep)}
.timer.warn .dot{background:var(--warn)}
.timer.danger{background:var(--bad-soft);border-color:#fecaca;color:var(--bad-deep)}
.timer.danger .dot{background:var(--bad)}
.timer.over{background:var(--bad-soft);border-color:#fecaca;color:var(--bad-deep)}
.timer.over .dot{background:var(--bad);animation:pulse 1s ease-in-out infinite}
.timer.done{opacity:.6}

.btn{appearance:none;border:none;cursor:pointer;font-family:inherit;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 18px;font-size:16px;transition:transform .15s ease, box-shadow .2s ease, background .2s ease;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:var(--shadow-brand)}
.btn-primary:hover{background:var(--brand-deep)}
.btn-ghost{background:#fff;color:var(--ink-2);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg)}

.progress{display:flex;gap:5px;margin-bottom:10px}
.progress .seg{flex:1;height:6px;border-radius:3px;background:#e5edf3;transition:background .25s ease}
.progress .seg.filled{background:var(--brand)}
.progress .seg.ok{background:var(--ok)}
/* Hatch texture so correct vs incorrect is distinguishable without relying on
   red/green hue (color-blind friendly). */
.progress .seg.bad{background-color:var(--bad);background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.65) 0,rgba(255,255,255,.65) 2px,transparent 2px,transparent 4px)}

.qgrid{display:grid;gap:8px;margin-bottom:8px}
@media (min-width:720px){.qgrid:not(.review){grid-template-columns:1fr 1fr}}

.qcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow-card);transition:border-color .2s, box-shadow .2s}
.qcard.focused{border-color:var(--brand);box-shadow:0 0 0 4px rgba(6,152,218,.12),var(--shadow-card)}
.qcard.ok{border-color:#bbf7d0;background:linear-gradient(180deg,#f0fdf4 0%,#fff 60%)}
.qcard.bad{border-color:#fecaca;background:linear-gradient(180deg,#fef2f2 0%,#fff 60%)}

.qhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qnum{width:24px;height:24px;border-radius:7px;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-weight:700;font-size:12px;flex-shrink:0}
.qcard.ok .qnum{background:var(--ok-soft);color:var(--ok-deep)}
.qcard.bad .qnum{background:var(--bad-soft);color:var(--bad-deep)}
.qtag{font-size:12px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.qstatus{margin-left:auto;font-size:13px;font-weight:600}
.qstatus.ok{color:var(--ok-deep)}
.qstatus.bad{color:var(--bad-deep)}

.qrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.expr{font-family:'Inter',var(--font);font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:8px;flex:1;min-width:0}
.expr.expr-scaffold{font-size:20px}
.expr .scaffold-line{font-variant-numeric:tabular-nums;line-height:1.3}
.expr .op{color:var(--brand);font-weight:700}
.expr .eq{color:var(--ink-3)}

.ansbox{width:120px;height:50px;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);font-family:inherit;outline:none;transition:border-color .15s, box-shadow .15s, background .15s;-moz-appearance:textfield;padding:0 6px;flex-shrink:0}
.ansbox::-webkit-outer-spin-button,.ansbox::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ansbox:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(6,152,218,.18)}
.ansbox.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-deep)}
.ansbox.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-deep);text-decoration:line-through;text-decoration-color:rgba(220,38,38,.5);text-decoration-thickness:2px}

.correct-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--ok-soft);color:var(--ok-deep);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;border:1px solid #bbf7d0}
.correct-pill .ar{color:var(--ink-3);font-weight:500;margin-right:2px;font-size:13px;text-transform:uppercase;letter-spacing:.05em}

.diag{margin-top:10px;padding:10px 14px;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px}
.diag-head{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--warn-deep);margin-bottom:8px;font-size:14px;text-transform:uppercase;letter-spacing:.05em}
.diag-head .ico{width:22px;height:22px;border-radius:6px;background:var(--warn);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:800}
.diag p{margin:4px 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.diag .why{font-weight:600;color:var(--warn-deep)}
.diag .work{margin-top:8px;font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-size:14px;line-height:1.55;background:#fff;border:1px dashed #fed7aa;border-radius:8px;padding:10px 12px;white-space:pre-wrap;color:var(--ink);overflow-x:auto}
.diag .work-toggle{margin-top:8px;font-size:13px;padding:6px 12px;background:transparent;border:1px dashed #fed7aa;color:var(--warn-deep)}
.diag .work b{color:var(--brand-deep);font-weight:700}
.wgrid{--cell:32px;display:inline-block;margin:6px 0 12px;background:#fbfdff;border:1px solid #c7d4e2;border-radius:4px;background-image:linear-gradient(#dde6f0 1px,transparent 1px),linear-gradient(90deg,#dde6f0 1px,transparent 1px);background-size:var(--cell) var(--cell);background-position:0 0;vertical-align:top}
.wrow{display:flex;align-items:center;height:var(--cell);margin:0;padding:0}
.wcell{flex:0 0 var(--cell);width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;line-height:1;font-size:18px;box-sizing:border-box}
.wcell.op{font-weight:600;color:var(--ink)}
.wcell.bw{color:var(--brand-deep);font-weight:700;font-size:12px;align-items:flex-start;padding-top:3px;letter-spacing:-.5px}
.wcell.sign{color:var(--brand);font-weight:700;font-size:18px}
.wcell.sum{color:var(--brand-deep);font-weight:800;font-size:20px}
.wline{height:2px;background:var(--ink-2);margin:0;width:100%;align-self:end}
.wsteps{margin-top:6px;font-size:13px;color:var(--ink-2);line-height:1.5}
.wsteps b{color:var(--brand-deep)}
.diag .tip{margin-top:8px;font-size:13px;color:var(--warn-deep);display:flex;gap:6px;align-items:flex-start}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(244,248,251,0),rgba(244,248,251,.97) 40%);display:flex;justify-content:center}
.actionbar-inner{display:flex;gap:10px;width:100%;max-width:960px}
.btn-big{flex:1;height:52px;font-size:17px;font-weight:700;border-radius:14px;letter-spacing:.01em}
.btn-big.btn-primary{box-shadow:0 6px 20px -4px rgba(6,152,218,.45)}

.foot{text-align:center;color:var(--ink-4);font-size:12px;font-weight:500;letter-spacing:.04em;padding:8px 0 4px;margin-top:4px}
.foot-version{margin-top:4px;font-size:11px;font-weight:400;color:var(--ink-4);opacity:.8}
.foot .heart{color:#dc2626}

.summary{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px 18px;margin-bottom:10px;box-shadow:var(--shadow-card);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.summary .score{font-size:42px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.summary .score .total{color:var(--ink-4);font-size:28px;font-weight:600}
.summary .label{font-size:14px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.summary .msg{flex:1;min-width:200px}
.summary .msg h2{margin:0 0 4px;font-size:22px;font-weight:700}
.summary .msg p{margin:0;color:var(--ink-3);font-size:14px}
.summary .msg p.praise{margin-top:6px;color:var(--ok-deep);font-weight:600}
.summary .breakdown{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9999px;font-size:13px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok-deep)}
.chip.bad{background:var(--bad-soft);color:var(--bad-deep)}
.chip.time{background:var(--brand-soft);color:var(--brand-deep)}
.chip.time.over{background:var(--bad-soft);color:var(--bad-deep)}

.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:50;padding:24px;animation:fade .2s ease;overflow-y:auto}
.modal{background:#fff;border-radius:20px;max-width:420px;width:100%;padding:24px;text-align:center;box-shadow:0 25px 50px -12px rgba(15,23,42,.25);max-height:88vh;overflow-y:auto}
.modal .ico-big{width:64px;height:64px;border-radius:18px;margin:0 auto 14px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;font-size:32px}
.modal h2{margin:0 0 8px;font-size:22px;font-weight:700}
.modal p{margin:0 0 20px;color:var(--ink-3);font-size:15px;line-height:1.5}

/* ---------- Stats UI ---------- */
.iconbtn{appearance:none;border:1px solid var(--border);background:#fff;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:18px;cursor:pointer;box-shadow:var(--shadow-card);transition:transform .15s ease, background .2s}
.iconbtn:hover{background:var(--bg)}
.iconbtn:active{transform:scale(.94)}
.iconbtn.close{width:32px;height:32px;font-size:14px;border-radius:8px;color:var(--ink-3)}

.review-badge{font-size:11px;font-weight:700;color:var(--warn-deep);background:var(--warn-soft);border:1px solid #fde68a;padding:2px 8px;border-radius:9999px;letter-spacing:.04em}
.pretip{margin-top:8px;font-size:13px;color:var(--brand-deep);background:var(--brand-soft);border:1px solid var(--brand-soft-2);border-radius:10px;padding:8px 12px;line-height:1.45}
.teach-wrap{margin-top:8px}
.teach-btn{font-size:13px;padding:7px 12px}
.teach-out{margin-top:8px;font-size:14px;line-height:1.55;color:var(--ink-2);background:#fff;border:1px dashed var(--brand-soft-2);border-radius:8px;padding:0;max-height:0;overflow:hidden;transition:max-height .2s,padding .2s}
.teach-out:not(:empty){padding:10px 12px;max-height:600px}
.teach-out.err{color:var(--bad-deep);border-color:#fecaca}
.focus-btn{width:100%;margin-top:10px}
.lesson-modal{max-width:460px;text-align:left}
.lesson-modal .ico-big{background:var(--brand-soft);color:var(--brand-deep)}
.lesson-modal h2{text-align:center}
.lesson-h{margin:14px 0 4px;font-size:14px;font-weight:700;color:var(--brand-deep);text-transform:uppercase;letter-spacing:.04em}
.lesson-p{margin:4px 0;font-size:14px;line-height:1.5;color:var(--ink-2)}
.lesson-note{margin:8px 0 0;font-size:13px;color:var(--ink-3);line-height:1.5}
.lesson-groups{display:flex;gap:10px;justify-content:center;margin:10px 0}
.lesson-plate{background:#fff;border:2px solid var(--brand-soft-2);border-radius:50%;width:74px;height:74px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;padding:6px}
.lesson-dot{font-size:18px;line-height:1}
.lesson-eqn{font-size:24px;font-weight:700;text-align:center;color:var(--ink);margin:8px 0;font-variant-numeric:tabular-nums}
.lesson-eqn b{color:var(--ok-deep)}
.lesson-actions{display:flex;gap:10px;margin-top:18px}
.lesson-actions .btn-ghost{flex:0 0 auto}
.lesson-actions .btn-big{flex:1}
.div-actions{display:flex;gap:10px;margin-top:8px}
.div-actions .btn{flex:1}
.area-model{display:flex;gap:6px;margin:10px 0}
.area-cell{flex:2;background:var(--brand-soft);border:2px solid var(--brand-soft-2);border-radius:8px;padding:14px 8px;text-align:center;font-size:14px;color:var(--ink-2);line-height:1.5}
.area-cell.ones{flex:1;background:var(--ok-soft);border-color:#bbf7d0}
.area-cell b{font-size:20px;color:var(--brand-deep)}
.area-cell.ones b{color:var(--ok-deep)}
/* Fractions */
.frac-row{align-items:center;gap:16px}
.frac-q{flex:1;min-width:0}
.frac-prompt{font-size:15px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.frac-vis{display:flex;width:100%;max-width:280px;height:40px;border:2px solid var(--brand-deep);border-radius:6px;overflow:hidden}
.frac-cell{flex:1;border-right:1px solid var(--brand-soft-2)}
.frac-cell:last-child{border-right:none}
.frac-cell.on{background:var(--brand)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.frac-num,.frac-den{font-size:26px;line-height:1.1;padding:0 6px}
.frac-line{height:3px;background:var(--ink);width:100%;min-width:28px;margin:2px 0}
.frac-line.wide{min-width:80px}
.frac-expr{font-size:30px;display:inline-flex;align-items:center;gap:12px;flex-wrap:wrap}
.frac-answer{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.frac-in{width:74px;height:48px;font-size:24px;text-align:center}
.frac-num-in{width:64px;height:44px;font-size:22px;text-align:center}
.fcmp{display:flex;gap:8px}
.fcmp-btn{width:48px;height:52px;font-size:24px;font-weight:800;border:2px solid var(--border);border-radius:12px;background:#fff;color:var(--ink);cursor:pointer;font-family:inherit}
.fcmp-btn.chosen{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-deep)}
.fcmp-btn.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok-deep)}
.fcmp-btn.wrongpick{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-deep);text-decoration:line-through}
.fcmp-btn:disabled{cursor:default}

.streak-chip{appearance:none;border:1px solid #fde68a;background:linear-gradient(135deg,#fff7ed,#ffedd5);color:#9a3412;font-family:inherit;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border-radius:9999px;cursor:pointer;font-size:14px;box-shadow:var(--shadow-card);transition:transform .15s ease}
.streak-chip:active{transform:scale(.94)}
.streak-chip .fire{font-size:14px;animation:flicker 2.4s ease-in-out infinite}
.streak-chip .streak-num{font-variant-numeric:tabular-nums}
.streak-chip.hot{background:linear-gradient(135deg,#fee2e2,#fecaca);border-color:#fca5a5;color:#991b1b}
.streak-chip.hot .fire{font-size:16px;animation:flicker 1.6s ease-in-out infinite}
.streak-chip.atrisk{background:linear-gradient(135deg,#fff7ed,#fed7aa);border-color:#fb923c;color:#9a3412}
.mine-streak.atrisk{color:var(--warn-deep)}
@keyframes flicker{0%,100%{transform:scale(1) rotate(-2deg);opacity:1}50%{transform:scale(1.15) rotate(3deg);opacity:.85}}

.bucket-grid{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.bucket-op{font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;margin:6px 0 2px}
.bucket-row{display:flex;align-items:center;gap:10px;font-size:13px}
.bucket-lbl{flex:0 0 110px;color:var(--ink-2)}
.bucket-bar{flex:1;height:7px;background:var(--border-soft);border-radius:4px;overflow:hidden}
.bucket-bar-fill{height:100%;background:var(--brand);transition:width .3s ease}
.bucket-bar-fill.good{background:var(--ok)}
.bucket-bar-fill.low{background:var(--bad)}
.bucket-num{flex:0 0 44px;text-align:right;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:600}

.stats-modal{max-width:600px;text-align:left;padding:20px}
.stats-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stats-head h2{margin:0}
.stats-empty{text-align:center;color:var(--ink-3);padding:18px 0}
.stats-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media (max-width:480px){.stats-tiles{grid-template-columns:repeat(2,1fr)}}
.stat-tile{background:var(--brand-soft);border:1px solid var(--brand-soft-2);border-radius:10px;padding:10px 8px;text-align:center}
.stat-val{font-size:22px;font-weight:800;color:var(--brand-deep);font-variant-numeric:tabular-nums;line-height:1.1}
.stat-label{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.stats-line{margin:6px 0 4px;font-size:13px;color:var(--ink-3)}
.mastery-meter{height:8px;background:var(--border-soft);border-radius:5px;overflow:hidden;margin:0 0 10px}
.mastery-fill{height:100%;background:var(--brand);border-radius:5px;transition:width .4s ease}
.mastery-fill.high{background:var(--ok)}
.mastery-fill.low{background:var(--warn)}
.mine-modal{max-width:460px;text-align:left}
.mine-modal h2{text-align:left}
.mine-streak{margin:0 0 14px;font-size:15px;color:var(--brand-deep);font-weight:600;line-height:1.4}
.mine-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mine-card.rec{border-color:var(--brand);box-shadow:0 0 0 3px rgba(6,152,218,.10)}
.mine-rec-badge{font-size:12px;font-weight:700;color:var(--brand-deep);margin-bottom:6px}
.mine-card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.mine-emoji{font-size:22px}
.mine-name{font-size:17px;font-weight:700;color:var(--ink);flex:1}
.mine-stage{font-size:14px;font-weight:700;color:var(--ink-2)}
.mine-card .mastery-meter{height:12px;margin:0 0 10px}

<body>
<div id="app"></div>

<script>
const TIME_LIMIT_SEC = 10 * 60;
const WARN_AT = 60;
const DANGER_AT = 30;

const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

/* ---------- Stats: localStorage-backed per-fact tracking ---------- */
const STATS_KEY = 'mathquiz.stats.v1';
function todayKey(d) {
  d = d || new Date();
  // UTC so all devices agree on "what day is it" — picks one rollover moment
  // worldwide instead of letting timezone swings break the streak.
  return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`;
}
function dayDiff(a, b) {
  const da = new Date(a + 'T00:00:00Z');
  const db = new Date(b + 'T00:00:00Z');
  return Math.round((db - da) / 86400000);
}
const Stats = (() => {
  // FSRS-lite scheduling constants
  const FAST_MS = 6000;      // fluency threshold for single mul facts
  // Multi-step questions take longer even when fluent — one global 6s bar
  // made 'fluent' unreachable for them and suppressed stability growth.
  const FAST_BY_SKILL = { div: 8000, bigmul: 25000, fractions: 15000 };
  const STAB_FLUENT = 12;    // days of stability needed to count a fact as mastered
  const STAB_MAX = 400;      // cap on stability (days)
  // Bayesian Knowledge Tracing params → a calibrated P(known) per fact.
  const BKT = { L0: 0.2, T: 0.15, S: 0.1, G: 0.2 }; // prior, learn, slip, guess
  function bktUpdate(pL, correct) {
    const prior = (pL == null) ? BKT.L0 : pL;
    const cond = correct
      ? (prior * (1 - BKT.S)) / (prior * (1 - BKT.S) + (1 - prior) * BKT.G)
      : (prior * BKT.S) / (prior * BKT.S + (1 - prior) * (1 - BKT.G));
    return cond + (1 - cond) * BKT.T; // account for learning this opportunity
  }

  // Migrate an old {right,wrong,lastSeen} fact to the FSRS-lite shape.
  function migrateFact(f) {
    if (!f) return f;
    if (f.stab != null) return f;
    const right = f.right || 0, wrong = f.wrong || 0, last = f.lastSeen || 0;
    let stab;
    if (right >= 3 && wrong === 0) stab = 14;
    else if (right > wrong) stab = 2;
    else if (right > 0) stab = 1;
    else stab = 0.5;
    // Seed P(known) from Laplace-smoothed accuracy; live BKT refines it.
    const pL = (right + 1) / (right + wrong + 2);
    return { right, wrong, lastSeen: last, stab, last, recent: '', avgT: null, fast: 0, pL };
  }
  function migrateFacts(facts) {
    facts = facts || {};
    for (const k in facts) facts[k] = migrateFact(facts[k]);
    return facts;
  }
  function load() {
    try {
      const raw = localStorage.getItem(STATS_KEY);
      if (!raw) return blank();
      const d = JSON.parse(raw);
      return {
        facts: migrateFacts(d.facts || {}),
        divFacts: migrateFacts(d.divFacts || {}),
        skills: migrateFacts(d.skills || {}),
        hist: d.hist || [],
        snaps: d.snaps || [],
        buckets: d.buckets || {},
        streak: d.streak || { current: 0, best: 0, lastDay: null },
        unlocked: Object.assign({ division: false, bigmul: false, fractions: false }, d.unlocked || {}),
        seen: d.seen || {},
        plans: d.plans || [],
        errlog: d.errlog || [],
        pin: d.pin || null,
      };
    } catch { return blank(); }
  }
  function blank() { return { facts: {}, divFacts: {}, skills: {}, hist: [], snaps: [], buckets: {}, streak: { current: 0, best: 0, lastDay: null }, unlocked: { division: false, bigmul: false, fractions: false }, seen: {}, plans: [], errlog: [], pin: null }; }
  function save(d) {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(d)); } catch {}
  }
  let data = load();
  function mulKey(a, b) { return a <= b ? `${a}x${b}` : `${b}x${a}`; }
  function getFact(a, b) { return data.facts[mulKey(a, b)]; }

  // ---- FSRS-lite scheduling + mastery/fluency state ----
  function retr(f, now) {
    if (!f || !f.stab) return 0; // unseen / no stability → fully "due"
    const days = (now - (f.last || f.lastSeen || 0)) / 86400000;
    return Math.exp(-days / f.stab);
  }
  function skillFast(name) { return name === 'bigmul' ? FAST_BY_SKILL.bigmul : name.indexOf('frac') === 0 ? FAST_BY_SKILL.fractions : FAST_MS; }
  function factState(f, now, fastMs) {
    fastMs = fastMs || FAST_MS;
    if (!f || (f.right || 0) + (f.wrong || 0) === 0) return 'new';
    const rec = f.recent || '';
    const last3ok = rec.length >= 3 && rec.slice(-3) === '111';
    // Pre-engine data may have fewer than 3 recent records — fall back to the
    // overall right/wrong ratio so legacy accounts still count as accurate.
    const lastNotWrong = rec.length === 0 || rec.slice(-1) !== '0';
    const legacyOk = rec.length < 3 && (f.right || 0) >= 3 && (f.right || 0) >= 3 * (f.wrong || 0) && lastNotWrong;
    const accurate = last3ok || legacyOk;
    const fluentSpeed = f.avgT != null && f.avgT <= fastMs;
    if (accurate && fluentSpeed && (f.stab || 0) >= STAB_FLUENT) return 'fluent';
    if (accurate) return 'accurate';
    return 'learning';
  }
  // "Mastered" for unlocks/counts = accurate or better (speed is a bonus, not a gate).
  function isMasteredState(s) { return s === 'accurate' || s === 'fluent'; }
  function mulWeight(f) {
    if (!f || (f.right || 0) + (f.wrong || 0) === 0) return 2.5; // unseen → ensure coverage
    const R = retr(f, Date.now());
    const recentWrong = (f.recent || '').slice(-1) === '0' ? 0.8 : 0;
    return Math.max(0.2, 0.3 + 2.5 * (1 - R) + recentWrong);
  }
  function countWeight(stat) { // weight for add/sub buckets
    if (!stat) return 1;
    const rec = stat.recent || '';
    if (rec.length >= 3) {
      // Recency-first: weight by miss rate over the last 8 answers, not
      // lifetime counts — a wrong answer from months ago shouldn't chase the
      // child forever, and one recent miss should resurface the bucket.
      const miss = rec.split('0').length - 1;
      const missRate = miss / rec.length;
      const lastWrong = rec.slice(-1) === '0' ? 1 : 0;
      return Math.max(0.2, 0.5 + 4 * missRate + lastWrong);
    }
    // Legacy fallback until enough recent history accumulates.
    return Math.max(0.2, Math.min(8, 1 + 2 * (stat.wrong || 0) - 0.5 * (stat.right || 0)));
  }
  function blankFact() { return { right: 0, wrong: 0, lastSeen: 0, stab: 0, last: 0, recent: '', avgT: null, fast: 0, pL: BKT.L0 }; }
  function applyResult(f, correct, ms, fastMs, scaffolded) {
    const now = Date.now();
    fastMs = fastMs || FAST_MS;
    f.pL = bktUpdate(f.pL, correct); // calibrated P(known)
    // A right answer WITH the scaffold visible is easier than a bare one —
    // give it reduced stability growth and no fluency credit, so mastery
    // requires unassisted success.
    const wasFast = correct && !scaffolded && typeof ms === 'number' && ms > 0 && ms <= fastMs;
    if (correct) {
      f.right++;
      const grow = scaffolded ? 1.4 : (wasFast ? 2.6 : 1.8);
      f.stab = f.stab > 0 ? Math.min(STAB_MAX, f.stab * grow) : (wasFast ? 3 : 1.2);
      if (typeof ms === 'number' && ms > 0) f.avgT = f.avgT == null ? ms : Math.round(0.6 * f.avgT + 0.4 * ms);
      if (wasFast) f.fast = (f.fast || 0) + 1;
    } else {
      f.wrong++;
      // A lapse drops the review interval back to ~1 day so it resurfaces soon.
      f.stab = Math.min(1, Math.max(0.3, (f.stab || 1) * 0.2));
      f.fast = 0;
    }
    f.last = now; f.lastSeen = now;
    f.recent = ((f.recent || '') + (correct ? '1' : '0')).slice(-8);
    return f;
  }
  function recordMul(a, b, correct, ms, scaffolded) {
    const k = mulKey(a, b);
    data.facts[k] = applyResult(data.facts[k] || blankFact(), correct, ms, 0, scaffolded);
    save(data);
  }
  // Division facts are tracked by their multiplication family (b × quotient).
  function getDivFact(b, c) { return data.divFacts[mulKey(b, c)]; }
  function recordDiv(b, c, correct, ms, scaffolded) {
    const k = mulKey(b, c);
    data.divFacts[k] = applyResult(data.divFacts[k] || blankFact(), correct, ms, FAST_BY_SKILL.div, scaffolded);
    save(data);
  }
  function pickDivFacts(n) {
    const all = [];
    for (let b = 2; b <= 12; b++) {
      for (let c = b; c <= 12; c++) {
        all.push({ b, c, w: mulWeight(getDivFact(b, c)) });
      }
    }
    const out = [];
    for (let k = 0; k < n && all.length; k++) {
      const total = all.reduce((s, x) => s + x.w, 0);
      let r = Math.random() * total, idx = 0;
      while (idx < all.length - 1 && r > all[idx].w) { r -= all[idx].w; idx++; }
      out.push(all[idx]);
      all.splice(idx, 1);
    }
    return out;
  }
  // ---- Curriculum-ordered fact introduction ----
  // Standard times-table teaching sequence: 2s/5s/10s first (skip-counting,
  // pattern-rich), then 3/4, then the hard middle, 11/12 last. A fact's rank
  // is its easier table's position; within a table, smaller products first.
  const TABLE_ORDER = [2, 5, 10, 3, 4, 6, 7, 8, 9, 11, 12];
  function factIntroRank(a, b) {
    return Math.min(TABLE_ORDER.indexOf(a), TABLE_ORDER.indexOf(b)) * 1000 + a * b;
  }
  function frontierFacts(n) {
    // The next unseen facts in curriculum order — what a teacher would
    // introduce next.
    const out = [];
    for (let a = 2; a <= 12; a++) {
      for (let b = a; b <= 12; b++) {
        const f = getFact(a, b);
        if (!f || (f.right || 0) + (f.wrong || 0) === 0) out.push({ a, b, r: factIntroRank(a, b) });
      }
    }
    return out.sort((x, y) => x.r - y.r).slice(0, n);
  }
  function mulSeenCount() {
    let n = 0;
    for (const k in data.facts) {
      const f = data.facts[k];
      if ((f.right || 0) + (f.wrong || 0) > 0) n++;
    }
    return n;
  }
  // Rolling observed accuracy over the last n scored quizzes (the direct
  // signal the 85%-rule controller should track). null until 2 quizzes exist.
  function recentAccuracy(n) {
    const h = data.hist.slice(-(n || 5));
    if (h.length < 2) return null;
    let c = 0, t = 0;
    for (const q of h) { c += q.c || 0; t += q.n || 0; }
    return t ? c / t : null;
  }
  function mulFluentCount() {
    const now = Date.now();
    let m = 0;
    for (const k in data.facts) if (isMasteredState(factState(data.facts[k], now))) m++;
    return m;
  }
  // Skill-level tracking (for procedures like 2-digit multiplication that
  // aren't a small fixed fact set — one aggregate FSRS record per skill).
  function getSkill(name) { return data.skills[name]; }
  function recordSkill(name, correct, ms, scaffolded) {
    data.skills[name] = applyResult(data.skills[name] || blankFact(), correct, ms, skillFast(name), scaffolded);
    save(data);
  }
  function skillState(name) { return factState(data.skills[name], Date.now(), skillFast(name)); }
  // Mastery state for any question — drives expertise-adaptive scaffolding.
  function itemState(q) {
    const now = Date.now();
    if (q.type === 'mul' && q.big) return skillState('bigmul');
    if (q.type === 'mul') return factState(getFact(q.a, q.b), now);
    if (q.type === 'div' && q.fam) return factState(getDivFact(q.fam[0], q.fam[1]), now, FAST_BY_SKILL.div);
    if (q.type === 'fnam' || q.type === 'feq' || q.type === 'fcmp') return skillState('fractions');
    return 'new';
  }
  const DIV_UNLOCK_AT = 24;    // division unlocks once enough mul facts are fluent
  const BIGMUL_UNLOCK_AT = 40; // 2-digit multiplication unlocks with strong table fluency
  const FRAC_UNLOCK_AT = 50;   // fractions unlock once tables are very solid
  function checkUnlocks() {
    let newly = null;
    const fluent = mulFluentCount();
    if (!data.unlocked.division && fluent >= DIV_UNLOCK_AT) {
      data.unlocked.division = true; newly = newly || 'division'; save(data);
    }
    if (!data.unlocked.bigmul && fluent >= BIGMUL_UNLOCK_AT) {
      data.unlocked.bigmul = true; newly = newly || 'bigmul'; save(data);
    }
    if (!data.unlocked.fractions && fluent >= FRAC_UNLOCK_AT) {
      data.unlocked.fractions = true; newly = newly || 'fractions'; save(data);
    }
    return newly;
  }
  function isUnlocked(d) { return !!(data.unlocked && data.unlocked[d]); }
  // The next locked domain plus concrete progress toward it — lets the kid
  // page show "24/40 facts" instead of a vague "keep practicing".
  function nextUnlock() {
    const fluent = mulFluentCount();
    if (!data.unlocked.division) return { name: 'Division', emoji: '➗', have: fluent, need: DIV_UNLOCK_AT };
    if (!data.unlocked.bigmul) return { name: 'Bigger ×', emoji: '🔢', have: fluent, need: BIGMUL_UNLOCK_AT };
    if (!data.unlocked.fractions) return { name: 'Fractions', emoji: '🍕', have: fluent, need: FRAC_UNLOCK_AT };
    return null;
  }
  // Correct-but-slow = the child is counting/deriving, not retrieving
  // (Siegler's overlapping waves). These facts need a strategy, not more reps.
  function isSlowFact(a, b) {
    const f = getFact(a, b);
    return !!f && (f.right || 0) >= 3 && f.avgT != null && f.avgT > FAST_MS * 1.5 &&
           (f.recent || '').slice(-1) !== '0'; // currently getting it right — just slowly
  }
  function markSeen(k) { data.seen[k] = true; save(data); }
  function hasSeen(k) { return !!(data.seen && data.seen[k]); }
  function recordBucket(key, correct) {
    const b = data.buckets[key] || { right: 0, wrong: 0 };
    if (correct) b.right++; else b.wrong++;
    b.recent = ((b.recent || '') + (correct ? '1' : '0')).slice(-8);
    b.last = Date.now(); b.lastSeen = b.last; // mergeCountMap uses these
    data.buckets[key] = b;
    save(data);
  }
  function bumpStreak() {
    const today = todayKey();
    const s = data.streak;
    if (s.lastDay === today) return s; // already counted today
    if (!s.lastDay) s.current = 1;
    else {
      const diff = dayDiff(s.lastDay, today);
      // One day of grace: missing one calendar day still counts as continued
      // (kids miss a day; researchers + every streak app of note give grace).
      if (diff <= 2) s.current += 1;
      else s.current = 1;
    }
    s.lastDay = today;
    s.best = Math.max(s.best, s.current);
    save(data);

  for (let i = all.indexOf(fromInp) + 1; i < all.length; i++) {
    if (!all[i].readOnly) { all[i].focus(); return; }
  }
  if (fromInp) fromInp.blur();
}
function immCheck(q, idx, inp, card) {
  if (q._imm || state.submitted || String(q.given).trim() === '') return;
  if (answerCorrect(q)) {
    q._imm = 'right';
    card.classList.add('imm-good');
    inp.readOnly = true;
    try { Sound.tick(); } catch {}
    saveSession();
    focusNextOpen(inp);
  } else {
    q._imm = 'fixing';
    q._retype = '';
    card.classList.add('imm-fixing');
    const pill = el('div', 'fixpill');
    pill.appendChild(spanTxt('The answer is ', null));
    pill.appendChild(spanTxt(answerText(q), 'tabular fix-ans'));
    pill.appendChild(spanTxt(' — type it to lock it in 💪', null));
    inp.parentElement.parentElement.appendChild(pill);
    inp.value = '';
    try { Sound.soft(); } catch {}
    saveSession();
    inp.focus();
  }
}
function immFixed(q, inp, card) {
  q._imm = 'fixed';
  card.classList.remove('imm-fixing');
  card.classList.add('imm-fixed');
  inp.readOnly = true;
  try { Sound.tick(); } catch {}
  saveSession();
  focusNextOpen(inp);
}

function pinHash(s) {
  // Lightweight non-crypto hash — a deterrent, not real security.
  let h = 2166136261;
  const str = String(s);
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function parentGate() {
  const hash = Stats.getPinHash();
  if (hash) {
    const pin = prompt('Parent PIN (4 digits):');
    if (pin === null) return false;
    if (pinHash(pin.trim()) !== hash) { alert('Wrong PIN. Cancelled.'); return false; }
    return true;
  }
  // No PIN set → fall back to a 2-digit × 2-digit math gate.
  const a = rint(13, 39), b = rint(13, 39);
  const ans = prompt(`Parent check: what is ${a} × ${b}?\n(Set a PIN under "Parent PIN" to make this quicker.)`);
  if (ans === null) return false;
  if (Number(ans) !== a * b) { alert('Wrong answer. Cancelled.'); return false; }
  return true;
}

function genMul() {
  const a = rint(2, 12), b = rint(2, 12);
  return { type: 'mul', a, b, ans: a * b, label: 'Multiplication · ×' };
}
function countCarries(a, b) {
  let c = 0, carries = 0;
  for (let i = 0; i < 3; i++) {
    const da = Math.floor(a / Math.pow(10, i)) % 10;
    const db = Math.floor(b / Math.pow(10, i)) % 10;
    const s = da + db + c;
    c = s >= 10 ? 1 : 0;
    if (c) carries++;
  }
  return carries;
}
function countBorrows(a, b) {
  let borrow = 0, borrows = 0;
  for (let i = 0; i < 3; i++) {
    const da = Math.floor(a / Math.pow(10, i)) % 10;
    const db = Math.floor(b / Math.pow(10, i)) % 10;
    if (da - borrow < db) { borrows++; borrow = 1; }
    else borrow = 0;
  }
  return borrows;
}
function genAdd(targetCarries) {
  for (let t = 0; t < 80; t++) {
    const a = rint(120, 899), b = rint(120, 899);
    if (targetCarries == null || countCarries(a, b) === targetCarries) {
      const bk = countCarries(a, b);
      const scaffold = shouldScaffoldBucket('add', bk) ? { kind: 'expand-add' } : null;
      return { type: 'add', a, b, ans: a + b, label: 'Addition · +', bucket: `add:${bk}`, scaffold };
    }
  }
  const a = rint(120, 899), b = rint(120, 899);
  const bk = countCarries(a, b);
  const scaffold = shouldScaffoldBucket('add', bk) ? { kind: 'expand-add' } : null;
  return { type: 'add', a, b, ans: a + b, label: 'Addition · +', bucket: `add:${bk}`, scaffold };
}
function genSub(targetBorrows) {
  for (let t = 0; t < 80; t++) {
    const a = rint(300, 999);
    const b = rint(120, a - 100);
    if (targetBorrows == null || countBorrows(a, b) === targetBorrows) {
      const bk = countBorrows(a, b);
      const scaffold = shouldScaffoldBucket('sub', bk) ? { kind: 'expand-sub' } : null;
      return { type: 'sub', a, b, ans: a - b, label: 'Subtraction · −', bucket: `sub:${bk}`, scaffold };
    }
  }
  const a = rint(300, 999);
  const b = rint(120, a - 100);
  const bk = countBorrows(a, b);
  const scaffold = shouldScaffoldBucket('sub', bk) ? { kind: 'expand-sub' } : null;
  return { type: 'sub', a, b, ans: a - b, label: 'Subtraction · −', bucket: `sub:${bk}`, scaffold };
}

// Whether a weak add/sub bucket gets a scaffold. Only when the band is
// novice/developing, and either the bucket is unseen or its weight is high
// (weak). Once the bucket is consistently accurate, the scaffold disappears.
function shouldScaffoldBucket(prefix, bucket) {
  const band = difficultyBand();
  if (band === 'expert' || band === 'practicing') return false;
  const w = Stats.bucketWeight(`${prefix}:${bucket}`); // 1 unseen; high = weak
  // Always scaffold novices on harder buckets (1+) when not yet mastered.
  // For 0-carry/0-borrow buckets we don't need scaffolding even for novices.
  if (bucket === 0) return false;
  if (w < 0.6) return false; // bucket is solid → no scaffold
  return Math.random() < (band === 'novice' ? 0.7 : 0.45);
}

// Two-digit × one-digit multiplication (its own unlocked skill domain).
function genBigMul() {
  const a = rint(11, 99), b = rint(2, 9);
  const state = Stats.skillState('bigmul');
  const review = state !== 'fluent';
  // Completion scaffold (faded worked example): while still learning, show the
  // partial products and let the child complete the final add. Fades out once
  // accurate/fluent so it doesn't become redundant (expertise reversal).
  const scaffold = (state === 'new' || state === 'learning') && Math.random() < 0.5;
  return { type: 'mul', a, b, ans: a * b, label: 'Multiplication · ×', big: true, isReview: review, scaffold };
}

// Division fact (inverse of a times-table fact, no remainder).
function genDiv() {
  const p = Stats.pickDivFacts(1)[0] || { b: rint(2, 12), c: rint(2, 12) };
  const flip = Math.random() < 0.5;
  const divisor = flip ? p.c : p.b;
  const quotient = flip ? p.b : p.c;
  const dividend = p.b * p.c;
  const fam = Stats.getDivFact(p.b, p.c);
  const isReview = !!fam && (fam.wrong || 0) > 0 && Stats.factWeight(fam) > 1.5;
  // Novice scaffold: turn division into the inverse-multiplication question
  // the child has already learned ("7 × ? = 56"). Only when the family is
  // still new/learning so it disappears with mastery.
  const fState = Stats.itemState({ type: 'div', fam: [p.b, p.c] });
  const scaffold = (fState === 'new' || fState === 'learning') && Math.random() < 0.6
    ? { kind: 'inverse', divisor, dividend } : null;
  return { type: 'div', a: dividend, b: divisor, ans: quotient, fam: [p.b, p.c], label: 'Division · ÷', isReview, scaffold };
}

function mulQuestion(a, b) {
  const stat = Stats.getFact(a, b);
  const isReview = !!stat && (stat.wrong || 0) > 0 && Stats.factWeight(stat) > 1.5;
  const isSlow = !isReview && Stats.isSlowFact(a, b);
  // Procedural scaffolds for novices: only on facts the child is still
  // learning (state ∈ new|learning), and never with the smallest operands
  // (those are easy enough without scaffolding).
  const fState = Stats.itemState({ type: 'mul', a, b });
  const scaffoldable = (fState === 'new' || fState === 'learning') &&
                       Math.min(a, b) >= 3 && Math.max(a, b) >= 4;
  let scaffold = null;
  if (scaffoldable && Math.random() < 0.65) {
    // Two scaffolds: 'addition' (concrete: repeated add) and 'split'
    // (use a known fact to reach the unknown). Pick by which fits the operands.
    const lo = Math.min(a, b), hi = Math.max(a, b);
    if (lo <= 6) scaffold = { kind: 'addition', lo, hi };
    else scaffold = { kind: 'split', lo, hi };
  }
  return { type: 'mul', a, b, ans: a * b, label: 'Multiplication · ×', isReview, isSlow, scaffold };
}

// ---------- Fractions (CC grade 3: denominators 2,3,4,6,8) ----------
const FRAC_DENS = [2, 3, 4, 6, 8];
const fracReview = () => Stats.skillState('fractions') !== 'fluent';
function genFracName() {
  const den = FRAC_DENS[rint(0, FRAC_DENS.length - 1)];
  const shaded = rint(1, den - 1);
  return { type: 'fnam', den, shaded, ansNum: shaded, ansDen: den, label: 'Fractions · name', isReview: fracReview() };
}
function genFracEquiv() {
  const pairs = [[2, 4], [2, 6], [2, 8], [3, 6], [4, 8]];
  const [d1, d2] = pairs[rint(0, pairs.length - 1)];
  const m = d2 / d1;
  const n1 = rint(1, d1 - 1);
  return { type: 'feq', n1, d1, d2, ans: n1 * m, label: 'Fractions · equal', isReview: fracReview() };
}
function genFracCompare() {
  let n1, d1, n2, d2;
  const c = rint(0, 2);
  if (c === 0) { // same numerator, different denominator
    const n = rint(1, 2); d1 = FRAC_DENS[rint(0, 4)]; do { d2 = FRAC_DENS[rint(0, 4)]; } while (d2 === d1);
    n1 = Math.min(n, d1 - 1) || 1; n2 = Math.min(n, d2 - 1) || 1;
  } else if (c === 1) { // same denominator, different numerator
    d1 = d2 = FRAC_DENS[rint(1, 4)];
    n1 = rint(1, d1 - 1); do { n2 = rint(1, d1 - 1); } while (n2 === n1);
  } else { // equivalent → '='
    const pairs = [[1, 2, 2, 4], [1, 2, 3, 6], [1, 3, 2, 6], [2, 4, 1, 2], [2, 8, 1, 4]];
    [n1, d1, n2, d2] = pairs[rint(0, pairs.length - 1)];
  }
  const lhs = n1 * d2, rhs = n2 * d1;
  const ans = lhs < rhs ? '<' : lhs > rhs ? '>' : '=';
  return { type: 'fcmp', n1, d1, n2, d2, ans, label: 'Fractions · compare', isReview: fracReview() };
}
// Pick which fraction sub-skill to test, weighted by weakness (spaced-
// repetition weight; unseen sub-skills weigh 2.5 so coverage is guaranteed).
function pickFracType() {
  const types = ['fnam', 'feq', 'fcmp'];
  const ws = types.map(t => Stats.factWeight(Stats.getSkill('frac.' + t)));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < types.length; i++) { r -= ws[i]; if (r <= 0) return types[i]; }
  return types[2];
}
function genFraction() {
  const t = pickFracType();
  return t === 'fnam' ? genFracName() : t === 'feq' ? genFracEquiv() : genFracCompare();
}
function fracTip(q) {
  if (q.type === 'fnam') return 'Top = shaded parts. Bottom = total equal parts.';
  if (q.type === 'feq') return `Multiply top and bottom by the same number (×${q.d2 / q.d1}).`;
  return 'Same top? More pieces means each is smaller. Same bottom? Bigger top wins.';
}

function shuffleQuiz(qs) {
  for (let i = qs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qs[i], qs[j]] = [qs[j], qs[i]];
  }
  return qs.map((q, i) => ({ ...q, id: i, given: '' }));
}

// Difficulty controller targeting the 85% rule (Wilson et al., Nature Comms
// 2019). Two corrections over a plain model-mastery mapping:
//   1. Coverage: overallMulMastery averages only SEEN facts, so a child who
//      drilled 10 facts to mastery would read as "expert" with 56 facts
//      untouched. Scale by curriculum coverage before banding.
//   2. Closed loop: the model's BKT parameters are assumptions; the observed
//      recent success rate is ground truth. If the child is actually scoring
//      below ~70%, step the band down; above ~93%, step it up.
function difficultyBand() {
  const m = Stats.overallMulMastery(); // 0..1, seen facts only
  const cov = Stats.mulSeenCount() / 66;
  const eff = m * (0.35 + 0.65 * Math.min(1, cov / 0.75));
  let band = eff < 0.45 ? 0 : eff < 0.70 ? 1 : eff < 0.92 ? 2 : 3;
  const acc = Stats.recentAccuracy(5); // null until 2 scored quizzes
  if (acc != null) {
    if (acc < 0.70 && band > 0) band--;
    else if (acc > 0.93 && band < 3) band++;
  }
  return ['novice', 'developing', 'practicing', 'expert'][band];
}
function newQuiz() {
  const qs = [];
  const band = difficultyBand();
  const divOn = Stats.isUnlocked('division');
  const bigOn = Stats.isUnlocked('bigmul');
  const fracOn = Stats.isUnlocked('fractions');

  // Allocate 6 non-add/sub slots by band — more mul-fact reps for novices
  // (easier, builds confidence), more challenge slots for experts.
  let mul, big, div, frac;
  if (band === 'novice') {
    mul = 6 - (divOn ? 1 : 0); big = 0; div = divOn ? 1 : 0; frac = 0;
  } else if (band === 'developing') {
    mul = 4 - (fracOn ? 1 : 0); big = bigOn ? 1 : 0; div = divOn ? 1 : 0; frac = fracOn ? 1 : 0;
  } else if (band === 'practicing') {
    mul = 2; big = bigOn ? 2 : 0; div = divOn ? 1 : 0; frac = fracOn ? 1 : 0;
  } else { // expert
    mul = 1; big = bigOn ? 2 : 0; div = divOn ? 2 : 0; frac = fracOn ? 2 : 0;
  }
  // Backfill into mul if some domains are still locked.
  const target = 6;
  let used = mul + big + div + frac;
  if (used < target) mul += (target - used);
  // Trim to exactly 6 by dropping from the hardest available domain.
  used = mul + big + div + frac;
  while (used > target) {
    if (frac > 0 && band !== 'expert') frac--;
    else if (big > 0) big--;
    else if (div > 0) div--;
    else if (mul > 1) mul--;
    else break;
    used = mul + big + div + frac;
  }
  // Bias mul-fact selection: novices get easier, experts get harder.
  const mulBias = band === 'novice' || band === 'developing' ? 'easy'
              : band === 'expert' ? 'hard' : 'auto';
  Stats.pickMulFacts(mul, mulBias).forEach(p => {
    const flip = Math.random() < 0.5;
    qs.push(mulQuestion(flip ? p.b : p.a, flip ? p.a : p.b));
  });
  for (let i = 0; i < big; i++) qs.push(genBigMul());
  for (let i = 0; i < div; i++) qs.push(genDiv());
  for (let i = 0; i < frac; i++) qs.push(genFraction());
  const bucketBias = band === 'novice' ? 'easy' : band === 'expert' ? 'hard' : 'auto';
  for (let i = 0; i < 2; i++) qs.push(genAdd(Stats.pickBucket('add', bucketBias)));
  for (let i = 0; i < 2; i++) qs.push(genSub(Stats.pickBucket('sub', bucketBias)));
  return shuffleQuiz(qs);
}

// Focused learning quizzes (used right after a lesson, and to "learn until learned").
function divisionQuiz() {
  const qs = [];
  for (let i = 0; i < 8; i++) qs.push(genDiv());
  qs.push(genAdd(Stats.pickBucket('add')));
  qs.push(genSub(Stats.pickBucket('sub')));
  return shuffleQuiz(qs);
}
function bigmulQuiz() {
  const qs = [];
  for (let i = 0; i < 8; i++) qs.push(genBigMul());
  qs.push(genAdd(Stats.pickBucket('add')));
  qs.push(genSub(Stats.pickBucket('sub')));
  return shuffleQuiz(qs);
}
function fractionQuiz() {
  const qs = [];
  // One of each sub-skill guaranteed (coverage), then five more weighted
  // toward whichever sub-skill is weakest right now.
  qs.push(genFracName()); qs.push(genFracEquiv()); qs.push(genFracCompare());
  for (let i = 0; i < 5; i++) qs.push(genFraction());
  qs.push(genAdd(Stats.pickBucket('add')));
  qs.push(genSub(Stats.pickBucket('sub')));
  return shuffleQuiz(qs);
}

// A quiz built mostly from the child's weakest items.
function focusQuiz() {
  const s = Stats.summary();
  const qs = [];
  let facts = s.weak.slice(0, 6).map(w => ({ a: w.a, b: w.b }));
  if (facts.length < 6) {
    const extra = Stats.pickMulFacts(6 - facts.length);
    facts = facts.concat(extra.map(p => ({ a: p.a, b: p.b })));
  }
  // Confusion pairs practice best side by side: when the error log shows
  // "6×7 answered as 48", make sure BOTH 6×7 and 6×8 are in the set.
  const fkey = f => Math.min(f.a, f.b) + 'x' + Math.max(f.a, f.b);
  const pairs = Stats.errorPatterns().filter(p => p.pair).slice(0, 2);
  for (const p of pairs) {
    for (const f of [{ a: p.pair[0], b: p.pair[1] }, { a: p.pair[2], b: p.pair[3] }]) {
      if (!facts.some(x => fkey(x) === fkey(f)) && facts.length < 8) facts.push(f);
    }
  }
  facts.forEach(f => {
    const flip = Math.random() < 0.5;
    const a = flip ? f.b : f.a, b = flip ? f.a : f.b;
    qs.push({ type: 'mul', a, b, ans: a * b, label: 'Multiplication · ×', isReview: true });
  });
  const worstBucket = (p) => [...s.buckets[p]]
    .sort((x, y) => Stats.bucketWeight(`${p}:${y.k}`) - Stats.bucketWeight(`${p}:${x.k}`))[0];
  const wa = worstBucket('add'), ws = worstBucket('sub');
  for (let i = 0; i < 2; i++) qs.push(genAdd(wa ? wa.k : null));
  for (let i = 0; i < 2; i++) qs.push(genSub(ws ? ws.k : null));
  for (let i = qs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [qs[i], qs[j]] = [qs[j], qs[i]];
  }
  return qs.map((q, i) => ({ ...q, id: i, given: '' }));
}

/* ---------- Diagnostic engine ---------- */
function diagFraction(q) {
  if (q.type === 'fnam') {
    const gn = Number(q.givenNum), gd = Number(q.givenDen);
    const work = `${q.shaded} of ${q.den} equal parts are shaded → <b>${q.shaded}/${q.den}</b>.`;
    if (q.givenNum === '' && q.givenDen === '' || q.givenNum == null) return { why: 'You left this blank.', work, tip: 'Top = shaded parts, bottom = total parts.' };
    if (gn === q.den && gd === q.shaded) return { why: `You flipped it. The top is the shaded parts (${q.shaded}), the bottom is the total parts (${q.den}).`, work, tip: 'Top = part you have. Bottom = whole.' };
    return { why: `Count carefully: ${q.shaded} shaded out of ${q.den} equal parts.`, work, tip: 'Top counts the shaded parts; bottom counts all the parts.' };
  }
  if (q.type === 'feq') {
    const g = Number(q.given), m = q.d2 / q.d1, work = `${q.n1}/${q.d1}: multiply top and bottom by ${m} → ${q.n1 * m}/${q.d2}.`;
    if (q.given === '' || !Number.isFinite(g)) return { why: 'You left this blank.', work, tip: `Multiply top and bottom by ${m}.` };
    if (g === q.d2) return { why: `${q.d2} is the bottom number. You need the new top.`, work, tip: `Multiply the top (${q.n1}) by ${m}.` };
    if (g === q.n1) return { why: `You kept the top the same. The bottom grew ${m}×, so the top must too.`, work, tip: `${q.n1} × ${m} = ${q.ans}.` };
    return { why: `To keep the same value, multiply top and bottom by the same number (${m}).`, work, tip: `${q.n1} × ${m} = ${q.ans}.` };
  }
  // fcmp
  const work = `Make the bottoms match: ${q.n1}/${q.d1} = ${q.n1 * q.d2}/${q.d1 * q.d2}, ${q.n2}/${q.d2} = ${q.n2 * q.d1}/${q.d1 * q.d2}. So ${q.n1}/${q.d1} <b>${q.ans}</b> ${q.n2}/${q.d2}.`;
  let tip;
  if (q.d1 === q.d2) tip = 'Same bottom — the bigger top is bigger.';
  else if (q.n1 === q.n2) tip = 'Same top — more pieces means each piece is smaller.';
  else tip = 'Give both fractions the same bottom number, then compare the tops.';
  return { why: q.given ? `Not quite — ${q.n1}/${q.d1} ${q.ans} ${q.n2}/${q.d2}.` : 'You didn\'t pick one.', work, tip };
}

function diagnose(q, given) {
  if (q.type === 'fnam' || q.type === 'feq' || q.type === 'fcmp') return diagFraction(q);
  const g = Number(given);
  if (given === '' || !Number.isFinite(g)) {
    return {
      why: 'You left this one blank.',
      work: buildWork(q),
      tip: 'Next time, take a guess even if you are not sure — an estimate is better than nothing.'
    };
  }
  if (q.type === 'mul') return q.big ? diagBigMul(q, g) : diagMul(q, g);
  if (q.type === 'add') return diagAdd(q, g);
  if (q.type === 'sub') return diagSub(q, g);
  if (q.type === 'div') return diagDiv(q, g);
}

function diagBigMul(q, g) {
  const a = q.a, b = q.b, ans = a * b;
  const ones = a % 10, tens = Math.floor(a / 10) * 10;
  const onesProd = ones * b, tensProd = tens * b;
  if (g === onesProd) return { why: `You only multiplied the ones: ${ones} × ${b} = ${onesProd}. The tens still need multiplying.`, work: buildBigMulWork(a, b), tip: `Break ${a} into ${tens} + ${ones}, multiply each, then add.` };
  if (g === tensProd) return { why: `You only multiplied the tens: ${tens} × ${b} = ${tensProd}. Add the ones part too.`, work: buildBigMulWork(a, b), tip: `Don't forget ${ones} × ${b} = ${onesProd}.` };
  if (g === a + b) return { why: `You added instead of multiplying.`, work: buildBigMulWork(a, b), tip: `× means groups of ${a}, not ${a} + ${b}.` };
  if (Math.abs(g - ans) <= 9) return { why: `So close — off by ${Math.abs(g - ans)}. Probably a small carrying slip.`, work: buildBigMulWork(a, b), tip: `Multiply the ones, carry, then the tens.` };
  return { why: `Break the big number into tens and ones and multiply each part.`, work: buildBigMulWork(a, b), tip: `${tens} × ${b} + ${ones} × ${b} = ${ans}.` };
}

function buildBigMulWork(a, b) {
  const ones = a % 10, tens = Math.floor(a / 10) * 10;
  return [
    `${a} × ${b} = ?`,
    `Break ${a} into ${tens} + ${ones}`,
    `${tens} × ${b} = ${tens * b}`,
    `${ones} × ${b} = ${ones * b}`,
    `Add: ${tens * b} + ${ones * b} = <b>${a * b}</b>`,
  ].join('\n');
}

function diagDiv(q, g) {
  const a = q.a, b = q.b, ans = q.ans; // a ÷ b = ans
  if (g === a * b) return { why: `You multiplied instead of dividing: ${a} × ${b} = ${a * b}. Division shares ${a} into ${b} equal groups.`, work: buildDivWork(a, b), tip: `Ask: "${b} times what makes ${a}?"` };
  if (g === a - b) return { why: `You subtracted instead of dividing.`, work: buildDivWork(a, b), tip: `÷ means "share into equal groups", not "take away".` };
  if (g === b) return { why: `You answered the divisor itself (${b}). The question asks how many are in each group.`, work: buildDivWork(a, b), tip: `${b} × ${ans} = ${a}, so ${a} ÷ ${b} = ${ans}.` };
  if (g > 0 && (g + 1) * b === a) return { why: `So close — you answered ${g}, but ${g} × ${b} = ${g * b}, which is ${b} short of ${a}.`, work: buildDivWork(a, b), tip: `You need one more group: ${ans} × ${b} = ${a}.` };
  if (g > 0 && (g - 1) * b === a) return { why: `So close — you answered ${g}, but ${g} × ${b} = ${g * b}, which is ${b} too many.`, work: buildDivWork(a, b), tip: `One fewer group: ${ans} × ${b} = ${a}.` };
  if (g > 0 && a % g === 0 && g !== ans) return { why: `${g} doesn't fit: ${b} × ${g} = ${b * g}, not ${a}.`, work: buildDivWork(a, b), tip: `Find the number that times ${b} equals ${a}.` };
  return { why: `Not quite. Division asks: how many groups of ${b} are in ${a}?`, work: buildDivWork(a, b), tip: `Use the times table for ${b}: ${b} × ${ans} = ${a}.` };
}

function buildDivWork(a, b) {
  const ans = a / b;
  const lines = [];
  lines.push(`${a} ÷ ${b} = ?`);
  lines.push(`Division is the opposite of multiplication.`);
  lines.push(`Ask: <b>${b} × ? = ${a}</b>`);
  lines.push(`${b} × ${ans} = ${a}`);
  lines.push(`So ${a} ÷ ${b} = <b>${ans}</b>`);

function diagMul(q, g) {
  const { a, b, ans } = q;
  const diff = g - ans;

  if (diff === a) return { why: `You answered ${a} × ${b + 1} = ${a*(b+1)}. Looks like you counted one extra group of ${a}.`, work: buildMulWork(a, b), tip: `Pause and ask: "How many groups of ${a}?" The answer is ${b}, not ${b+1}.` };
  if (diff === -a) return { why: `You answered ${a} × ${b - 1} = ${a*(b-1)}. You missed one group of ${a}.`, work: buildMulWork(a, b), tip: `${a} × ${b} is one more ${a} than ${a} × ${b-1}.` };
  if (diff === b) return { why: `You answered ${a + 1} × ${b} = ${(a+1)*b}. You added an extra group of ${b}.`, work: buildMulWork(a, b), tip: `${a} × ${b} is one less ${b} than ${a+1} × ${b}.` };
  if (diff === -b) return { why: `You answered ${a - 1} × ${b} = ${(a-1)*b}. You missed one group of ${b}.`, work: buildMulWork(a, b), tip: `${a} × ${b} is one more ${b} than ${a-1} × ${b}.` };

  if (g === a + b) return { why: `You added instead of multiplying: ${a} + ${b} = ${a+b}. Watch the × sign.`, work: buildMulWork(a, b), tip: `× means "${b} groups of ${a}", not "add them".` };

  if (ans >= 10 && reverseNum(ans) === g) return { why: `The digits are reversed: the answer is ${ans} but you wrote ${g}.`, work: buildMulWork(a, b), tip: 'Double-check the order of the ones and tens digit before moving on.' };

  for (let k = -3; k <= 3; k++) {
    if (k === 0 || k === 1 || k === -1) continue;
    if (g === a * (b + k)) return { why: `You answered ${a} × ${b + k} = ${g}. You mixed up neighbouring rows in the ${a} times table.`, work: buildMulWork(a, b), tip: `Times table for ${a}: ${a}×${b-1}=${a*(b-1)}, ${a}×${b}=${ans}, ${a}×${b+1}=${a*(b+1)}.` };
    if (g === (a + k) * b) return { why: `You answered ${a + k} × ${b} = ${g}. You mixed up ${a} with ${a+k}.`, work: buildMulWork(a, b), tip: 'Read the first number carefully.' };

  if (g === ans * 10 || g === ans * 100) return { why: `Your answer is ${g/ans}× too big — looks like an extra zero.`, work: buildMulWork(a, b), tip: 'Estimate first: two small numbers multiplied rarely go above 144.' };

  return { why: `You were off by ${Math.abs(diff)}. The times-table fact didn't come out right.`, work: buildMulWork(a, b), tip: `Practice the ${a} times table: ${a}×1 all the way up to ${a}×12.` };
}

function diagAdd(q, g) {
  const { a, b, ans } = q;
  const diff = g - ans;

  const noCarry = sumNoCarry(a, b);
  if (g === noCarry && noCarry !== ans) {
    const cols = whichColumnsNeedCarry(a, b);
    return {
      why: `You forgot to carry. The ${cols.join(' and ')} column went over 10.`,
      work: buildAddWork(a, b),
      tip: 'When a column adds to 10 or more, carry the 1 to the next column.'
    };
  }

  if (diff === -10) return { why: 'You missed the carry from ones to tens (off by 10).', work: buildAddWork(a, b), tip: 'When the ones add to 10 or more, add 1 to the tens.' };
  if (diff === -100) return { why: 'You missed the carry from tens to hundreds (off by 100).', work: buildAddWork(a, b), tip: 'When the tens add to 10 or more, add 1 to the hundreds.' };
  if (diff === -110) return { why: 'You missed both carries (off by 110).', work: buildAddWork(a, b), tip: 'Check each column right-to-left: any column ≥ 10? Carry 1.' };

  if (Math.abs(diff) <= 3) return { why: `So close — off by ${Math.abs(diff)}. A small slip in one column.`, work: buildAddWork(a, b), tip: 'Double-check each column total on scratch paper.' };

  return { why: `Off by ${Math.abs(diff)} — probably lined up the columns wrong.`, work: buildAddWork(a, b), tip: 'Line up ones under ones, tens under tens, hundreds under hundreds.' };
}

function diagSub(q, g) {
  const { a, b, ans } = q;
  const diff = g - ans;

  const noBorrow = subAbsPerColumn(a, b);
  if (g === noBorrow && noBorrow !== ans) {
    return {
      why: 'You did bigger-minus-smaller in each column instead of borrowing.',
      work: buildSubWork(a, b),
      tip: 'When the top is smaller, borrow 1 (worth 10) from the column to its left.'
    };
  }
  if (diff === 10) return { why: 'You missed the borrow from tens (off by 10).', work: buildSubWork(a, b), tip: 'Top smaller than bottom? Borrow 1 — it becomes +10.' };
  if (diff === 100) return { why: 'You missed the borrow from hundreds (off by 100).', work: buildSubWork(a, b), tip: 'When you borrow from the hundreds, subtract 1 from that hundreds digit.' };
  if (diff === 110) return { why: 'You missed both borrows (off by 110).', work: buildSubWork(a, b), tip: 'Check each column: top smaller than bottom? Borrow.' };

  if (g === b - a) return { why: 'You swapped the numbers — that was smaller minus bigger.', work: buildSubWork(a, b), tip: `${a} − ${b} means: start with ${a}, take away ${b}.` };

  if (Math.abs(diff) <= 3) return { why: `So close — off by ${Math.abs(diff)}. A small slip in one column.`, work: buildSubWork(a, b), tip: 'Double-check the column right after a borrow.' };

  return { why: `Off by ${Math.abs(diff)} — probably lined up the columns wrong.`, work: buildSubWork(a, b), tip: 'Line up ones under ones, tens under tens, hundreds under hundreds.' };
}

/* ---------- Solution rendering ---------- */
function buildWork(q) {
  if (q.type === 'mul') return q.big ? buildBigMulWork(q.a, q.b) : buildMulWork(q.a, q.b);
  if (q.type === 'add') return buildAddWork(q.a, q.b);
  if (q.type === 'sub') return buildSubWork(q.a, q.b);
  if (q.type === 'div') return buildDivWork(q.a, q.b);
}

function buildMulWork(a, b) {
  const ans = a * b;
  let lines = [`${a} × ${b} = ?`];
  if (b === 12) {
    lines.push(`Think: 12 = 10 + 2`);
    lines.push(`${a} × 10 = ${a*10}`);
    lines.push(`${a} ×  2 = ${a*2}`);
    lines.push(`Total   = ${a*10} + ${a*2} = <b>${ans}</b>`);
  } else if (b === 11) {
    lines.push(`Think: 11 = 10 + 1`);
    lines.push(`${a} × 10 = ${a*10}`);
    lines.push(`${a} ×  1 = ${a}`);
    lines.push(`Total   = ${a*10} + ${a} = <b>${ans}</b>`);
  } else if (a === 9 || b === 9) {
    const x = a === 9 ? b : a;
    lines.push(`Trick: 9 × ${x} = 10 × ${x} − ${x}`);
    lines.push(`     = ${10*x} − ${x} = <b>${9*x}</b>`);
  } else {
    if (b > 5) {
      lines.push(`Split: ${b} = 5 + ${b-5}`);
      lines.push(`${a} × 5      = ${a*5}`);
      lines.push(`${a} × ${b-5}      = ${a*(b-5)}`);
      lines.push(`Total       = ${a*5} + ${a*(b-5)} = <b>${ans}</b>`);
    } else {
      let s = '';
      for (let i = 0; i < b; i++) s += (i ? ' + ' : '') + a;
      lines.push(`= ${s}`);
      lines.push(`= <b>${ans}</b>`);
    }
  }
  return lines.join('\n');
}

function gridRow(cells) {
  return '<div class="wrow">' + cells.map(c => {
    const cls = c.cls || '';
    return `<div class="wcell ${cls}">${c.v ?? ''}</div>`;
  }).join('') + '</div>';
}
function gridCols(n) {
  return `style="grid-template-columns:repeat(${n}, 1.6em)"`;
}

function buildAddWork(a, b) {
  const sum = a + b;
  const sa = String(a), sb = String(b), ss = String(sum);
  const opW = Math.max(sa.length, sb.length);
  const carries = [];
  let c = 0;
  for (let i = 0; i < opW; i++) {
    const da = i < sa.length ? Number(sa[sa.length - 1 - i]) : 0;
    const db = i < sb.length ? Number(sb[sb.length - 1 - i]) : 0;
    const s = da + db + c;
    c = s >= 10 ? 1 : 0;
    carries.push(c);
  }
  const finalCarry = carries[opW - 1];
  const totW = opW + 1; // +1 for sign/final-carry column
  // build cells (left → right): [sign-col] + [opW operand cols]
  const carryCells = [{v:''}];
  for (let i = 0; i < opW; i++) {
    const colFromRight = opW - 1 - i;
    const carryIn = colFromRight > 0 ? carries[colFromRight - 1] : 0;
    carryCells.push({v: carryIn ? '1' : '', cls: 'bw'});
  }
  const aCells = [{v:''}].concat(sa.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'op'})));
  const bCells = [{v:'+', cls:'sign'}].concat(sb.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'op'})));
  const sCells = (finalCarry ? '1' : ' ').concat((finalCarry ? ss.slice(1) : ss).padStart(opW,' ')).split('').map(d => ({v: d.trim(), cls:'sum'}));
  const colStyle = gridCols(totW);
  const c1 = carries[0], c2 = carries[1];
  return `<div class="wgrid" ${colStyle}>` +
    gridRow(carryCells) +
    gridRow(aCells) +
    gridRow(bCells) +
    `<div class="wline"></div>` +
    gridRow(sCells) +
    `</div><div class="wsteps">` +
    `Ones: ${a%10} + ${b%10} = ${(a%10)+(b%10)}${c1?' → write '+((a%10)+(b%10))%10+', <b>carry 1</b>':''}<br>` +
    `Tens: ${Math.floor(a/10)%10} + ${Math.floor(b/10)%10}${c1?' + 1':''} = ${(Math.floor(a/10)%10)+(Math.floor(b/10)%10)+c1}${c2?' → write '+((Math.floor(a/10)%10)+(Math.floor(b/10)%10)+c1)%10+', <b>carry 1</b>':''}<br>` +
    `Hundreds: ${Math.floor(a/100)} + ${Math.floor(b/100)}${c2?' + 1':''} = ${Math.floor(a/100)+Math.floor(b/100)+c2}` +
    `</div>`;
}

function buildSubWork(a, b) {
  const ans = a - b;
  const sa = String(a), sb = String(b), ss = String(ans);
  const opW = Math.max(sa.length, sb.length);
  const aD = [], bD = [];
  for (let i = 0; i < opW; i++) {
    aD.push(i < sa.length ? Number(sa[sa.length-1-i]) : 0);
    bD.push(i < sb.length ? Number(sb[sb.length-1-i]) : 0);
  }
  const newA = [...aD];
  const borrowed = [];
  for (let i = 0; i < opW; i++) {
    if (newA[i] < bD[i]) { borrowed[i] = true; newA[i] += 10; newA[i+1] = (newA[i+1] ?? 0) - 1; }
    else borrowed[i] = false;
  }
  const anyBorrow = borrowed.some(Boolean);
  const totW = opW + 1;
  // borrow row: cell shows new value (could be 2-digit) only where it changed
  const bwCells = [{v:''}];
  for (let i = 0; i < opW; i++) {
    const col = opW - 1 - i;
    const v = newA[col] !== aD[col] ? String(newA[col]) : '';
    bwCells.push({v, cls:'bw'});
  }
  const aCells = [{v:''}].concat(sa.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'op'})));
  const bCells = [{v:'−', cls:'sign'}].concat(sb.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'op'})));
  const sCells = [{v:''}].concat(ss.padStart(opW,' ').split('').map(d => ({v: d.trim(), cls:'sum'})));
  const colStyle = gridCols(totW);
  const b1 = borrowed[0], b2 = borrowed[1];
  const o = (a%10), t = Math.floor(a/10)%10, h = Math.floor(a/100);
  const bo = (b%10), bt = Math.floor(b/10)%10, bh = Math.floor(b/100);
  const newO = b1 ? o + 10 : o;
  const newT = (b1 ? t - 1 : t) + (b2 ? 10 : 0);
  const newH = b2 ? h - 1 : h;
  return `<div class="wgrid" ${colStyle}>` +
    (anyBorrow ? gridRow(bwCells) : '') +
    gridRow(aCells) +
    gridRow(bCells) +
    `<div class="wline"></div>` +
    gridRow(sCells) +
    `</div><div class="wsteps">` +
    `Ones: ${b1 ? `${o} can't take ${bo}. <b>Borrow 1 from tens</b> → ${newO} − ${bo}` : `${o} − ${bo}`} = ${newO - bo}<br>` +
    `Tens: ${b1 ? `after lending, the tens digit is ${t - 1}. ` : ''}${b2 ? `${t - (b1?1:0)} can't take ${bt}. <b>Borrow 1 from hundreds</b> → ${newT} − ${bt}` : `${t - (b1?1:0)} − ${bt}`} = ${newT - bt}<br>` +
    `Hundreds: ${b2 ? `after lending, hundreds digit is ${h - 1}. ${h - 1} − ${bh}` : `${h} − ${bh}`} = ${newH - bh}` +
    (anyBorrow ? `<br><span style="color:var(--ink-3)">(Numbers above each column show its value after borrowing.)</span>` : '') +
    `</div>`;
}

function pad3(n) { return String(n).padStart(3, ' '); }
function reverseNum(n) { return Number(String(n).split('').reverse().join('')); }
function sumNoCarry(a, b) {
  let r = '', x = a, y = b;
  for (let i = 0; i < 4; i++) {
    const d = (x%10) + (y%10);
    r = (d % 10) + r;
    x = Math.floor(x/10); y = Math.floor(y/10);
    if (x === 0 && y === 0) break;
  }
  return Number(r);
}
function whichColumnsNeedCarry(a, b) {
  const out = [];
  if ((a%10)+(b%10) >= 10) out.push('ones');
  const carry = (a%10)+(b%10) >= 10 ? 1 : 0;
  if ((Math.floor(a/10)%10)+(Math.floor(b/10)%10)+carry >= 10) out.push('tens');
  return out.length ? out : ['some'];
}
function subAbsPerColumn(a, b) {
  let r = '';
  for (let i = 0; i < 3; i++) {
    const da = Math.floor(a / Math.pow(10, i)) % 10;
    const db = Math.floor(b / Math.pow(10, i)) % 10;
    r = Math.abs(da - db) + r;
  }
  return Number(r);
}

/* ---------- App state + render ---------- */
// Keep in step with CACHE in sw.js — shown in the page footer so a stale
// service-worker install is diagnosable from the device itself. Bump both
// on every release, and stamp APP_UPDATED with the release date.
const APP_VERSION = 'v43';
const APP_UPDATED = '2026-08-21';
// In-progress quiz survives refreshes/crashes/SW updates: every answer
// keystroke snapshots the session to localStorage; a fresh page load resumes
// it (questions, typed answers, wall-clock timer) unless it's gone stale.
const SESSION_KEY = 'mathquiz.session.v1';
function loadSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !Array.isArray(s.quiz) || !s.quiz.length) return null;
    if (Date.now() - (s.savedAt || 0) > 12 * 3600 * 1000) return null; // stale — start fresh
    return s;
  } catch { return null; }
}
function saveSession() {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      quiz: state.quiz, startedAt: state.startedAt, submitted: state.submitted,
      timeUp: state.timeUp, isPractice: state.isPractice, immediate: state.immediate,
      finalElapsed: state.finalElapsed, savedAt: Date.now(),
    }));
  } catch {}
}
const _resumed = loadSession();
const state = {
  quiz: _resumed ? _resumed.quiz : newQuiz(),
  startedAt: _resumed && _resumed.startedAt ? _resumed.startedAt : Date.now(),
  remaining: TIME_LIMIT_SEC, // ticker recomputes from startedAt (wall clock)
  submitted: _resumed ? !!_resumed.submitted : false,
  timeUp: _resumed ? !!_resumed.timeUp : false,
  showTimeoutModal: false,
  showStats: false,
  showMine: false,
  showLesson: null,
  isPractice: _resumed ? !!_resumed.isPractice : false,
  immediate: _resumed ? !!_resumed.immediate : false,
  finalElapsed: _resumed && _resumed.finalElapsed != null ? _resumed.finalElapsed : null,
};

let tickHandle = null;
function runTicker() {
  clearInterval(tickHandle);
  tickHandle = setInterval(() => {
    if (state.submitted) { clearInterval(tickHandle); tickHandle = null; return; }
    const elapsed = Math.floor((Date.now() - state.startedAt) / 1000);
    state.remaining = TIME_LIMIT_SEC - elapsed; // may go negative — overtime
    if (state.remaining <= 0 && !state.timeUp) {
      state.timeUp = true;
      state.showTimeoutModal = true;
      render();
    }
    renderTimer();
  }, 250);
}
function startTimer() {
  state.startedAt = Date.now();
  state.remaining = TIME_LIMIT_SEC;
  runTicker();
}
// Pause the 250ms interval while the tab is hidden (saves battery on iPad).
// startedAt is wall-clock, so elapsed is correct when we resume.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearInterval(tickHandle); tickHandle = null; }
  else if (!state.submitted && state.startedAt) { runTicker(); renderTimer(); }
});

function fmt(sec) {
  const sign = sec < 0 ? '+' : '';
  const t = Math.abs(sec);
  const m = Math.floor(t / 60), s = t % 60;
  return `${sign}${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function renderTimer() {
  const el = document.getElementById('timer');
  if (!el) return;
  el.textContent = '';
  const dot = document.createElement('span'); dot.className='dot';
  const txt = document.createElement('span'); txt.className='tabular';
  txt.textContent = fmt(state.remaining);
  el.appendChild(dot); el.appendChild(txt);
  el.classList.toggle('warn', !state.submitted && state.remaining <= WARN_AT && state.remaining > DANGER_AT);
  el.classList.toggle('danger', !state.submitted && state.remaining <= DANGER_AT && state.remaining > 0);
  el.classList.toggle('over', !state.submitted && state.remaining <= 0);
  el.classList.toggle('done', state.submitted);
}

// Signature for "same question" — used to keep rerolls honest.
function qSig(q) {
  if (q.type === 'mul' || q.type === 'div') return `${q.type}:${Math.min(q.a, q.b)}x${Math.max(q.a, q.b)}${q.big ? ':big' : ''}`;
  if (q.type === 'fnam') return `fnam:${q.den}:${q.shaded}`;
  if (q.type === 'feq') return `feq:${q.n1}/${q.d1}=${q.d2}`;
  if (q.type === 'fcmp') return `fcmp:${q.n1}/${q.d1}v${q.n2}/${q.d2}`;
  return `${q.type}:${q.a},${q.b}`;
}
function startNew() {
  // Anti-fishing: rerolling must not be an escape hatch. Unanswered adaptive
  // questions (mul/div/bigmul/fractions) from an abandoned quiz carry over
  // into the new one — reroll all you like, the hard ones come along.
  // Add/sub slots and answered questions regenerate freshly. Transparent,
  // not punitive: the confirm dialog says so.
  const carry = (!state.submitted && Array.isArray(state.quiz))
    ? state.quiz.filter(q => !answered(q) && q.type !== 'add' && q.type !== 'sub')
        .map(q => ({ ...q, given: '', givenNum: '', givenDen: '', _t0: undefined, _t1: undefined, _imm: undefined, _retype: undefined, _priorState: undefined }))
        .slice(0, 6) // a fresh quiz has 6 adaptive slots — never grow past 10 questions
    : [];
  let fresh = newQuiz();
  if (carry.length) {
    const carrySigs = new Set(carry.map(qSig));
    // Swap out fresh non-add/sub questions (that aren't already the same
    // item) one-for-one with the carried ones, then reshuffle.
    // Two passes so the result is order-independent: fresh duplicates of
    // carried items always drop AND count toward the room the carry needs;
    // then exactly the remaining room is vacated from other adaptive slots.
    const keptOther = [], freshAdaptive = [];
    let room = carry.length;
    for (const q of fresh) {
      if (q.type !== 'add' && q.type !== 'sub') {
        if (carrySigs.has(qSig(q))) { room--; continue; }
        freshAdaptive.push(q);
      } else keptOther.push(q);
    }
    fresh = shuffleQuiz(keptOther.concat(freshAdaptive.slice(Math.max(0, room)), carry));
  }
  state.quiz = fresh;
  state.immediate = false;
  state.isPractice = false;
  state.submitted = false;
  state.timeUp = false;
  state.showTimeoutModal = false;
  state.finalElapsed = null;
  startTimer();
  saveSession();
  render();
  setTimeout(() => {
    const first = document.querySelector('.ansbox');
    if (first) first.focus();
  }, 50);
}

function startFocus() {
  state.quiz = focusQuiz();
  state.immediate = true; // fluency practice → immediate corrective feedback
  state.isPractice = false;
  state.submitted = false;
  state.timeUp = false;
  state.showStats = false;
  state.showMine = false;
  state.showTimeoutModal = false;
  state.finalElapsed = null;
  startTimer();
  saveSession();
  render();
  setTimeout(() => {
    const first = document.querySelector('.ansbox');
    if (first) first.focus();
  }, 50);
}

function retryWrong() {

  saveSession();
  render();
  setTimeout(() => {
    const first = document.querySelector('.ansbox');
    if (first) first.focus();
  }, 50);
}

// Build a compact error-log entry from a wrongly-answered question. Per-type
// misconception flags are computed here, where the full question is in hand.
function errEntry(q) {
  const d = Date.now(), sc = q.scaffold ? 1 : 0;
  const num = v => Number(String(v == null ? '' : v).trim());
  if (q.type === 'mul' && q.big) {
    return { d, k: 'bigmul', g: String(q.given || ''), ans: String(q.ans), sc, ten: Math.abs(num(q.given) - q.ans) === 10 };
  }
  if (q.type === 'mul') {
    const key = Math.min(q.a, q.b) + 'x' + Math.max(q.a, q.b);
    return { d, k: 'mul:' + key, x: [q.a, q.b], g: String(q.given || ''), ans: String(q.ans), sc };
  }
  if (q.type === 'div') {
    const key = Math.min(q.fam[0], q.fam[1]) + 'x' + Math.max(q.fam[0], q.fam[1]);
    return { d, k: 'div:' + key, x: [q.a, q.b], g: String(q.given || ''), ans: String(q.ans), sc };
  }
  if (q.type === 'fnam') {
    return { d, k: 'fnam', g: `${q.givenNum || ''}/${q.givenDen || ''}`, ans: `${q.ansNum}/${q.ansDen}`, sc,
             flip: num(q.givenNum) === q.den && num(q.givenDen) === q.shaded };
  }
  if (q.type === 'fcmp') {
    return { d, k: 'fcmp', g: String(q.given || ''), ans: q.ans, sc,
             bigden: q.n1 === q.n2 && ((q.given === '>' && q.d1 > q.d2) || (q.given === '<' && q.d2 > q.d1)) };
  }
  if (q.type === 'feq') return { d, k: 'feq', g: String(q.given || ''), ans: String(q.ans), sc };
  return { d, k: q.bucket || q.type, g: String(q.given || ''), ans: String(q.ans), sc, ten: Math.abs(num(q.given) - q.ans) === 10 };
}

function submit(fromTimeout) {
  if (state.submitted) return;
  // Final DOM sweep for plain number boxes. Fraction inputs also carry the
  // .ansbox class but have NO dataset.id (their values live in givenNum/
  // givenDen, persisted on every keystroke) — indexing quiz[NaN] here threw
  // and made Check answers a dead button on any quiz with a fraction row.
  document.querySelectorAll('.ansbox').forEach(inp => {
    const id = Number(inp.dataset.id);
    // Skip immediate-mode questions: after overcorrection the box shows the
    // retyped CORRECT answer, but grading must use the original in .given.
    if (Number.isInteger(id) && state.quiz[id] && !state.quiz[id]._imm) state.quiz[id].given = inp.value.trim();
  });
  state.submitted = true;
  state.finalElapsed = TIME_LIMIT_SEC - state.remaining;
  clearInterval(tickHandle);
  // Persist per-fact / per-bucket stats
  let correctCount = 0;
  state.quiz.forEach(q => {
    const isRight = answerCorrect(q);
    if (isRight) correctCount++;
    // Capture mastery BEFORE recording (recording mutates it) so the
    // diagnosis can fade for a known fact slipped vs a fact still being learned.
    q._priorState = Stats.itemState(q);
    const ms = (q._t0 != null && q._t1 != null) ? (q._t1 - q._t0) : undefined;
    const sc = !!q.scaffold; // assisted answers earn reduced mastery credit
    if (q.type === 'mul' && q.big) Stats.recordSkill('bigmul', isRight, ms, sc);
    else if (q.type === 'mul' && q.a <= 12 && q.b <= 12) Stats.recordMul(q.a, q.b, isRight, ms, sc);
    else if (q.type === 'div' && q.fam) Stats.recordDiv(q.fam[0], q.fam[1], isRight, ms, sc);
    else if (q.type === 'fnam' || q.type === 'feq' || q.type === 'fcmp') {
      Stats.recordSkill('fractions', isRight, ms, sc);          // aggregate (drives unlock/summary)
      Stats.recordSkill('frac.' + q.type, isRight, ms, sc);     // sub-skill (drives adaptive selection)
    }
    else if (q.bucket) Stats.recordBucket(q.bucket, isRight);
    if (!isRight) { try { Stats.recordError(errEntry(q)); } catch {} }
  });
  if (!state.isPractice) Stats.recordQuiz(state.quiz.length, correctCount, state.finalElapsed);
  // Sound feedback (opt-in via topbar): perfect → triumphant; mostly right →
  // happy chime; otherwise gentle low tone — never punishing. Guarded: an
  // audio-API quirk must never be able to freeze grading.
  try {
    if (correctCount === state.quiz.length) Sound.perfect();
    else if (correctCount / state.quiz.length >= 0.7) Sound.right();
    else Sound.wrong();
  } catch {}
  // Newly cleared a prerequisite? Unlock the next domain and show its lesson.
  const unlocked = state.isPractice ? null : Stats.checkUnlocks();
  pushIfSynced();
  if (unlocked) { state.showLesson = unlocked; }
  saveSession();
  render();
  // scroll to first wrong (or top if all correct), keeping context visible
  setTimeout(() => {
    const firstBad = document.querySelector('.qcard.bad');
    if (firstBad) {
      const y = firstBad.getBoundingClientRect().top + window.scrollY - 80;
      window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
    } else {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }, 50);
}
