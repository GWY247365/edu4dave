// Unified answer checking (fractions/compare aren't single numbers).
function answerCorrect(q) {
  if (q.type === 'fnam') return Number(q.givenNum) === q.ansNum && Number(q.givenDen) === q.ansDen;
  if (q.type === 'fcmp') return q.given === q.ans;
  return Number(q.given) === q.ans;
}
function answerText(q) {
  if (q.type === 'fnam') return q.ansNum + '/' + q.ansDen;
  return String(q.ans);
}
function exprText(q) {
  if (q.type === 'mul') return `${q.a} × ${q.b}`;
  if (q.type === 'add') return `${q.a} + ${q.b}`;
  if (q.type === 'sub') return `${q.a} − ${q.b}`;
  if (q.type === 'div') return `${q.a} ÷ ${q.b}`;
  if (q.type === 'feq') return `${q.n1}/${q.d1} = ?/${q.d2}`;
  if (q.type === 'fcmp') return `${q.n1}/${q.d1} ? ${q.n2}/${q.d2}`;
  if (q.type === 'fnam') return 'this fraction';
  return '';
}
function answered(q) {
  if (q.type === 'fnam') return (q.givenNum || '') !== '' || (q.givenDen || '') !== '';
  return (q.given || '') !== '';
}

function renderProgress() {
  const wrap = el('div', 'progress');
  state.quiz.forEach(q => {
    const seg = el('div', 'seg');
    if (state.submitted) {
      seg.classList.add(answerCorrect(q) ? 'ok' : 'bad');
    } else if (answered(q)) {
      seg.classList.add('filled');
    }
    wrap.appendChild(seg);
  });
  return wrap;
}

function renderQuestion(q, idx) {
  const card = el('div', 'qcard');
  const right = state.submitted && answerCorrect(q);
  const wrong = state.submitted && !answerCorrect(q);
  if (right) card.classList.add('ok');
  if (wrong) card.classList.add('bad');

  const head = el('div', 'qhead');
  head.appendChild(el('div', 'qnum', String(idx + 1)));
  head.appendChild(el('div', 'qtag', q.label));
  if (q.isReview && !state.submitted) {
    const rb = el('div', 'review-badge', '↻ Practice');
    rb.title = "You missed this one before — let's nail it this time.";
    head.appendChild(rb);
  }
  if (state.submitted) {
    const st = el('div', 'qstatus ' + (right ? 'ok' : 'bad'),
      right ? '✓ Correct' : '✗ Incorrect');
    head.appendChild(st);
  }
  card.appendChild(head);

  if (q.type === 'fnam' || q.type === 'feq' || q.type === 'fcmp') {
    card.appendChild(renderFractionRow(q, idx, right, wrong));
    if (!state.submitted && q.isReview) {
      const tip = el('div', 'pretip');
      tip.appendChild(spanTxt('💡 ', null));
      tip.appendChild(spanTxt(fracTip(q), null));
      card.appendChild(tip);
    }
    if (wrong) card.appendChild(renderDiag(q));
    return card;
  }

  const row = el('div', 'qrow');
  const expr = el('div', 'expr');
  if (q.scaffold && q.type === 'mul' && q.big) {
    // Completion problem: show the partial products, child fills the final sum.
    const tens = Math.floor(q.a / 10) * 10, ones = q.a % 10;
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(`${q.a} × ${q.b} = ${tens}×${q.b} + ${ones}×${q.b} = ${tens * q.b} + ${ones * q.b} =`, 'scaffold-line'));
  } else if (q.scaffold && q.type === 'mul') {
    // Novice scaffolds for table facts: repeated addition or split-known.
    expr.classList.add('expr-scaffold');
    const s = q.scaffold;
    if (s.kind === 'addition') {
      const parts = Array(s.hi).fill(s.lo).join(' + ');
      expr.appendChild(spanTxt(`${q.a} × ${q.b} = ${parts} =`, 'scaffold-line'));
    } else { // split-known
      const half = Math.floor(s.hi / 2);
      const rest = s.hi - half;
      const partA = s.lo * half, partB = s.lo * rest;
      expr.appendChild(spanTxt(`${q.a} × ${q.b} = (${s.lo}×${half}) + (${s.lo}×${rest}) = ${partA} + ${partB} =`, 'scaffold-line'));
    }
  } else if (q.scaffold && q.type === 'div' && q.scaffold.kind === 'inverse') {
    // Reframe division as inverse multiplication ("7 × ? = 56"), the form
    // the child has already mastered.
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(`${q.a} ÷ ${q.b} → ${q.b} × ▢ = ${q.a}, so the answer is`, 'scaffold-line'));
  } else if (q.scaffold && q.type === 'add' && q.scaffold.kind === 'expand-add') {
    // Expanded form: show each place separately, child adds three small sums.
    const ah = Math.floor(q.a/100), at = Math.floor(q.a/10)%10, ao = q.a%10;
    const bh = Math.floor(q.b/100), bt = Math.floor(q.b/10)%10, bo = q.b%10;
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(`(${ah*100}+${at*10}+${ao}) + (${bh*100}+${bt*10}+${bo}) =`, 'scaffold-line'));
  } else if (q.scaffold && q.type === 'sub' && q.scaffold.kind === 'expand-sub') {
    const ah = Math.floor(q.a/100), at = Math.floor(q.a/10)%10, ao = q.a%10;
    const bh = Math.floor(q.b/100), bt = Math.floor(q.b/10)%10, bo = q.b%10;
    expr.classList.add('expr-scaffold');
    expr.appendChild(spanTxt(`(${ah*100}+${at*10}+${ao}) − (${bh*100}+${bt*10}+${bo}) =`, 'scaffold-line'));
  } else {
    expr.appendChild(spanTxt(q.a, 'tabular'));
    expr.appendChild(spanTxt(q.type === 'mul' ? '×' : q.type === 'add' ? '+' : q.type === 'sub' ? '−' : '÷', 'op'));
    expr.appendChild(spanTxt(q.b, 'tabular'));
    expr.appendChild(spanTxt('=', 'eq'));
  }
  row.appendChild(expr);

  const inp = document.createElement('input');
  inp.className = 'ansbox';
  inp.type = 'number';
  inp.inputMode = 'numeric';
  inp.pattern = '[0-9]*';
  inp.autocomplete = 'off';
  inp.dataset.id = String(idx);
  inp.value = q.given;
  inp.placeholder = '?';
  inp.setAttribute('aria-label', `Question ${idx + 1}: ${q.a} ${q.type === 'mul' ? 'times' : q.type === 'add' ? 'plus' : q.type === 'sub' ? 'minus' : 'divided by'} ${q.b}`);
  if (state.submitted) {
    inp.readOnly = true;
    if (right) inp.classList.add('ok');
    else inp.classList.add('bad');
  } else if (state.immediate && q._imm) {
    if (q._imm === 'right') { card.classList.add('imm-good'); inp.readOnly = true; }
    else if (q._imm === 'fixed') { card.classList.add('imm-fixed'); inp.readOnly = true; inp.value = answerText(q); }
    else if (q._imm === 'fixing') { card.classList.add('imm-fixing'); inp.value = q._retype || ''; }
  }
  inp.addEventListener('focus', () => {
    card.classList.add('focused');
    if (state.quiz[idx]._t0 == null) state.quiz[idx]._t0 = Date.now();
  });
  inp.addEventListener('blur', () => card.classList.remove('focused'));
  inp.addEventListener('input', e => {
    const qq = state.quiz[idx];
    if (state.immediate && qq._imm === 'fixing') {
      // Overcorrection retype: the original wrong answer stays in .given for
      // honest grading/error-log; the retype goes to a scratch field.
      qq._retype = e.target.value;
      if (String(qq._retype).trim() === String(answerText(qq))) immFixed(qq, inp, card);
      return;
    }
    qq.given = e.target.value;
    qq._t1 = Date.now();
    if (qq._t0 == null) qq._t0 = qq._t1;
    saveSession();
    const segs = document.querySelectorAll('.progress .seg');
    if (segs[idx]) segs[idx].classList.toggle('filled', e.target.value !== '');
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (state.immediate && !state.submitted && !state.quiz[idx]._imm &&
          String(state.quiz[idx].given || '').trim() !== '') {
        immCheck(state.quiz[idx], idx, inp, card);
        return;
      }
      const all = [...document.querySelectorAll('.ansbox')];
      const i = all.indexOf(inp);
      if (i + 1 < all.length) all[i+1].focus();
      else inp.blur();
    }
  });
  row.appendChild(inp);

  if (wrong) {
    const pill = el('div', 'correct-pill');
    pill.appendChild(spanTxt('Answer', 'ar'));
    pill.appendChild(spanTxt(answerText(q), 'tabular'));
    row.appendChild(pill);
  }
  card.appendChild(row);
  if (!state.submitted && state.immediate && q._imm === 'fixing') {
    const pill = el('div', 'fixpill');
    pill.appendChild(spanTxt('The answer is ', null));
    pill.appendChild(spanTxt(answerText(q), 'tabular fix-ans'));
    pill.appendChild(spanTxt(' — type it to lock it in 💪', null));
    card.appendChild(pill);
  }

  // Pre-practice strategy card: review questions (learn, then try) and
  // correct-but-slow facts (the child is counting — teach the shortcut).
  if (!state.submitted && (q.isReview || q.isSlow)) {
    let tipText = '';
    if (q.type === 'mul' && q.big) tipText = `Break ${Math.floor(q.a / 10) * 10} + ${q.a % 10}: multiply each by ${q.b}, then add.`;
    else if (q.type === 'mul' && q.a <= 12 && q.b <= 12) tipText = factTip(q.a, q.b);
    else if (q.type === 'div') tipText = `Think: ${q.b} × ? = ${q.a}. Use the ${q.b} times table.`;
    if (tipText) {
      const tip = el('div', 'pretip');
      tip.appendChild(spanTxt(q.isSlow ? '⚡ ' : '💡 ', null));
      if (q.isSlow) tip.appendChild(spanTxt('You know this one — here is a faster way: ', null));
      tip.appendChild(spanTxt(tipText, null));
      card.appendChild(tip);
    }
  }

  if (wrong) card.appendChild(renderDiag(q));
  return card;
}

// Short, kid-friendly multiplication strategy (without giving the answer away).
function factTip(a, b) {
  if (a === 9 || b === 9) { const x = a === 9 ? b : a; return `×9 trick: think ${x}×10, then take away ${x}.`; }
  if (a === 11 && b <= 9) return `×11 trick: ${b}×10, then add ${b}.`;
  if (b === 11 && a <= 9) return `×11 trick: ${a}×10, then add ${a}.`;
  if (a === 12 || b === 12) { const x = a === 12 ? b : a; return `×12: add ${x}×10 and ${x}×2.`; }
  if (a === 5 || b === 5) { const x = a === 5 ? b : a; return `×5 trick: take half of ${x}×10.`; }
  if (a % 2 === 0) return `Double it: work out ${a / 2}×${b}, then double the answer.`;
  if (b % 2 === 0) return `Double it: work out ${a}×${b / 2}, then double the answer.`;
  const lo = Math.min(a, b), hi = Math.max(a, b);
  return `Skip-count by ${lo}, ${hi} times.`;
}

function fracMini(num, den, cls) {
  const f = el('span', 'frac ' + (cls || ''));
  f.appendChild(el('span', 'frac-num', String(num)));
  f.appendChild(el('span', 'frac-line'));
  f.appendChild(el('span', 'frac-den', String(den)));
  return f;
}
function barEl(den, shaded) {
  const bar = el('div', 'frac-vis');
  for (let i = 0; i < den; i++) bar.appendChild(el('div', 'frac-cell' + (i < shaded ? ' on' : '')));
  return bar;
}
function fracInput(q, idx, field, ph) {
  const inp = document.createElement('input');
  inp.className = 'ansbox frac-in';
  inp.type = 'number'; inp.inputMode = 'numeric'; inp.autocomplete = 'off';
  inp.placeholder = ph || '?';
  inp.value = q[field] != null ? q[field] : '';
  if (state.submitted) inp.readOnly = true;
  inp.addEventListener('focus', () => { if (state.quiz[idx]._t0 == null) state.quiz[idx]._t0 = Date.now(); });
  inp.addEventListener('input', e => {
    state.quiz[idx][field] = e.target.value;
    const t = Date.now(); state.quiz[idx]._t1 = t; if (state.quiz[idx]._t0 == null) state.quiz[idx]._t0 = t;
    saveSession();
    const segs = document.querySelectorAll('.progress .seg');
    if (segs[idx]) segs[idx].classList.toggle('filled', answered(state.quiz[idx]));
  });
  return inp;
}
function renderFractionRow(q, idx, right, wrong) {
  const row = el('div', 'qrow frac-row');
  if (q.type === 'fnam') {
    const left = el('div', 'frac-q');
    left.appendChild(el('div', 'frac-prompt', 'What fraction is shaded?'));
    left.appendChild(barEl(q.den, q.shaded));
    row.appendChild(left);
    const fin = el('div', 'frac-answer');
    const numI = fracInput(q, idx, 'givenNum', '▢');
    const denI = fracInput(q, idx, 'givenDen', '▢');
    if (state.submitted) { numI.classList.add(right ? 'ok' : 'bad'); denI.classList.add(right ? 'ok' : 'bad'); }
    fin.appendChild(numI); fin.appendChild(el('div', 'frac-line wide')); fin.appendChild(denI);
    row.appendChild(fin);
    if (wrong) { const pill = el('div', 'correct-pill'); pill.appendChild(spanTxt('Answer', 'ar')); pill.appendChild(spanTxt(q.ansNum + '/' + q.ansDen, 'tabular')); row.appendChild(pill); }
  } else if (q.type === 'feq') {
    const expr = el('div', 'expr frac-expr');
    expr.appendChild(fracMini(q.n1, q.d1));
    expr.appendChild(spanTxt('=', 'eq'));
    const target = el('span', 'frac');
    const numI = fracInput(q, idx, 'given', '▢'); numI.classList.add('frac-num-in');
    if (state.submitted) numI.classList.add(right ? 'ok' : 'bad');
    target.appendChild(numI); target.appendChild(el('span', 'frac-line')); target.appendChild(el('span', 'frac-den', String(q.d2)));
    expr.appendChild(target);
    row.appendChild(expr);
    if (wrong) { const pill = el('div', 'correct-pill'); pill.appendChild(spanTxt('Answer', 'ar')); pill.appendChild(spanTxt(String(q.ans), 'tabular')); row.appendChild(pill); }
  } else { // fcmp
    const expr = el('div', 'expr frac-expr');
    expr.appendChild(fracMini(q.n1, q.d1));
    const choices = el('div', 'fcmp');
    ['<', '=', '>'].forEach(sym => {
      const b = el('button', 'fcmp-btn', sym);
      if (state.submitted || (state.immediate && q._imm)) {
        b.disabled = true;
        if (sym === q.ans) b.classList.add('correct');
        if (q.given === sym && sym !== q.ans) b.classList.add('wrongpick');
      } else {
        if (q.given === sym) b.classList.add('chosen');
        b.onclick = () => {
          state.quiz[idx].given = sym;
          const t = Date.now(); if (state.quiz[idx]._t0 == null) state.quiz[idx]._t0 = t; state.quiz[idx]._t1 = t;
          if (state.immediate) {
            // Buttons can't be retyped — immediate feedback is shown by
            // locking the group with the correct choice highlighted.
            state.quiz[idx]._imm = sym === q.ans ? 'right' : 'fixed';
            try { (sym === q.ans ? Sound.tick : Sound.soft)(); } catch {}
            saveSession();
            render();
            return;
          }
          saveSession();
          choices.querySelectorAll('.fcmp-btn').forEach(x => x.classList.remove('chosen'));
          b.classList.add('chosen');
          const segs = document.querySelectorAll('.progress .seg');
          if (segs[idx]) segs[idx].classList.add('filled');
        };
      }
      choices.appendChild(b);
    });
    expr.appendChild(choices);
    expr.appendChild(fracMini(q.n2, q.d2));
    row.appendChild(expr);
  }
  return row;
}

function teachPayload(q) {
  if (q.type === 'fnam') return { type: 'fnam', shaded: q.shaded, den: q.den };
  if (q.type === 'feq') return { type: 'feq', n1: q.n1, d1: q.d1, d2: q.d2, ans: q.ans };
  if (q.type === 'fcmp') return { type: 'fcmp', n1: q.n1, d1: q.d1, n2: q.n2, d2: q.d2, ans: q.ans };
  return { type: q.type, a: q.a, b: q.b };
}

function renderDiag(q) {
  const d = diagnose(q, q.given);
  const wrap = el('div', 'diag');
  const head = el('div', 'diag-head');
  const ico = el('div', 'ico', '!');
  head.appendChild(ico);
  head.appendChild(el('span', null, 'What went wrong · How to do it'));
  wrap.appendChild(head);

  const why = el('p', 'why', d.why);
  wrap.appendChild(why);

  const tip = el('div', 'tip');
  tip.appendChild(spanTxt('💡 ', null));
  tip.appendChild(spanTxt(d.tip, null));
  wrap.appendChild(tip);

  // Progressive disclosure (cognitive load theory): the short why+tip is
  // always shown; the longer worked solution is one tap away. A child who
  // already knows this (slipped) gets a one-line reminder instead of steps.
  const known = q._priorState === 'accurate' || q._priorState === 'fluent';
  if (known) {
    const reminder = el('div', 'work');
    reminder.innerHTML = `Quick check — you know this one: <b>${exprText(q)} = ${answerText(q)}</b>.`;
    wrap.appendChild(reminder);
  } else {
    const toggle = el('button', 'btn btn-ghost work-toggle', '📐 Show the steps');
    const work = el('div', 'work');
    work.style.display = 'none';
    work.innerHTML = d.work;
    let open = false;
    toggle.onclick = () => {
      open = !open;
      work.style.display = open ? '' : 'none';
      toggle.textContent = open ? '📐 Hide the steps' : '📐 Show the steps';
    };
    wrap.appendChild(toggle);
    wrap.appendChild(work);
  }

  // AI mini-lesson (kid-facing) — on demand, for all question types
  const teachWrap = el('div', 'teach-wrap');
  const teachBtn = el('button', 'btn btn-ghost teach-btn', '🧠 Teach me this');
  const teachOut = el('div', 'teach-out');
  teachBtn.onclick = async () => {
    teachBtn.disabled = true;
    teachOut.className = 'teach-out';
    teachOut.textContent = 'Thinking…';
    try {
      const res = await fetch('/api/teach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ problem: teachPayload(q) }),
      });
      if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || ('error ' + res.status)); }
      const data = await res.json();
      teachOut.textContent = data.lesson || '';
      teachBtn.style.display = 'none';
    } catch (e) {
      teachOut.className = 'teach-out err';
      teachOut.textContent = "Couldn't load a lesson (needs the deployed backend + API key).";
    } finally {
      teachBtn.disabled = false;
    }
  };
  teachWrap.appendChild(teachBtn);
  teachWrap.appendChild(teachOut);
  wrap.appendChild(teachWrap);
  return wrap;
}

function renderSummary() {
  const total = state.quiz.length;
  const correct = state.quiz.filter(q => answerCorrect(q)).length;
  const wrong = total - correct;
  const ratio = total ? correct / total : 0;
  const wrap = el('div', 'summary');

  const score = el('div');
  score.appendChild(el('div', 'label', state.isPractice ? 'Practice' : 'Your score'));
  const big = el('div', 'score');
  const num = el('span', null, String(correct));
  num.style.color = ratio >= 0.8 ? 'var(--ok-deep)' : ratio >= 0.5 ? 'var(--brand-deep)' : 'var(--bad-deep)';
  big.appendChild(num);
  big.appendChild(spanTxt(' / ' + total, 'total'));
  score.appendChild(big);
  wrap.appendChild(score);

  const msg = el('div', 'msg');
  const elapsed = state.finalElapsed || 0;
  const overtime = elapsed > TIME_LIMIT_SEC;
  const timeStr = fmtElapsed(elapsed);
  const timeNote = overtime ? ` (${fmt(elapsed - TIME_LIMIT_SEC)} over)` : '';
  // Process-praise framing (Dweck): credit effort & strategy, never ability
  // ("smart") and never call work "easy". Tie success to practice.
  let title, sub;
  if (correct === total) { title = 'Perfect score! 🎉'; sub = `All that practice is paying off — every answer correct.`; }
  else if (ratio >= 0.8) { title = 'Your practice is showing!'; sub = `You worked through ${correct} of these. Let's look at the few left.`; }
  else if (ratio >= 0.5) { title = 'Good effort — keep at it!'; sub = `Every one you check below makes the next quiz easier.`; }
  else { title = "Mistakes help your brain grow."; sub = `Let's walk through each one — that's how these facts stick.`; }
  msg.appendChild(el('h2', null, title));
  msg.appendChild(el('p', null, sub));
  wrap.appendChild(msg);

  // Effort attribution: call out "comeback" facts — review items (previously
  // missed/weak) the child got right this time. Concrete process praise.
  const comebacks = state.quiz
    .filter(q => q.isReview && answerCorrect(q))
    .map(q => q.type === 'div' ? `${q.a}÷${q.b}` : (q.type === 'mul' ? `${q.a}×${q.b}` : null))
    .filter(Boolean);
  if (comebacks.length) {
    const names = comebacks.slice(0, 3).join(', ');
    const more = comebacks.length > 3 ? ' and more' : '';
    msg.appendChild(el('p', 'praise', `💪 You nailed ${names}${more} — facts you used to miss. That's your practice working, not luck!`));
  }

  const breakdown = el('div', 'breakdown');
  breakdown.appendChild(chip('ok', `✓ ${correct} correct`));
  breakdown.appendChild(chip('bad', `✗ ${wrong} missed`));
  breakdown.appendChild(chip(overtime ? 'time over' : 'time', `⏱ ${timeStr}`));
  wrap.appendChild(breakdown);
  return wrap;
}

function fmtElapsed(sec) {
  // Always positive elapsed time, no leading +
  const t = Math.max(0, sec);
  const m = Math.floor(t / 60), s = t % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function chip(kind, text) {
  const c = el('span', 'chip ' + kind);
  c.appendChild(spanTxt(text, null));
  return c;
}

function closeMine() { state.showMine = false; render(); }
function masteryStage(pct) {
  if (pct >= 90) return { emoji: '⭐', label: 'Star' };
  if (pct >= 70) return { emoji: '🌳', label: 'Strong' };
  if (pct >= 40) return { emoji: '🌿', label: 'Growing' };
  return { emoji: '🌱', label: 'Seedling' };
}
// Kid-facing open learner model: shows growth and lets the child choose what
// to practice (autonomy + competence). Encouraging, growth-mindset framing.
function renderMineModal() {
  const s = Stats.summary();

  bg.addEventListener('click', e => { if (e.target === bg) closeMine(); });
  const m = el('div', 'modal mine-modal');

  if (sk.current > 0 && sk.atRisk) m.appendChild(el('p', 'mine-streak atrisk', `⚠️ Your ${sk.current}-day streak is on the line — play any quiz today to keep it alive!`));
  else if (sk.current > 0) m.appendChild(el('p', 'mine-streak', `🔥 ${sk.current}-day streak — you keep showing up. That's how brains grow!`));
  else m.appendChild(el('p', 'mine-streak', `Every quiz makes your math brain stronger. Pick something to grow! 🌱`));

  // Growth since last week — change motivates more than state.

    m.appendChild(el('p', 'stats-empty', 'No data yet — finish a quiz to start tracking your progress.'));
  } else {
    const tiles = el('div', 'stats-tiles');
    const streakTile = statTile('Streak', s.streak.current ? `🔥 ${s.streak.current}` : '—');
    if (s.streak.best > s.streak.current) {
      streakTile.querySelector('.stat-label').textContent = `Streak · best ${s.streak.best}`;
    }
    tiles.appendChild(streakTile);
    tiles.appendChild(statTile('Quizzes', s.quizzesDone));
    tiles.appendChild(statTile('Last score', s.lastScore));
    tiles.appendChild(statTile('Mul mastery', s.mastery + '%'));
    m.appendChild(tiles);

    const factsLine = el('p', 'stats-line',
      `Multiplication: ${s.totalAttempts} attempts · ${s.totalAccuracy}% accurate · ${s.mastered}/66 facts mastered`);
    m.appendChild(factsLine);
    m.appendChild(masteryMeter(s.mastery));

    if (s.weak.length) {
      m.appendChild(el('h3', 'stats-h3', 'Practice these next'));
      const list = el('div', 'weak-list');
      s.weak.forEach(w => {
        const total = w.right + w.wrong;
        const pct = total ? Math.round(100 * w.right / total) : 0;
        const row = el('div', 'weak-row');
        row.appendChild(el('div', 'weak-fact', `${w.a} × ${w.b}`));
        const bar = el('div', 'weak-bar');
        const fill = el('div', 'weak-bar-fill');
        fill.style.width = pct + '%';
        bar.appendChild(fill);
        row.appendChild(bar);
        row.appendChild(el('div', 'weak-num', `${w.right}/${total}`));
        list.appendChild(row);
      });
      m.appendChild(list);
      const focusBtn = el('button', 'btn btn-primary focus-btn', '🎯 Practice these now');
      focusBtn.onclick = startFocus;
      m.appendChild(focusBtn);
    } else if (s.totalAttempts > 0) {
      m.appendChild(el('p', 'stats-line', '🌟 No weak facts right now — keep practicing!'));
    }

    const bucketTotal = ['add', 'sub'].reduce((sum, p) => sum + s.buckets[p].reduce((q, b) => q + b.total, 0), 0);
    if (bucketTotal > 0) {
      m.appendChild(el('h3', 'stats-h3', 'Add / Sub by difficulty'));
      const bgrid = el('div', 'bucket-grid');
      const labels = { 0: 'No carry/borrow', 1: '1 carry/borrow', 2: '2 carries/borrows' };
      ['add', 'sub'].forEach(p => {
        const opLabel = p === 'add' ? '+ Addition' : '− Subtraction';
        bgrid.appendChild(el('div', 'bucket-op', opLabel));
        s.buckets[p].forEach(b => {
          const row = el('div', 'bucket-row');
          const lbl = p === 'add' ? labels[b.k].replace('/borrow', '') : labels[b.k].replace('carry/', '');
          row.appendChild(el('div', 'bucket-lbl', lbl));
          const bar = el('div', 'bucket-bar');
          if (b.total > 0) {
            const fill = el('div', 'bucket-bar-fill');
            fill.style.width = (b.accuracy || 0) + '%';
            if (b.accuracy >= 80) fill.classList.add('good');
            else if (b.accuracy < 50) fill.classList.add('low');
            bar.appendChild(fill);
          }
          row.appendChild(bar);
          const numTxt = b.total ? `${b.right}/${b.total}` : '—';
          row.appendChild(el('div', 'bucket-num', numTxt));
          bgrid.appendChild(row);
        });
      });
      m.appendChild(bgrid);
    }

    // Defensive: if rendering still says Locked but a threshold has already
    // been crossed (e.g. legacy data, upgraded mastery rules), unlock now.
    if (Stats.checkUnlocks()) { setTimeout(() => render(), 0); }

    // Division domain
    m.appendChild(el('h3', 'stats-h3', '➗ Division'));
    if (!s.division.unlocked) {
      const fluent = Stats.mulFluentCount();
      m.appendChild(el('p', 'stats-line', `Locked — unlocks when 24 multiplication facts are mastered (now ${fluent}/24). Keep practicing your times tables!`));
    } else {
      m.appendChild(el('p', 'stats-line', `${s.division.attempts} attempts · ${s.division.accuracy}% accurate · ${s.division.mastery}% mastery`));
      m.appendChild(masteryMeter(s.division.mastery));
      const row = el('div', 'div-actions');
      const learn = el('button', 'btn btn-ghost', '📖 Lesson');
      learn.onclick = () => { state.showLesson = 'division'; render(); };
      const prac = el('button', 'btn btn-primary', '✏️ Practice division');
      prac.onclick = startDivisionPractice;
      row.appendChild(learn);
      row.appendChild(prac);
      m.appendChild(row);
    }

    // Bigger multiplication domain
    m.appendChild(el('h3', 'stats-h3', '🔢 Bigger × (2-digit)'));
    if (!s.bigmul.unlocked) {
      const fluent = Stats.mulFluentCount();
      m.appendChild(el('p', 'stats-line', `Locked — unlocks at 40 mastered multiplication facts (now ${fluent}/40).`));
    } else {
      const stTxt = s.bigmul.state === 'fluent' ? 'fluent 🌟' : s.bigmul.state === 'accurate' ? 'accurate' : 'learning';
      m.appendChild(el('p', 'stats-line', `${s.bigmul.attempts} attempts · ${s.bigmul.accuracy}% accurate · ${s.bigmul.mastery}% mastery · ${stTxt}`));
      m.appendChild(masteryMeter(s.bigmul.mastery));
      const row2 = el('div', 'div-actions');
      const learn2 = el('button', 'btn btn-ghost', '📖 Lesson');
      learn2.onclick = () => { state.showLesson = 'bigmul'; render(); };
      const prac2 = el('button', 'btn btn-primary', '✏️ Practice bigger ×');
      prac2.onclick = startBigmulPractice;
      row2.appendChild(learn2);
      row2.appendChild(prac2);
      m.appendChild(row2);
    }

    // Fractions domain
    m.appendChild(el('h3', 'stats-h3', '🍕 Fractions'));
    if (!s.fractions.unlocked) {
      const fluent = Stats.mulFluentCount();
      m.appendChild(el('p', 'stats-line', `Locked — unlocks at 50 mastered multiplication facts (now ${fluent}/50).`));
    } else {
      const stTxt = s.fractions.state === 'fluent' ? 'fluent 🌟' : s.fractions.state === 'accurate' ? 'accurate' : 'learning';
      m.appendChild(el('p', 'stats-line', `${s.fractions.attempts} attempts · ${s.fractions.accuracy}% accurate · ${s.fractions.mastery}% mastery · ${stTxt}`));
      m.appendChild(masteryMeter(s.fractions.mastery));
      const row3 = el('div', 'div-actions');
      const learn3 = el('button', 'btn btn-ghost', '📖 Lesson');
      learn3.onclick = () => { state.showLesson = 'fractions'; render(); };
      const prac3 = el('button', 'btn btn-primary', '✏️ Practice fractions');
      prac3.onclick = startFractionPractice;
      row3.appendChild(learn3);
      row3.appendChild(prac3);
      m.appendChild(row3);
    }

    if (s.hist.length >= 2) {
      m.appendChild(el('h3', 'stats-h3', 'Recent quizzes'));
      const chart = el('div', 'mini-chart');
      s.hist.forEach(h => {
        const denom = h.n || 10;
        const col = el('div', 'chart-col');
        const bar = el('div', 'chart-bar');
        bar.style.height = (100 * h.c / denom) + '%';
        bar.title = `${h.c}/${h.n} · ${fmt(h.t)}`;
        const r = h.c / denom;
        if (r === 1) bar.classList.add('perfect');
        else if (r >= 0.8) bar.classList.add('good');
        else if (r < 0.5) bar.classList.add('low');
        col.appendChild(bar);
        col.appendChild(el('div', 'chart-num', String(h.c)));
        chart.appendChild(col);
      });
      m.appendChild(chart);
    }
  }

  if (s.quizzesDone > 0) {
    // Systematic error patterns — the "practice the right thing" signal.
    const pats = Stats.errorPatterns();
    if (pats.length) {
      const sect = el('div', 'errpat-section');
      sect.appendChild(el('h3', 'stats-h3', '🔁 Error patterns'));
      pats.forEach(p => {
        const row = el('div', 'errpat-row' + (p.kind !== 'repeat' ? ' errpat-hot' : ''));
        row.textContent = (p.kind === 'misconception' ? '💡 ' : p.kind === 'confusion' ? '🔀 ' : p.kind === 'carry' ? '🔟 ' : '· ') + p.label;
        sect.appendChild(row);
      });
      m.appendChild(sect);
    }

    // Weekly snapshot trend — passive, no API call.
    const snaps = Stats.getSnaps();
    if (snaps.length >= 2) {
      const sect = el('div', 'snap-section');
      sect.appendChild(el('h3', 'stats-h3', '📈 Weekly snapshots'));
      const last = snaps[snaps.length - 1];
      const prior = snaps.length >= 2 ? snaps[snaps.length - 2] : null;
      const delta = (a, b) => { if (b == null) return ''; const d = a - b; if (!d) return ' (—)'; return d > 0 ? ` (+${d})` : ` (${d})`; };
      const row = el('p', 'stats-line');
      row.innerHTML = `Mul mastery: <b>${last.mulMastery}%</b>${delta(last.mulMastery, prior && prior.mulMastery)} · ` +
                      `Mul accuracy: <b>${last.mulAccuracy}%</b>${delta(last.mulAccuracy, prior && prior.mulAccuracy)} · ` +
                      `Quizzes: <b>${last.quizzes}</b>${delta(last.quizzes, prior && prior.quizzes)}`;
      sect.appendChild(row);
      // tiny sparkline of mulMastery over recent snaps
      const spark = el('div', 'mini-chart');
      const vals = snaps.slice(-10).map(x => x.mulMastery || 0);
      vals.forEach(v => {
        const col = el('div', 'chart-col');
        const bar = el('div', 'chart-bar');
        bar.style.height = (v) + '%';
        bar.title = v + '%';
        if (v >= 80) bar.classList.add('good');
        else if (v < 40) bar.classList.add('low');
        col.appendChild(bar);
        col.appendChild(el('div', 'chart-num', String(v)));
        spark.appendChild(col);
      });
      sect.appendChild(spark);
      m.appendChild(sect);
    }

    const planSection = el('div', 'plan-section');
    planSection.appendChild(el('h3', 'stats-h3', '✨ AI Learning Plan'));
    const planContainer = el('div', 'plan-container');
    // Past plans (persisted) — collapsed expander.
    const plans = Stats.getPlans();
    if (plans.length) {
      const past = el('details', 'plan-history');
      const sum = document.createElement('summary');
      sum.textContent = `📚 Past plans (${plans.length})`;
      past.appendChild(sum);
      plans.slice().reverse().forEach(p => {
        const item = el('div', 'plan-history-item');
        const head = el('div', 'plan-history-head');
        head.textContent = `${p.week} · ${new Date(p.ts).toLocaleDateString()}`;
        const body = el('div', 'plan-body');
        body.innerHTML = renderMarkdown(p.text || '');
        item.appendChild(head); item.appendChild(body);
        past.appendChild(item);
      });
      planSection.appendChild(past);
    }
    const genBtn = el('button', 'btn btn-primary plan-btn', 'Generate weekly report & plan');
    genBtn.onclick = () => generatePlan(planContainer, genBtn);
    planSection.appendChild(genBtn);
    planSection.appendChild(planContainer);
    m.appendChild(planSection);
  }

  m.appendChild(renderPinRow());

  const actions = el('div', 'stats-actions');
  const printBtn = el('button', 'btn btn-ghost', '🖨️ Print progress');
  printBtn.onclick = openPrintView;
  const reset = el('button', 'btn btn-ghost', 'Reset progress (parent only)');
  reset.onclick = () => {
    if (!parentGate()) return;
    if (confirm('Clear all progress on this device? This cannot be undone.')) {
      Stats.reset();
      pushIfSynced();
      render();
    }
  };
  const ok = el('button', 'btn btn-primary', 'Close');
  ok.onclick = closeStats;
  actions.appendChild(printBtn);
  actions.appendChild(reset);
  actions.appendChild(ok);
  m.appendChild(el('div', 'app-version', `Math Quiz ${APP_VERSION} · updated ${APP_UPDATED}`));
  m.appendChild(actions);

  bg.appendChild(m);
  return bg;
}

async function generatePlan(container, btn) {
  btn.disabled = true;
  container.innerHTML = '';
  const loading = el('div', 'plan-loading', 'Generating the learning plan…');
  container.appendChild(loading);
  try {
    const s = Stats.summary();
    const payload = {
      quizzesDone: s.quizzesDone,
      multiplicationAccuracyPct: s.totalAccuracy,
      factsMastered: s.mastered,
      streak: { current: s.streak.current, best: s.streak.best },
      weakestMultiplicationFacts: s.weak.map(w => ({
        fact: `${w.a}×${w.b}`, correct: w.right, wrong: w.wrong,
      })),
      additionByCarries: s.buckets.add.map(b => ({
        carries: b.k, accuracyPct: b.accuracy, attempts: b.total,
      })),
      subtractionByBorrows: s.buckets.sub.map(b => ({
        borrows: b.k, accuracyPct: b.accuracy, attempts: b.total,
      })),
      recentQuizzes: s.hist.map(h => ({ correct: h.c, outOf: h.n, seconds: h.t })),
      division: s.division.unlocked
        ? { attempts: s.division.attempts, accuracyPct: s.division.accuracy, masteryPct: s.division.mastery }
        : 'locked',
      twoDigitMultiplication: s.bigmul.unlocked
        ? { attempts: s.bigmul.attempts, accuracyPct: s.bigmul.accuracy, masteryPct: s.bigmul.mastery }
        : 'locked',
      fractions: s.fractions.unlocked
        ? { attempts: s.fractions.attempts, accuracyPct: s.fractions.accuracy, masteryPct: s.fractions.mastery,
            subSkills: { naming: Stats.skillState('frac.fnam'), equivalence: Stats.skillState('frac.feq'), comparison: Stats.skillState('frac.fcmp') } }
        : 'locked',
      // Systematic error patterns from the raw wrong-answer log — the most
      // actionable input for a targeted plan.
      errorPatterns: Stats.errorPatterns().map(p => p.label),
    };
    const res = await fetch('/api/plan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stats: payload }),
    });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(errBody.error || `server returned ${res.status}`);
    }
    const data = await res.json();
    if (data.plan) { Stats.savePlan(data.plan); pushIfSynced(); }
    container.innerHTML = '';
    const body = el('div', 'plan-body');
    body.innerHTML = renderMarkdown(data.plan || '');
    container.appendChild(body);
    btn.textContent = 'Regenerate';
  } catch (e) {
    container.innerHTML = '';
    const err = el('div', 'plan-error');
    err.textContent = 'Failed: ' + e.message + '. The AI plan needs the deployed backend with a model API key (HUNYUAN_API_KEY).';
    container.appendChild(err);
  } finally {
    btn.disabled = false;
  }
}

function renderMarkdown(md) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  const lines = String(md).split('\n');
  let html = '', inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    if (/^#{1,6}\s/.test(line)) {
      closeList();
      html += `<h4 class="plan-h">${inline(line.replace(/^#{1,6}\s/, ''))}</h4>`;
    } else if (/^[-*]\s/.test(line) || /^\d+\.\s/.test(line)) {
      if (!inList) { html += '<ul class="plan-ul">'; inList = true; }
      html += `<li>${inline(line.replace(/^([-*]|\d+\.)\s/, ''))}</li>`;
    } else if (line === '') {
      closeList();
    } else {
      closeList();
      html += `<p class="plan-p">${inline(line)}</p>`;
    }
  }
  closeList();
  return html;
}

// Calibrated BKT mastery meter (0-100%).
function masteryMeter(pct) {
  const wrap = el('div', 'mastery-meter');
  const fill = el('div', 'mastery-fill');
  fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  if (pct >= 80) fill.classList.add('high');
  else if (pct < 40) fill.classList.add('low');
  wrap.appendChild(fill);
  return wrap;
}

function closeStats() { state.showStats = false; render(); }

function renderPinRow() {
  const wrap = el('div', 'pin-row');
  const has = !!Stats.getPinHash();
  wrap.appendChild(el('div', 'pin-label', has ? '🔒 Parent PIN is on' : '🔓 No parent PIN set'));
  const btn = el('button', 'btn btn-ghost pin-btn', has ? 'Change / remove' : 'Set PIN');
  btn.onclick = () => {
    if (has) {
      const cur = prompt('Enter the current parent PIN:');
      if (cur === null) return;
      if (pinHash(cur.trim()) !== Stats.getPinHash()) { alert('Wrong PIN.'); return; }
      const next = prompt('Enter a new 4-digit PIN (leave blank to remove):');
      if (next === null) return;
      const t = next.trim();
      if (t === '') { Stats.setPin(null); pushIfSynced(); alert('Parent PIN removed.'); render(); return; }
      if (!/^\d{4}$/.test(t)) { alert('PIN must be 4 digits.'); return; }
      Stats.setPin(pinHash(t)); pushIfSynced(); alert('PIN updated.'); render();
    } else {
      const p1 = prompt('Set a 4-digit parent PIN:');
      if (p1 === null) return;
      if (!/^\d{4}$/.test(p1.trim())) { alert('PIN must be 4 digits.'); return; }
      const p2 = prompt('Enter it again to confirm:');
      if (p2 === null) return;
      if (p1.trim() !== p2.trim()) { alert('The two entries do not match.'); return; }
      Stats.setPin(pinHash(p1.trim())); pushIfSynced(); alert('Parent PIN set.'); render();
    }
  };
  wrap.appendChild(btn);
  return wrap;
}

function renderSyncSection() {
  const wrap = el('div', 'sync-section');
  wrap.appendChild(el('h3', 'stats-h3', '☁️ Sync across devices'));
  const row = el('div', 'sync-row');
  const input = document.createElement('input');
  input.className = 'sync-input';
  input.type = 'text';
  input.placeholder = 'Family code (same on every device)';
  input.autocomplete = 'off';
  input.value = getFamilyCode();
  const btn = el('button', 'btn btn-primary sync-btn', 'Save & sync');
  const status = el('div', 'sync-status', '');
  btn.onclick = async () => {
    const code = sanitizeCode(input.value);
    if (code.length < 3) {
      status.textContent = 'Family code needs at least 3 characters (letters/numbers/-/_).';
      status.className = 'sync-status err';
      return;
    }
    // If a parent PIN is set, changing the family code requires it.
    const current = getFamilyCode();
    if (Stats.getPinHash() && code !== current) {
      if (!parentGate()) { input.value = current; return; }
    }
    setFamilyCode(code);
    input.value = code;
    btn.disabled = true;
    status.textContent = 'Syncing…';
    status.className = 'sync-status';
    try {
      await cloudSync(code);
      // Report the merged streak right here — the #1 sync question is
      // "where is the flame", and the answer is in the merged data.
      const sk = Stats.streakStatus();
      status.textContent = sk.current > 0
        ? `✓ Synced — 🔥 ${sk.current}-day streak, refreshing…`
        : sk.lastDay
          ? `✓ Synced — last quiz was ${sk.lastDay} (UTC), so the streak has expired. Play today to start a new one!`
          : '✓ Synced — no quiz history in the cloud copy yet.';
      status.className = 'sync-status ok';
      // Re-render unconditionally: the topbar streak flame must reflect the
      // merged data even if the user closed the modal while sync ran.
      setTimeout(() => render(), 900);
    } catch (e) {
      status.textContent = 'Sync failed: ' + e.message + ' (Upstash must be configured).';
      status.className = 'sync-status err';
    } finally {
      btn.disabled = false;
    }
  };
  row.appendChild(input);
  row.appendChild(btn);
  wrap.appendChild(row);
  wrap.appendChild(status);
  wrap.appendChild(el('div', 'sync-hint', 'Enter the same family code on each device to share progress. Anyone who knows the code can read it, so pick one that is hard to guess.'));
  return wrap;
}

function spanTxt(text, cls) {
  const s = document.createElement('span');
  if (cls) s.className = cls;
  s.textContent = String(text);
  return s;
}

if (_resumed) { if (!state.submitted) runTicker(); } else { startTimer(); }
saveSession();
render();
setTimeout(() => {
  const first = document.querySelector('.ansbox');
  if (first) first.focus();
}, 100);

// Catch up on any thresholds already crossed by accumulated history (e.g.
// after a stats-engine upgrade), so unlocks happen on App open — not only
// at the end of the next quiz. Show the new-skill lesson if anything fires.
(function initCheckUnlocks() {
  const unlocked = Stats.checkUnlocks();
  if (unlocked) { state.showLesson = unlocked; render(); }
})();

// On load, if a family code is set, pull + merge cloud progress
(function initCloudSync() {
  const code = getFamilyCode();
  if (!code) return;
  cloudSync(code).then(() => {
    const unlocked = Stats.checkUnlocks();
    if (unlocked) state.showLesson = unlocked;
    // Don't rebuild the DOM (and steal the cursor) if the child is mid-answer;
    // the merged stats will surface on the next natural render.
    const typing = document.activeElement && document.activeElement.classList &&
      document.activeElement.classList.contains('ansbox');
    if (unlocked || !typing) render();
  }).catch(() => {});
})();

// PWA: register service worker for offline use. The fetch strategy is
// cache-first, so without an explicit update flow a long-lived install can
// run stale code for days — check for updates on every launch and again
// periodically, and swap in the new version as soon as it's safe.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(reg => {
      reg.update().catch(() => {});
      // Long-lived PWA sessions never navigate; poll while visible.
      setInterval(() => { if (!document.hidden) reg.update().catch(() => {}); }, 60 * 60 * 1000);
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state !== 'activated') return;
          // Never auto-reload: a navigation racing the child's tap makes
          // buttons feel dead. Show the chip; the next natural open runs
          // the new version anyway (the new SW has already taken over).
          state.updateReady = true; render();
        });
      });
    }).catch(() => {});
  });
}
</script>
</body>
</html>
