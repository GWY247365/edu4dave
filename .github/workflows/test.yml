# Tests gate production. Every push and pull request runs all suites:
#   test/api.mjs        cloud backups, anti-wipe guard, restore
#   test/ratelimit.mjs  daily limits on the paid AI endpoints
#   test/smoke.mjs      real-browser scenarios (grading, sync, word problems…)
#
# Production deploys happen ONLY from the deploy job below, and only after
# the test job has passed. Vercel's own Git auto-deploy is switched off in
# vercel.json (git.deploymentEnabled: false), so a red run means the release
# never reaches the device.
#
# The deploy job needs one repository secret:
#   VERCEL_TOKEN       a Vercel access token
# Optional overrides (normally not needed — resolved from the token):
#   VERCEL_PROJECT_ID  project id or name (default: edu4dave)
#   VERCEL_ORG_ID      owner id (default: looked up from the project)
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" button: redeploy the branch on demand

permissions:
  contents: read

env:
  SITE_URL: https://edu4dave.vercel.app

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true   # a newer push supersedes this run (and its deploy)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run all test suites
        run: npm test

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == 'claude/math-quiz-app-7CzcR'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false  # never interrupt a deploy that has started
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Only the token is required; the project and owner ids are looked up
      # with it. With Vercel's auto-deploy off, a missing or bad token means
      # nothing ships, so this fails loudly instead of passing green.
      - name: Resolve Vercel project
        run: node .github/scripts/vercel-ids.mjs >> "$GITHUB_ENV"

      # Diagnostic (temporary): if resolution fails, let the Vercel CLI try to
      # link the project on its own with this token, and report which owner
      # id it picks. Prints ids only, never the token.
      - name: Diagnose how the Vercel CLI links this project
        if: failure()
        run: |
          npm install --global vercel@latest >/dev/null 2>&1
          d=$(mktemp -d) && cd "$d"
          env -u VERCEL_ORG_ID -u VERCEL_PROJECT_ID vercel link --yes --project edu4dave --token="$VERCEL_TOKEN" 2>&1 | tail -15 || true
          echo "--- .vercel/project.json ---"
          cat .vercel/project.json 2>/dev/null || echo "(not created)"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Stamp the build with this commit so the live check below can tell a
      # fresh deploy apart from an old one serving the same app version.
      - name: Stamp build with commit
        run: printf '{"sha":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > build-info.json

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # Confirm the public site now serves exactly this commit.
      - name: Verify the live site
        run: |
          got=""
          for i in $(seq 1 12); do
            got=$(curl -fsS "$SITE_URL/build-info.json" | grep -oP '"sha":"\K[0-9a-f]+' || true)
            if [ "$got" = "$GITHUB_SHA" ]; then
              ver=$(curl -fsS "$SITE_URL/" | grep -oP "const APP_VERSION = '\K[^']+" || true)
              echo "Live site is serving commit $GITHUB_SHA (app $ver)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Live site is on commit '${got:-unknown}', expected $GITHUB_SHA"
          exit 1
